  if (PVP.on && !S.spectate) { PVP.hist.push({ t: 'end', w: S.winner, why: 'rs' }); pvpSpecSync(); }
  if (!PVP.on && !S.spectate) whRec({ t: 'end', w: S.winner, why: 'rs' });
  S.teams.forEach((t) => { t.breakReady = false; });
  freeze(false);
  if (who === 'me' && MODE === 'pvp' && PVP.phase === 'play') pvpPublish({ rs: PVP.n });   // 相手の画面も終わらせる
  log(who === 'me' ? 'リタイアした' : '相手がリタイアした');
  busy = true;
  try { await finale(); } finally { busy = false; flushLog(); render(); }
}
async function pvpForfeit(side) {

// ホスト:観戦者に送る記録(自分の側をチーム0として)
function pvpSpecSync() {

// 観戦:合言葉の部屋に、観戦者としてつなぐ
function specStart() {
  const code = $('roomCode').value.trim();
  if (!/^[0-9a-zA-Z]{2,12}$/.test(code)) { pvpStatus('合言葉は、英数字2〜12文字で入れてください。'); return; }
  if (!PVP.room || !PVP.room.spectate) return;

  PVP.room.spectate(code, (snap) => { PVP.specSnap = snap; pvpSpecShow(); });

}
function specStop() {

// 受け取った記録を画面に反映する(新しい対戦なら最初から、途中から入ったら早送りで追いつく)
let specBusy = false;
async function pvpSpecShow() {
  if (!PVP.spec) return;
  const snap = PVP.specSnap;
  if (PVP.room && PVP.room.status) pvpStatus(PVP.room.status());
  if (!snap) return;
  if (snap.v !== RULES_VER) { pvpStatus(`ゲームの版が違うため観戦できません(自分 ver ${RULES_VER.slice(0, 6)} / 部屋 ver ${String(snap.v || '?').slice(0, 6)})。ページを再読み込みしてください。`); return; }
  if (snap.wait || !Array.isArray(snap.teams)) { pvpStatus('つながりました。対戦の開始を待っています'); return; }
  if (specBusy) return;
  const teams = snap.teams.map((ids) => (Array.isArray(ids) ? ids.map(charById) : []));
  if (teams.some((t) => t.length !== TEAM_SIZE || t.some((c) => !c))) { pvpStatus('対戦の情報を読めませんでした'); return; }
  const hist = Array.isArray(snap.hist) ? snap.hist : [];
  const names = (snap.names || []).map((n) => String(n || '').replace(/[\u0000-\u001f]/g, '').slice(0, 12));
  specBusy = true;
  try {
    // 新しい対戦:最初から作り直し、ここまでの記録を早送りで流す
    if (snap.id !== PVP.specId || !S || !S.spectate) {
      PVP.specId = snap.id; PVP.specN = 0;
      await startMatch(teams[0], teams[1], names[1] || 'プレイヤー2', { spectate: true, label0: names[0] || 'プレイヤー1' });
      const fast = hist.slice(0, Math.max(0, hist.length - 1));   // 最後の1つだけは演出つきで見せる
      for (const e of fast) specApply(e, true);
      PVP.specN = fast.length;
      flushLog(); render();
    }
    while (PVP.specN < hist.length && S && S.spectate && !S.over) {
      const e = hist[PVP.specN++];
      busy = true;
      try { await specApply(e, false); } finally { busy = false; flushLog(); render(); }
    }
  } finally { specBusy = false; }
  if (PVP.specSnap !== snap) pvpSpecShow();   // 演出中に届いた記録
}
// 記録1つを流す。fast は演出なし(途中から入ったときの早送り)
async function specApply(e, fast) {
  if (!e || typeof e !== 'object') return;
  if (e.t === 'end') {
    if (S.over) return;
    S.over = true; S.winner = e.w === 1 ? 1 : 0;
    S.specWhy = e.why === 'ff' ? '(応答なし)' : '(リタイア)';
    S.teams.forEach((t) => { t.breakReady = false; });
    if (!fast) await finale();
    return;
  }
  if (e.t === 'r' && HANDS[e.a] && HANDS[e.b]) {
    if (fast) rally(S, e.a, e.b, logLater); else await normalRally(e.a, e.b, null);
  } else if (e.t === 'b' && HANDS[e.h] && (e.s === 0 || e.s === 1) && S.teams[e.s].breakReady) {
    if (fast) breakRally(S, e.s, e.h, logLater); else await (e.s === 0 ? playerBreak(e.h) : cpuBreak(e.h));
  }
}

// 1ラリーぶんを画面に流し、終わったら次のラリーへ進める
async function pvpApply(run, last, rec) {
  if (rec) { PVP.hist.push(rec); pvpSpecSync(); }
  PVP.applying = true; busy = true;
  render();
  try { await run(); } finally {
    busy = false; PVP.applying = false;
    PVP.n++; PVP.hand = null;
    pvpPublish({ n: PVP.n, c: null, r: null, b: null, last });
    flushLog(); render(); tickLoop();
  }
  if (!S.over && pvpTurn() === 'pick') setResult('手を選んでください');
  pvpStep();
}

// 手のボタンを押したとき(オンライン対人)
async function pvpPick(hand) {
  if (pvpLocked() || !S || S.over) return;
  const k = PVP.n;
  Sound.lever();
  if (pvpTurn() === 'mine') {
    PVP.hand = hand;
    pvpPublish({ b: hand });                                 // BREAKは同時に選ぶものではないので、そのまま知らせる
    await pvpApply(() => playerBreak(hand), { n: k, b: hand }, { t: 'b', s: 0, h: hand });
    return;
  }
  PVP.hand = hand; PVP.salt = rnd();
  pvpPublish({ c: seal(PVP.salt + '|' + k + '|' + hand), r: null });
  $('slotYou').textContent = HANDS[hand].icon;
  setResult('相手が手を選んでいます…');

  pvpStep();
}

async function sbFetch(path, { method = 'GET', body, auth = true, prefer } = {}) {

// 試合が終わったときに、称号用の数え上げをまとめて保存する(ログイン中、どのモードでも)
async function accRecordMatch(S) {
  if (!ACC.profile || ACC.progMode !== 'table' || S.spectate) return;   // 観戦では何も記録しない
  const s = ACC.stats = ACC.stats || {};
  const add = (k, n = 1) => { s[k] = (s[k] || 0) + n; };
  const max = (k, v) => { s[k] = Math.max(s[k] || 0, v); };
  const me = S.teams[0], ids = me.cards.map((c) => c.ch.id), win = S.winner === 0;
  add('rallies', S.rally);
  add('breaks', S.breaks || 0);
  add('rainbows', S.rainbows || 0);
  max('rainbowGame', S.rainbows || 0);
  max('maxHit', S.maxHit || 0);
  if (MODE === 'pvp') add('pvpPlayed');
  if (win) {
    s.charWins = [...new Set([...(s.charWins || []), ...ids])];
    const fb = me.cards[0].fac;
    if (fb) { add('bonusWins'); s['bonus_' + fb.faction] = 1; }
    if (me.cards.every((c) => c.result !== 'lose')) add('flawless');
    if (me.cards[0].result !== 'lose' && S.teams[1].cards.length === TEAM_SIZE && !(S.stage && S.stage.rush)) add('single');
    const sid = S.stage && S.stage.id;
    if (sid) [...new Set(me.cards.map((c) => c.ch.faction))].forEach((f) => { s['solo_' + f] = 1; });
    if (sid === 'x5' && S.rewinds) s.rewindWin = 1;
    if ((sid === 'x5' || (S.stage && S.stage.rush)) && ids.includes('kaji')) s.kajiXeno = 1;
    if (sid === 't4' && fb) s.facToki = 1;
    if (sid === 'k5' && ids.includes('p_tokibami')) s.tokiShi = 1;
    if (sid === 't4' && ['kaji', 'rei', 'tsuru'].every((id) => ids.includes(id))) s.trioToki = 1;
  }
  if (S.stage && S.stage.rush) max('rushBest', rushCount(S.teams[1]));
  try { await sbFetch(`/rest/v1/progress?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { stats: s, updated_at: new Date().toISOString() } }); } catch (e) { /* 次に保存するときにまとめて送られる */ }
  await accUnlockTitles();
}
// 称号用の数え上げ(BREAKでとどめを刺した回数など)。ログイン中だけ数える
async function accAddStat(key, n = 1) {
  if (!ACC.profile || ACC.progMode !== 'table' || (S && S.spectate)) return;
  ACC.stats = ACC.stats || {};
  ACC.stats[key] = (ACC.stats[key] || 0) + n;

  await accUnlockTitles();
}
// オンライン対人の結果でレーティングを更新する(イロレーティング)。score:勝ち1、引き分け0.5、負け0
// base は対戦前の自分の記録 { rating, wins, losses }。score:勝ち1、引き分け0.5、負け0
function rateAfter(base, foeRating, score) {
  const expect = 1 / (1 + Math.pow(10, (foeRating - base.rating) / 400));
  return { rating: Math.max(100, Math.round(base.rating + RATING_K * (score - expect)) + (score === 1 ? 1 : 0)), wins: base.wins + (score === 1 ? 1 : 0), losses: base.losses + (score === 0 ? 1 : 0) };
}
// 切断対策:レーティング戦が始まった時点で、先に「負け」として保存しておく。
// 決着すれば正しい結果に直すので、途中でページを閉じたり接続を切ったりすると負けのまま残る
// SQL(6回目)を実行する前のサーバーには関数がない。そのときだけ、以前の方式(自分のブラウザで計算して保存)を使う
const isMissingFn = (e) => e && (e.status === 404 || e.code === 'PGRST202');
const ratePatch = (next) => sbFetch(`/rest/v1/profiles?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { ...next, updated_at: new Date().toISOString() } });
// foe:サーバーで確かめた相手 { id, r }。key:この対戦の合言葉(両方の端末で同じ値になる)
async function accRateStart(foe, key) {
  const p = ACC.profile;
  if (!p) return;
  const base = { rating: p.rating, wins: p.wins, losses: p.losses };
  const pd = ACC.pending = { base, foeRating: foe.r, foeId: foe.id, key, mode: null, streak: (ACC.stats || {}).curStreak || 0 };
  if (ACC.stats && ACC.progMode === 'table' && ACC.stats.curStreak) {
    ACC.stats.curStreak = 0;
    sbFetch(`/rest/v1/progress?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { stats: ACC.stats } }).catch(() => null);
  }
  ACC.pendingP = (async () => {
    try {
      await verRpc('rate_start', { p_key: key, p_foe: foe.id });
      pd.mode = 'server';
    } catch (e) {
      if (e.code === 'KV001') { verOld(); return; }   // 古い版:サーバーがレートを動かさない
      if (e.code === 'KS001') pd.limit = true;   // 同じ相手とのレート戦は1日5回まで(supabase/schema.sql の7回目)
      if (!isMissingFn(e)) return;   // サーバーに断られた・つながらなかった:この対戦ではレートを動かさない
      try { await ratePatch(rateAfter(base, foe.r, 0)); pd.mode = 'legacy'; } catch (e2) { /* 保存できなければレートを動かさない */ }
    }
  })();
  await ACC.pendingP;
  return pd.limit ? 'limit' : pd.mode;
}
async function accRateFinish(score) {
  const pd = ACC.pending, p = ACC.profile;
  if (!pd || !p) return null;
  await ACC.pendingP;
  if (!pd.mode) return null;
  try {
    let next;
    if (pd.mode === 'server') {
      const r = await sbFetch('/rest/v1/rpc/rate_finish', { method: 'POST', body: { p_key: pd.key, p_foe: pd.foeId, p_score: score } });
      if (!r || typeof r.rating !== 'number') return null;
      next = { rating: r.rating, wins: r.wins, losses: r.losses };
    } else {
      next = rateAfter(pd.base, pd.foeRating, score);
      await ratePatch(next);
    }
    ACC.pending = null;
    Object.assign(p, next);
    if (ACC.stats && ACC.progMode === 'table') {
      const s = ACC.stats;
      s.curStreak = score === 1 ? pd.streak + 1 : 0;
      s.bestStreak = Math.max(s.bestStreak || 0, s.curStreak);
      s.bestRating = Math.max(s.bestRating || 0, next.rating);
      try { await sbFetch(`/rest/v1/progress?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { stats: s } }); } catch (e) { /* 次に保存するときにまとめて送られる */ }
    }
    renderAcct();
    accUnlockTitles();
    return { before: pd.base.rating, after: next.rating };
  } catch (e) { return null; }
}

// 実在しない・自分自身・どちらかがログインしていない場合は null(レーティングなし)
async function accVerifyFoe(acc) {
  if (!ACC.profile || !acc || typeof acc.id !== 'string' || !/^[0-9a-zA-Z-]{1,64}$/.test(acc.id) || acc.id === ACC.profile.id) return null;
  try {
    const rows = await sbFetch(`/rest/v1/profiles?id=eq.${encodeURIComponent(acc.id)}&select=*`);

    return p && typeof p.rating === 'number' ? { id: p.id, r: p.rating, name: String(p.name).slice(0, 12), title: p.title || '' } : null;
  } catch (e) { return null; }
}

// サーバーの表に称号の列があるか(まだSQLを実行していない場合に備える)
const titleReady = () => TITLES_ON && !!ACC.profile && Array.isArray(ACC.profile.titles);
const myTitles = () => (titleReady() ? ACC.profile.titles : []);
// 条件を満たした称号を解放して保存する(一度解放したら消えない)
// 同時に呼ばれても二重に解放しないよう、1つずつ順番に処理する
function accUnlockTitles() {
  ACC.unlockChain = (ACC.unlockChain || Promise.resolve()).then(unlockTitlesNow, unlockTitlesNow);
  return ACC.unlockChain;
}
async function unlockTitlesNow() {
  const p = ACC.profile;
  if (!titleReady()) return;
  const c = { cleared: SOLO.cleared, wins: p.wins, rating: p.rating, stats: ACC.stats || {} };
  const add = TITLES.filter((t) => !p.titles.includes(t.id) && t.test(c)).map((t) => t.id);
  if (!add.length) return;
  const next = [...p.titles, ...add];
  try {
    await sbFetch(`/rest/v1/profiles?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { titles: next } });
    p.titles = next;
    renderAcct();
    // 解放したことは、メニュー(キャラ選択)に戻ったときにカットインで知らせる
    ACC.newTitles = [...new Set([...(ACC.newTitles || []), ...add])];
    showNewTitles();
  } catch (e) { /* 次の機会に保存する */ }
}
// 解放した称号を、メニューにいるときに1つずつカットインで見せる(対戦中は、メニューに戻るまで待つ)
let titleFxBusy = false;
async function showNewTitles() {
  if (titleFxBusy || !ACC.newTitles || !ACC.newTitles.length) return;
  if (!$('battle').classList.contains('hidden') || busy) return;
  titleFxBusy = true;
  try {
    // 一度にたくさん解放したとき(初めてログインしたときなど)は、まとめて1回で知らせる
    if (ACC.newTitles.length > 3) {
      const list = ACC.newTitles.splice(0).map(titleOf).filter(Boolean);
      const top = Math.max(...list.map((t) => t.tier));
      Sound.wake(); Sound.cue(top >= 4 ? 4 : 2);
      await cutin(`称号を${list.length}個解放`, list.slice(0, 3).map((t) => t.name).join('・') + (list.length > 3 ? ' ほか' : ''), top >= 5 ? 'rainbow' : 'gold', 2000);
    }
    while (ACC.newTitles.length && $('battle').classList.contains('hidden')) {
      const t = titleOf(ACC.newTitles.shift());
      if (!t) continue;
      Sound.wake(); Sound.cue(t.tier >= 4 ? 4 : 2);
      if (t.tier >= 5) Particles.shower(COLORS.rainbow, 120);
      await cutin(t.name, `${'★'.repeat(t.tier)} 称号解放`, t.tier >= 5 ? 'rainbow' : t.tier === 4 ? 'violet' : 'gold', 1600);
    }
  } finally { titleFxBusy = false; }
}
// 称号一覧の解放人数:その称号を持っているプレイヤーの人数
async function accLoadTitleStats() {
  try {
    const rows = await sbFetch('/rest/v1/profiles?select=titles&limit=10000');
    const cnt = {};
    rows.forEach((r) => (r.titles || []).forEach((id) => { cnt[id] = (cnt[id] || 0) + 1; }));
    ACC.titleStats = { total: rows.length, cnt };
  } catch (e) { ACC.titleStats = null; }
}

async function accLoadRanking() {
  const cols = 'id,name,rating,wins,losses' + (titleReady() ? ',title' : '') + (favReady() ? ',fav' : '');
  try { ACC.ranking = await sbFetch(`/rest/v1/profiles?select=${cols}&order=rating.desc&limit=20`); }
  catch (e) { ACC.ranking = null; }
  // 称号「頂に立つ者」:ランキングの1位(対人で1回以上戦っていること)
  const top = ACC.ranking && ACC.ranking[0], p = ACC.profile;
  if (p && top && top.id === p.id && p.wins + p.losses > 0 && !(ACC.stats || {}).top) await accAddStat('top');
}

// ----- 空間のカケラ:オンライン対人で手に入る(のちにガチャで使う) -----
// フリー戦:勝ち20・負け5(引き分けも5)。レート戦:勝ち30・負け0。自分のリタイアや応答なしで負けたときはもらえない。
// ログイン中はアカウント(progress の stats.shards)、ログインしていないときは端末に貯める
const SHARD_NAME = '空間のカケラ';

const shardOnAcc = () => !!accUid() && ACC.progMode === 'table';   // アカウントに貯めるか(サーバーの表が使えるとき)
function shardCount() {

}

  const win = S.winner === 0, quit = S.resign === 'me' || S.forfeit === 1;

}
async function shardAdd(n) {
  if (!n) return shardCount();
  if (shardOnAcc()) {
    ACC.stats = ACC.stats || {};
    ACC.stats.shards = (Number(ACC.stats.shards) || 0) + n;
    try { await sbFetch(`/rest/v1/progress?id=eq.${accUid()}`, { method: 'PATCH', prefer: 'return=minimal', body: { stats: ACC.stats, updated_at: new Date().toISOString() } }); } catch (e) { /* 次に保存するときにまとめて送られる */ }
    return ACC.stats.shards;

}

// ----- ガチャ:空間のカケラ25個で1回、250個で11回。ログインが必要 -----
// 確率:★5 0.1% / ★4 1%(3体で等分)/ ★3 30% / ★2 30.9% / ★1 38%。同じ★の中は等分。ダブりはそのまま数える。保証はなし
// 持っているキャラは、アカウントの progress の stats.owned({ id: 枚数 })に保存する

const GACHA_RATES = { 5: 0.001, 4: 0.01, 3: 0.30, 2: 0.309, 1: 0.38 };

  const hi = { 5: 0.003, 4: 0.03, 3: GACHA_RATES[3] };

}

  const cost = times === 11 ? GACHA_COST11 : GACHA_COST * times;

  const got = Array.from({ length: times }, gachaRoll);
  const owned = { ...(ACC.stats.owned || {}) };
  const fresh = got.map((c) => { const n = !owned[c.id]; owned[c.id] = (Number(owned[c.id]) || 0) + 1; return n; });
  ACC.stats.shards = shardCount() - cost;
  ACC.stats.owned = owned;

}

// ===== フレンド(ログインが必要)=====

const FR = { me: null, list: [], ready: null };

const frRpc = (name, body) => sbFetch(`/rest/v1/rpc/${name}`, { method: 'POST', body: body || {} });
async function frLoad() {
  if (!accUid()) { FR.me = null; FR.list = []; renderFriendBadge(); return; }
  try {
    FR.me = await frRpc('friend_me');

  } catch (e) { if (isMissingFn(e)) FR.ready = false; }
  renderFriendBadge(); watchHostSync(); auditHostSync(); frBeat(true);
  frReward();
}
// はじめてフレンドができたら、空間のカケラ200個(1アカウント1回だけ。もらったかはサーバーに記録する。SQLの9回目)
const FRIEND_BONUS = 200;

async function frReward() {
  if (frRewarding || !FR.list.some((f) => f.state === 'ok') || (ACC.stats && ACC.stats.friendGot) || !shardOnAcc()) return;
  frRewarding = true;
  try {
    if (!(await frRpc('friend_reward'))) { ACC.stats.friendGot = 1; return; }   // もうもらっている

    const total = await shardAdd(FRIEND_BONUS);
    renderTitleAcc(); renderAcct();

  } catch (e) { /* 関数がまだない(SQLの9回目の前)・通信の失敗:次に開いたときにもう一度 */ }

// ページを開いている間、1分ごとに「今の状況」を知らせる(ログイン中の表示に使う)。対戦の始まり・終わりにもすぐ知らせる

// ----- フレンドのソロ観戦:遊ぶ側(部屋を開いて、記録を送る) -----
// 部屋の名前は、フレンドにしか読めない「観戦の鍵」から作る。鍵がないと部屋を見つけられないので、フレンド以外は入れない
const WH = { peer: null, key: '', open: false, specs: [], snap: null, hist: [], id: '' };
async function watchHostSync() {
  const key = accUid() && FR.ready && FR.me && !FR.me.off ? FR.me.key : '';
  if (!key) { watchHostClose(); return; }
  if (WH.peer && WH.key === key) return;
  watchHostClose();
  if (!(window.Peer || await loadScript('vendor/peerjs.min.js')) || !window.Peer) return;
  WH.key = key;
  const p = WH.peer = new window.Peer('kokusen-watch-' + key.toLowerCase());
  p.on('open', () => { if (WH.peer === p) { WH.open = true; frBeat(true); } });
  p.on('connection', (c) => {
    if (WH.specs.filter((x) => !x.audit).length >= SPEC_MAX) { c.on('open', () => { try { c.send({ full: 1 }); } catch (e) { /* 閉じるだけ */ } setTimeout(() => c.close(), 300); }); return; }
    WH.specs.push(c);
    const drop = () => { WH.specs = WH.specs.filter((x) => x !== c); if (S && !S.spectate) render(); };
    c.on('open', () => { whSend(c); if (S && !S.spectate) render(); });
    c.on('close', drop); c.on('error', drop);
  });
  p.on('disconnected', () => { if (WH.peer === p) { try { p.reconnect(); } catch (e) { /* つながらなければ次の更新で作り直す */ } } });
  p.on('error', (e) => { if (WH.peer === p && e.type === 'unavailable-id') { WH.open = false; } });   // 別のタブで開いているときは、そちらが受け付ける
}
function watchHostClose() {
  try { if (WH.peer) WH.peer.destroy(); } catch (e) { /* すでに閉じている */ }
  Object.assign(WH, { peer: null, key: '', open: false, specs: WH.specs.filter((c) => c.audit) });   // 運営の観戦はそのまま
}
// ----- 運営(マスター)の観戦(不正対策):ログイン中は、フレンドの観戦の設定に関係なく、運営だけが入れる部屋を開く -----
// 部屋の名前は、本人と運営にしか返さない「運営観戦の鍵」から作る(SQLの11回目)。運営の観戦者は、見られている側には出さない(出すと、その時だけ不正を控えられるため)
const AUD = { peer: null, uid: '', ready: true };
async function auditHostSync() {
  const uid = accUid();
  if (!uid || !AUD.ready) { auditHostClose(); return; }
  if (AUD.peer && AUD.uid === uid) return;
  auditHostClose();
  let key = '';
  try { key = await frRpc('audit_me', {}); } catch (e) { if (isMissingFn(e)) AUD.ready = false; return; }
  if (typeof key !== 'string' || !/^[0-9A-Z]{8,32}$/.test(key) || accUid() !== uid || AUD.peer) return;
  if (!(window.Peer || await loadScript('vendor/peerjs.min.js')) || !window.Peer) return;
  AUD.uid = uid;
  const p = AUD.peer = new window.Peer('kokusen-audit-' + key.toLowerCase());
  p.on('connection', (c) => {
    c.audit = true;
    WH.specs.push(c);
    const drop = () => { WH.specs = WH.specs.filter((x) => x !== c); };
    c.on('open', () => whSend(c));
    c.on('close', drop); c.on('error', drop);
  });
  p.on('disconnected', () => { if (AUD.peer === p) { try { p.reconnect(); } catch (e) { /* 次の更新で作り直す */ } } });
  p.on('error', (e) => { if (AUD.peer === p && e.type === 'unavailable-id') { AUD.peer = null; AUD.uid = ''; } });   // 別のタブで開いているときは、そちらが受け付ける
}
function auditHostClose() {
  try { if (AUD.peer) AUD.peer.destroy(); } catch (e) { /* すでに閉じている */ }
  AUD.peer = null; AUD.uid = '';

// ----- フレンドのソロ観戦:見る側 -----
const FW = { on: false, peer: null, snap: null, id: null, n: 0, who: '' };
async function fwStart(f) {
  fwStop(true);
  if (PVP.spec) specStop();
  if (PVP.on && PVP.phase !== 'idle') pvpLeave();
  if (MODE === 'pvp') { MODE = 'cpu'; PVP.on = false; renderMode(); }
  if (!(window.Peer || await loadScript('vendor/peerjs.min.js')) || !window.Peer) { frToast('この端末では観戦できません'); return; }
  Object.assign(FW, { on: true, snap: null, id: null, n: 0, who: String(f.name).slice(0, 12) });
  $('sheet').classList.add('hidden');
  const me = FW.peer = new window.Peer();
  const myName = ACC.profile ? String(ACC.profile.name).slice(0, 12) : 'フレンド';
  me.on('open', () => {
    const c = me.connect((f.audit ? 'kokusen-audit-' : 'kokusen-watch-') + String(f.key).toLowerCase(), { reliable: true, serialization: 'json', metadata: { spec: 1, name: myName } });
    c.on('data', (d) => {
      if (!d || typeof d !== 'object' || FW.peer !== me) return;
      if (d.full) { frToast('観戦できるのは5人までです。いっぱいでした'); fwStop(true); return; }
      if (d.spec && typeof d.spec === 'object') { FW.snap = d.spec; fwShow(); }
    });

  });
  me.on('error', (e) => { if (FW.peer !== me) return; frToast(e.type === 'peer-unavailable' ? `${FW.who}さんは今、観戦を受け付けていません` : `つながりませんでした(${e.type})`); fwStop(true); });
}
let fwBusy = false;
async function fwShow() {
  if (!FW.on || !FW.snap) return;
  const snap = FW.snap;
  if (snap.v !== RULES_VER) { frToast('ゲームの版が違うため観戦できません。ページを再読み込みしてください'); fwStop(true); return; }
  if (snap.wait || !Array.isArray(snap.team)) { if (!S || !S.spectate || S.over) frToast(`${FW.who}さんの次の対戦を待っています…`); return; }
  if (fwBusy) return;
  const team = snap.team.map(charById), st = snap.stage ? STAGES.find((x) => x.id === snap.stage) : null;
  const foes = st ? null : (snap.foes || []).map(charById);
  if (team.length !== TEAM_SIZE || team.some((c) => !c) || (!st && (!foes || foes.length !== TEAM_SIZE || foes.some((c) => !c)))) { frToast('対戦の情報を読めませんでした'); return; }
  const hist = Array.isArray(snap.hist) ? snap.hist : [];
  const name = String(snap.name || FW.who).replace(/[\u0000-\u001f]/g, '').slice(0, 12);
  fwBusy = true;
  try {
    // 新しい対戦:最初から作り直し、ここまでの記録を早送りで流す(途中から入っても追いつく)
    if (snap.id !== FW.id || !S || !S.spectate) {
      FW.id = snap.id; FW.n = 0;
      const o = { spectate: true, label0: name };
      if (st) await startMatch(team, stageFoes(st), '敵', { ...o, level: st.level, read: st.read, stage: st, noDecay: true });
      else await startMatch(team, foes, 'CPU', { ...o, level: snap.level });
      const fast = hist.slice(0, Math.max(0, hist.length - 1));   // 最後の1つだけは演出つきで見せる
      for (const e of fast) specApply(e, true);
      FW.n = fast.length;
      flushLog(); render();
    }
    while (FW.n < hist.length && S && S.spectate && !S.over && FW.on) {
      const e = hist[FW.n++];
      busy = true;
      try { await specApply(e, false); } finally { busy = false; flushLog(); render(); }
    }
  } finally { fwBusy = false; }
  if (FW.snap !== snap) fwShow();   // 演出中に届いた記録
}
function fwStop(quiet) {
  const was = FW.on;

  try { if (FW.peer) FW.peer.destroy(); } catch (e) { /* すでに閉じている */ }

    S.over = true; clearTimeout(tickTimer); Aura.stop(); Bgm.play('menu');
    $('battle').classList.add('hidden'); $('select').classList.remove('hidden'); document.body.classList.remove('in-battle');
    renderMode();
  }
  frBeat(true);
}

function mailUnread() {

async function mailSave() {

// プレゼントを受け取る(1つのメールにつき1回だけ)
async function mailClaim(ids) {
  const got = mailStat('mailGot').slice(), todo = mailLive().filter((m) => ids.includes(m.id) && m.gift && !got.includes(m.id));

// ----- 招待コード:作って1日以内のアカウントが、ほかの人の招待コードを入れると、お互いに空間のカケラ700個 -----
// コードは profiles.invite_code(サーバーがIDから作る8文字)。招待の記録は invites 表(1人1回、作って1日以内だけ登録できる)
// 招待した側は、ログインしたときに新しい招待を見つけて受け取る(受け取った分は progress の stats.inviteGot)
const INVITE_BONUS = 700;
const INVITE_MAX = 5;   // 1人が招待できる(ボーナスを受け取れる)のは5人まで。サーバー側でも止める
const inviteReady = () => !!(ACC.profile && ACC.profile.invite_code);
const accIsNew = () => { const t = ACC.session && ACC.session.user && ACC.session.user.created_at; return !!t && Date.now() - new Date(t).getTime() < 24 * 3600 * 1000; };
// 招待した人への受け取り(ログインのたびに確かめる)
async function inviteCollect() {
  if (!shardOnAcc() || !inviteReady()) return 0;
  let rows = [];
  try { rows = await sbFetch(`/rest/v1/invites?inviter=eq.${accUid()}&select=invitee`) || []; } catch (e) { return 0; }
  ACC.inviteN = rows.length;
  const got = mailStat('inviteGot'), fresh = rows.map((r) => r.invitee).filter((id) => !got.includes(id)).slice(0, Math.max(0, INVITE_MAX - got.length));
  if (!fresh.length) return 0;
  ACC.stats.inviteGot = [...got, ...fresh];
  await shardAdd(INVITE_BONUS * fresh.length);
  renderTitleAcc(); renderAcct();
  await cutin('招待ボーナス', `${fresh.length}人が招待コードを使いました　💠+${INVITE_BONUS * fresh.length}`, 'gold', 1600);
  return fresh.length;
}
// 招待された人:コードを入れる
async function inviteUse(code) {
  code = String(code || '').trim().toUpperCase();
  if (!/^[0-9A-F]{8}$/.test(code)) throw new Error('招待コードは8文字(英数字)です。');
  if (code === ACC.profile.invite_code) throw new Error('自分の招待コードは使えません。');
  const rows = await sbFetch(`/rest/v1/profiles?invite_code=eq.${code}&select=id,name`);
  const who = rows && rows[0];
  if (!who) throw new Error('その招待コードは見つかりませんでした。');
  let n = 0;
  try { n = Number(await sbFetch('/rest/v1/rpc/invite_count', { method: 'POST', body: { u: who.id } })) || 0; } catch (e) { /* 数えられなくても、サーバー側で止まる */ }
  if (n >= INVITE_MAX) throw new Error(`その招待コードは、もう${INVITE_MAX}人に使われています(1人${INVITE_MAX}人まで)。`);
  try { await sbFetch('/rest/v1/invites', { method: 'POST', prefer: 'return=minimal', body: { invitee: accUid(), inviter: who.id } }); } catch (e) {
    if (e.code === '23505' || e.status === 409) throw new Error('招待コードは、もう使っています(1回だけ)。');
    if (e.code === '42501' || e.status === 403) throw new Error(`招待コードを使えるのは、アカウントを作ってから1日以内だけです(または、そのコードがもう${INVITE_MAX}人に使われています)。`);
    throw e;
  }
  ACC.stats.inviteUsed = who.id;
  await shardAdd(INVITE_BONUS);
  renderTitleAcc(); renderAcct();
  return `${String(who.name).slice(0, 12)}さんの招待コードを使いました。お互いに空間のカケラ${INVITE_BONUS}個!`;
}

function renderSelect() {

  if (dr === 'ban' || dr === 'pick') picked = PVP.draft.picks.slice();

  rankBox(dr);
  if (dr) $('pickTitle').textContent = dr === 'ban' ? 'BANするキャラを1体選ぶ' : dr === 'pick' ? '交互に1体ずつ取る(3体)' : '取った3体を出す順に並べる';
  // 選んだ3枚(押すと外す)

    b.disabled = !ch || locked || (!!dr && dr !== 'order');

  }
  // 陣営ボーナスの案内

  picked = picked.filter((id) => charById(id) && charUnlocked(charById(id)));
  const fb = factionBonus(picked.map((id) => charById(id)));
  $('bonusNote').innerHTML = fb
    ? `<b style="color:var(--gold)">陣営ボーナス発動:${fb.faction}の3枚で、全員に${fb.text}</b>`
    : `陣営ボーナス:同じ陣営で3枚そろえると全員に効果(錨 ${FACTION_BONUS['錨'].text} / 零 ${FACTION_BONUS['零'].text} / 矢 ${FACTION_BONUS['矢'].text})`;
  // 陣営のボタン(その陣営から選んだ枚数も出す)
  if (!$('factions').children.length) {
    FACTIONS.forEach((f) => {
      const b = document.createElement('button');
      b.dataset.f = f;
      b.onclick = () => { selFaction = f; Sound.click(); renderSelect(); };
      $('factions').appendChild(b);
    });
  }
  [...$('factions').children].forEach((b) => {
    const n = picked.filter((id) => charGroup(charById(id)) === b.dataset.f).length;
    b.innerHTML = `${b.dataset.f}${n ? `<span class="n">${n}枚</span>` : ''}`;
    b.classList.toggle('picked', b.dataset.f === selFaction);

    $('charList').appendChild(note);
  }
  $('charList').className = 'cgrid';
  ALL_CHARS.filter((ch) => charGroup(ch) === selFaction && inFormat(ch)).forEach((ch) => {
    const order = picked.indexOf(ch.id);
    const b = document.createElement('button');
    b.dataset.id = ch.id;
    b.className = 'ctile';
    if (order >= 0) b.classList.add('picked');
    const unlocked = charUnlocked(ch);
    const clash = order < 0 && (sameClash(ch, picked) || highFull(ch, picked));
    const full = order < 0 && picked.length >= TEAM_SIZE;
    const dt = dr ? rankTileState(ch, dr) : null;   // ランク戦:BAN・相手が取った・番ではない など
    const off = dt ? dt.off : !unlocked || clash || full || locked;
    b.classList.toggle('off', off && order < 0);
    b.classList.toggle('locked', !unlocked);
    b.innerHTML = `${order >= 0 ? `<i class="ord">${order + 1}</i>` : ''}${unlocked ? '' : '<span class="lk">🔒</span>'}${iconHtml(ch, 'lg')}${secretOn(ch) && !ch.secretUnlock && !unlocked ? '' : rarHtml(ch)}<span class="nm">${dispName(ch)}</span>${dt && dt.tag ? `<span class="dtag${dt.foe ? ' foe' : ''}">${dt.tag}</span>` : ''}`;
    b.setAttribute('aria-label', `${dispName(ch)}${order >= 0 ? `(${order + 1}番手)` : ''}。長押しで詳細`);
    const tap = () => {
      if (dr && dr !== 'order') { rankTap(ch, dt); return; }   // ランク戦のBAN・ピック
      if (dr === 'order' && !PVP.draft.picks.includes(ch.id)) { openCharDetail(ch); return; }   // 並べ替えは、自分が取った3体だけ
      if (!unlocked) { openCharDetail(ch); return; }          // 鍵つきは、押すと解放条件を見せる
      if (locked) return;
      if (order >= 0) picked.splice(order, 1);
      else if (clash || full) { openCharDetail(ch); return; }
      else picked.push(ch.id);
      Sound.click();

  const full = choosingFoe() ? myPicks().length === TEAM_SIZE && foePicks().length === TEAM_SIZE : picked.length === TEAM_SIZE;
  const ng = full ? teamNg(myPicks()) || (choosingFoe() ? teamNg(foePicks()) : '') : '';
  if (!PVP.on && (!full || ng)) {
    const chainSt = MODE === 'solo' && STAGES.find((x) => x.id === SOLO.stage && x.chainFrom);
    $('start').disabled = true;
    $('start').textContent = chainSt ? 'このステージは直接挑めません' : ng || (choosingFoe() && myPicks().length === TEAM_SIZE ? `CPUのパーティをあと${TEAM_SIZE - foePicks().length}枚選ぶ` : choosingFoe() && pickSide === 'foe' && foePicks().length === TEAM_SIZE ? `あなたのパーティをあと${TEAM_SIZE - myPicks().length}枚選ぶ` : `あと${TEAM_SIZE - picked.length}枚選ぶ`);
  } else if (!PVP.on) {
    const chainSt = MODE === 'solo' && STAGES.find((x) => x.id === SOLO.stage && x.chainFrom);
    $('start').disabled = !full || !!chainSt;
    $('start').textContent = chainSt ? `${'★'.repeat(STAGES.find((x) => x.id === chainSt.chainFrom).stars)}「${STAGES.find((x) => x.id === chainSt.chainFrom).name}」のクリア直後のみ挑めます`
      : full ? (MODE === 'solo' ? 'この順番でステージに挑む' : 'この順番で対戦開始') : `あと${TEAM_SIZE - picked.length}枚選ぶ`;
  } else {
    // オンライン対人:部屋に入ってからキャラを決める。決めたあとは選び直せない
    const dr2 = PVP.rank && PVP.draft && PVP.phase === 'lobby' ? rankStage() : null;
    $('start').disabled = !full || PVP.phase !== 'lobby' || (!!dr2 && dr2 !== 'order');
    $('start').textContent = dr2 === 'ban' ? 'BANするキャラを選ぶ' : dr2 === 'pick' ? 'キャラを取り合っています' : PVP.phase === 'idle' ? '先に合言葉で部屋に入る' : PVP.phase === 'ready' ? '準備完了。相手を待っています…' : full ? '準備完了' : `あと${TEAM_SIZE - picked.length}枚選ぶ`;
  }
}

function start() {
  if (PVP.on) return pvpReady();
  teamPicks[pickSide] = picked;
  const mine = teamPicks.me.map((id) => charById(id));
  if (MODE === 'solo') {
    const st = STAGES.find((x) => x.id === SOLO.stage);
    if (st.chainFrom || !corrOpen(st)) return;   // 直後にしか挑めないステージ・前の段が未クリアの回廊は、ここからは始めない
    return startSolo(mine, st);
  }
  // CPUのパーティ:自分で選んだならそれ、おまかせなら区分けに合うキャラからランダム(ガチャキャラはアドバンスのときだけ)
  const pool = CHARACTERS.concat(fmtNow() === 'advance' ? ALL_CHARS.filter((c) => c.gacha) : []);
  const foes = choosingFoe() && teamPicks.foe.length === TEAM_SIZE ? teamPicks.foe.map(charById) : (() => { for (;;) { const t = shuffled(pool).slice(0, TEAM_SIZE); if (!teamNg(t.map((c) => c.id))) return t; } })();
  return startMatch(mine, foes, 'CPU');
}
// opt:level はCPUの深さ、read はボスが読みに頼る割合、stage はソロのステージ、noDecay は刻の抜け落ちを止める
const startSolo = (mine, st) => startMatch(mine, stageFoes(st), '敵', { level: st.level, read: st.read, stage: st, noDecay: true });
let LAST_MATCH = null;   // 再挑戦用:直前に始めた対戦の中身
async function startMatch(mine, theirs, foeLabel, opt = {}) {
  LAST_MATCH = { mine, theirs, foeLabel, opt };
  S = newMatch(mine, theirs);
  S.teams[1].label = foeLabel;
  if (opt.label0) S.teams[0].label = opt.label0;
  S.spectate = !!opt.spectate;
  S.cpuLevel = opt.level || FX.level;
  S.bossRead = opt.read || 0;
  S.stage = opt.stage || null;
  S.noDecay = !!opt.noDecay;
  if (!S.spectate && !PVP.on) whStart(mine, theirs, opt); else WH.snap = null;   // フレンドの観戦用の記録を始める
  $('log').innerHTML = '';
  logBuf = [];
  freeze(false);
  $('slotYou').textContent = $('slotCpu').textContent = '?';
  setStage('', '');
  $('dmgLine').innerHTML = '';
  setResult('手を選んでください');
  $('select').classList.add('hidden');
  $('battle').classList.remove('hidden');
  $('logPanel').classList.add('hidden');
  $('logBtn').textContent = 'ログを見る';
  document.body.classList.add('in-battle');
  window.scrollTo(0, 0);
  busy = true;
  render();
  Sound.wake();
  Bgm.play(opt.stage ? opt.stage.bgm || 'main' : battleBgmNow());   // ソロはステージの曲、CPU戦・対人は設定の曲
  Aura.stop();
  if (opt.stage && opt.stage.bgm2) Bgm.ready(opt.stage.bgm || 'main').then(() => Bgm.prepare(opt.stage.bgm2));   // 途中で切り替える曲(天眼の果ての第2形態)は、最初の曲が鳴ってから読み込んでおく(同時に読むと最初の曲が遅れる)
  if (opt.stage && opt.stage.aura) setTimeout(() => Aura.start(opt.stage.aura), 50);   // ★5ツル戦:初めから赤いオーラ
  Sound.cue(2);
  if (S.stage && S.stage.id === 'x5') {
    Sound.breakIn();
    await cutin(nameOf(active(S.teams[1])), '始まりの前', 'evil', 1500);
  } else if (S.stage && S.stage.id === 'k5') {
    clearTimeout(tickTimer); Sound.breakIn(); flash('#ffffff');
    await cutin('カジ【始】', 'ここが、始まりだ', 'evil', 1600);
  } else if (S.stage && S.stage.id === 'k4') {
    clearTimeout(tickTimer); Sound.breakIn();
    await cutin('カジ', '激戦の余波', 'gold', 1400);
  } else if (S.stage && S.stage.id === 't4') {
    clearTimeout(tickTimer); Sound.breakIn();
    await cutin('トキバミ', '止めておいてくれて、ありがとう', 'violet', 1500);
  } else {
    if (S.spectate) await cutin('観戦', `${S.teams[0].label} vs ${S.teams[1].label}`, 'gold', 1200);
    else if (PVP.on) await cutin(`VS ${PVP.foeName || '相手(ゲスト)'}`, `${PVP.rank ? `ランク戦 第${PVP.rank.g + 1}戦` : PVP.rated ? 'ランク戦' : 'フリー戦'}　${active(S.teams[0]).ch.name} vs ${active(S.teams[1]).ch.name}`, PVP.rated ? 'evil' : 'gold', 1400);
    else await cutin('開戦', `${active(S.teams[0]).ch.name} vs ${active(S.teams[1]).ch.name}`, 'gold', 900);
  }
  await entryFx();   // 1番手の、場に出たときから効く特性
  busy = false;
  render();
  tickLoop();
}

function init() {
  HAND_KEYS.forEach((h) => {
    const b = document.createElement('button');
    b.dataset.hand = h;
    b.dataset.key = String(HAND_KEYS.indexOf(h) + 1);   // パソコンではキーボードの番号を出す
    b.onclick = () => play(h);
    $('hands').appendChild(b);
  });
  $('start').onclick = start;
  // ★★★★をクリアした直後だけ:同じパーティ・同じ並び順で、全回復して★★★★★へ
  $('chain').onclick = () => {
    const next = S && S.stage && STAGES.find((x) => x.chainFrom === S.stage.id);
    if (!next || !S.over || S.winner !== 0) return;
    clearTimeout(tickTimer);
    startSolo(S.teams[0].cards.map((c) => c.ch), next);
  };
  $('retry').onclick = () => {
    clearTimeout(tickTimer);
    Bgm.play('menu');
    $('battle').classList.add('hidden');
    $('select').classList.remove('hidden');

    if (PVP.on && PVP.rank && PVP.rank.over) { pvpLeave(); renderMode(); setStep('menu'); showNewTitles(); return; }   // ランク戦の3本勝負が終わった
    if (PVP.on && PVP.rank) { FORMAT = RANK_FMTS[PVP.rank.g]; rankDraftReset(); PVP.phase = 'idle'; pvpJoin(PVP.code); renderMode(); }   // 次の試合:BAN・ピックから
    else if (PVP.on) { PVP.phase = 'idle'; pvpJoin(); renderMode(); }   // 同じ合言葉のまま、もう一度キャラ選びから
    setStep('pick');
    showNewTitles();   // 対戦中に解放した称号を知らせる
  };
  MODES.forEach(([label, m]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { if (PVP.spec) specStop(); else if (PVP.on && m !== 'pvp' && PVP.phase !== 'idle') pvpLeave(); if (m !== 'pvp') rankCancel(); MODE = m; PVP.on = m === 'pvp'; renderMode(); };
    $('modes').appendChild(b);

  try { SOLO.stage = localStorage.getItem('kokusen.stage') || 'a1'; SOLO.cleared = readCleared(GUEST_KEY); SOLO.rush = Number(localStorage.getItem('kokusen.rush')) || 0; } catch (e) { /* 保存できなくても動く */ }
  if (!STAGES.some((x) => x.id === SOLO.stage)) SOLO.stage = 'a1';
  STAGES.forEach((st) => {
    // 刻の回廊は、回廊ごとに見出しを付けて別の欄に並べる
    if (st.corridor && st.stars === 2) { const h = document.createElement('p'); h.className = 'corr-h'; h.textContent = CORRIDORS[st.corridor]; $('corrStages').appendChild(h); }
    const b = document.createElement('button');
    b.dataset.id = st.id;
    b.classList.add('s' + st.stars);   // ★の数で色を変える
    if (st.corridor) b.classList.add('corr');
    b.onclick = () => { SOLO.stage = st.id; try { localStorage.setItem('kokusen.stage', st.id); } catch (e) { /* 保存できなくても動く */ } renderStages(); };
    $(st.corridor ? 'corrStages' : 'stages').appendChild(b);
  });
  renderStages();
  try { const v = JSON.parse(localStorage.getItem('kokusen.vol') || 'null'); if (v) { FX.bgmVol = +v.b >= 0 ? +v.b : 1; FX.seVol = +v.s >= 0 ? +v.s : 1; } } catch (e) { /* 保存できなくても動く */ }
  accInit();
  setInterval(pvpWatch, 1000);
  // タイトル画面
  $('tVer').textContent = `ver ${APP_VER}`;
  $('tVer').title = `ルール ${RULES_VER.slice(0, 6)}`;   // 対人の版合わせに使うルールの番号
  $('tPlay').onclick = () => { Sound.wake(); Bgm.unlock && Bgm.unlock(); showTitle(false); };
  $('toTitle').onclick = () => showTitle(true);
  // パソコン:キーボードで手を出す(1・2・3 または Q・W・E)。Escで開いている画面を閉じる
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'Escape') { $('sheet').classList.add('hidden'); $('accModal').classList.add('hidden'); return; }
    const i = { 1: 0, 2: 1, 3: 2, q: 0, w: 1, e: 2 }[e.key.toLowerCase()];
    if (i === undefined || $('battle').classList.contains('hidden') || !$('sheet').classList.contains('hidden')) return;

  });
  // 対戦画面:特性やバフ・デバフを押すと、全文と一覧が出る
  $('traitYou').onclick = () => openCardInfo(0);
  $('traitCpu').onclick = () => openCardInfo(1);
  $('hpYou').addEventListener('click', (e) => { if (e.target.closest('.status')) openCardInfo(0); });
  $('hpCpu').addEventListener('click', (e) => { if (e.target.closest('.status')) openCardInfo(1); });
  $('selRank').onclick = openRanking;
  $('selTitles').onclick = openTitles;

  $('tGacha').onclick = () => openGacha();

  $('sheet').onclick = (e) => { if (e.target === $('sheet')) $('sheet').classList.add('hidden'); };
  showTitle(true);
  Bgm.stop();               // 最初の画面では曲を流さない(ガラスが砕け終わってから流す)

  // ・このページが裏に回ったら、音を止める。表に戻ったら、続きから鳴らす(iPhoneでは次に画面に触れたとき)
  // ・新しいタブでゲームを開いたら、前から開いていたタブの音を止める
  const audioCtx = () => Sound.wake();
  document.addEventListener('visibilitychange', () => {
    const c = audioCtx();
    if (!c) return;
    if (document.hidden) c.suspend().catch(() => {});
    else if (!SILENCED) c.resume().catch(() => {});
  });
  window.addEventListener('pagehide', () => { const c = audioCtx(); if (c) c.suspend().catch(() => {}); });
  try {
    const bc = new BroadcastChannel('kokusen-audio');
    bc.onmessage = (e) => {
      if (e.data !== 'new-tab') return;
      SILENCED = true;   // あとから開いたタブに譲る(このタブで画面に触れたら、また鳴らせる)
      Bgm.stop();
      const c = audioCtx(); if (c) c.suspend().catch(() => {});

  } catch (e) { /* BroadcastChannel が使えないブラウザでは、何もしない */ }
  document.addEventListener('pointerdown', () => {
    if (!SILENCED) return;
    SILENCED = false;
    const c = audioCtx(); if (c) c.resume().catch(() => {});
    if (!$('splash')) Bgm.play($('title').classList.contains('hidden') ? ($('battle').classList.contains('hidden') ? 'menu' : 'main') : 'title');

    const glass = shatter(false, at);
    await sleep(600);   // ひびが広がり切って、砕ける瞬間
    sp.classList.add('go');
    document.body.classList.add('title-burst');
    await glass;
    Bgm.play('title');   // ガラスが砕け終わってから、タイトル曲を頭から流す
    setTimeout(() => { sp.remove(); document.body.classList.remove('title-burst'); }, 500);
  };
  $('splash').addEventListener('click', splashGo);
  $('splash').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') splashGo(); });
  // 画面の拡大・縮小をさせない(iPhone の Safari は viewport の指定だけでは止まらないため)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // ダブルタップでの拡大は、CSS の touch-action: manipulation で止める(続けて押したボタンが効かなくならないように)
  $('joinRoom').onclick = () => { pvpJoin(); renderMode(); };
  $('leaveRoom').onclick = () => { if (PVP.spec) specStop(); else pvpLeave(); renderMode(); };
  $('specRoom').onclick = () => specStart();
  $('rankFind').onclick = () => { Sound.click(); if (RANK.searching) rankCancel(); else rankFind(); };
  [...$('pvpKinds').children].forEach((b) => { b.onclick = () => { if (b.disabled) return; if (b.dataset.k !== 'rated') rankCancel(); PVP.kind = b.dataset.k; try { localStorage.setItem('kokusen.pvpKind', PVP.kind); } catch (e) { /* 保存できなくても動く */ } Sound.click(); renderMode(); }; });
  try { const k = localStorage.getItem('kokusen.pvpKind'); if (k === 'rated' || k === 'free') PVP.kind = k; } catch (e) { /* 読めなければフリー戦 */ }
  $('toPick').onclick = () => { if (canPick()) { Sound.click(); setStep('pick'); } };
  $('toMenu').onclick = () => { if (MODE === 'pvp' && PVP.phase !== 'idle') { pvpLeave(); renderMode(); } Sound.click(); setStep('menu'); };
  $('mysetBtn').onclick = () => openMyset();
  [...$('formats').children].forEach((b) => { b.onclick = () => { if (b.disabled) return; FORMAT = b.dataset.f; try { localStorage.setItem('kokusen.format', FORMAT); } catch (e) { /* 保存できなくても動く */ } Sound.click(); if (MODE === 'solo') renderStages(); else renderSelect(); }; });
  [...$('cpuPicks').children].forEach((b) => { b.onclick = () => { CPU_PICK = b.dataset.c; try { localStorage.setItem('kokusen.cpuPick', CPU_PICK); } catch (e) { /* 保存できなくても動く */ } Sound.click(); renderSelect(); }; });
  [...$('pickSide').children].forEach((b) => { b.onclick = () => { if (b.dataset.s !== pickSide) { Sound.click(); setPickSide(b.dataset.s); } }; });
  $('logBtn').onclick = () => {
    const hid = $('logPanel').classList.toggle('hidden');
    if (!hid) renderHandStats();
    $('logBtn').textContent = hid ? 'ログを見る' : 'ログを閉じる';
  };
  FX.sound = loadOpt('kokusen.sound', true);
  FX.short = loadOpt('kokusen.short', false);
  try { const v = localStorage.getItem('kokusen.battleBgm'); if (BATTLE_BGM_CHOICES.some(([k]) => k === v)) FX.battleBgm = v; } catch (e) { /* 読めなければいつもの曲 */ }
  FX.sakibare = loadOpt('kokusen.sakibare', true);
  try { const pt = localStorage.getItem('kokusen.pattern'); FX.pattern = FX_PATTERNS[pt] ? pt : 'normal'; } catch (e) { FX.pattern = 'normal'; }
  FX.bgm = loadOpt('kokusen.bgm', true);
  $('optBgm').onclick = () => { FX.bgm = !FX.bgm; saveOpt('kokusen.bgm', FX.bgm); applyOpts(); };
  Bgm.init();
  // 最初の操作で、曲と効果音を鳴らせる状態にする
  const firstTouch = () => { Bgm.unlock(); Sound.wake(); };
  ['pointerdown', 'touchend', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, firstTouch, { once: true }));
  $('optSound').onclick = () => { FX.sound = !FX.sound; saveOpt('kokusen.sound', FX.sound); applyOpts(); if (FX.sound) Sound.wake(); };
  try { FX.level = Number(localStorage.getItem('kokusen.level')) || 2; } catch (e) { FX.level = 2; }
  Object.keys(AI_LEVELS).filter((k) => k <= 3).forEach((k) => {
    const b = document.createElement('button');
    b.textContent = AI_LEVELS[k].name;
    b.onclick = () => { FX.level = Number(k); try { localStorage.setItem('kokusen.level', k); } catch (e) { /* 保存できなくても動く */ } renderLevels(); };
    $('levels').appendChild(b);
  });
  renderLevels();
  applyOpts();
  renderMode();
  pvpInit();
  setInterval(pvpDebug, 1000);
}
init();
</script>
</body>
</html>
