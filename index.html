  };
  // 特性「零の綴じ」(アワイ):陣営ボーナスが発動していれば、次の番手のATKがずっと上がる(レイはさらに)
  if (fb) team.cards.forEach((c, i) => { const g = traitOf(c, 'facGuard'), nx = team.cards[i + 1]; if (g && nx) { const v = nx.ch.id === 'rei' ? g.rei : g.v; nx.atkBonus += v; nx.tsuzuri = (nx.tsuzuri || 0) + v; } });   // tsuzuri は画面の表示用
  return team;
}
function newMatch(charsA, charsB) {
  const S = {
    teams: [newTeam('あなた', charsA), newTeam('CPU', charsB)],
    rally: 0, boutRally: 0, bouts: 0, over: false, winner: null, hit: null, ticks: [], events: [],
    hist: [],   // これまでの手の記録 [あなたの手, CPUの手](CPUの読みに使う)
  };
  // 相手が1体だけのチームなら、こちらのカードに目印を付ける(特性「一点留め」などが効く)
  S.teams.forEach((t, i) => { if (S.teams[1 - i].cards.every((c) => c.ch.boss)) t.cards.forEach((c) => { c.giant = true; }); });
  return S;
}
const active = (team) => team.cards[team.idx];
// ゼノは、一度倒すまで名前を伏せる(ソロのクリア記録で判定。シミュレーターでは常に本名)
const xenoKnown = () => typeof SOLO === 'undefined' || SOLO.cleared.includes('x5');
// 名前を伏せるか。ゼノは一度倒すまで、secretUnlock のキャラ(ツル・天眼)は解放するまで
const secretOn = (ch) => !!ch.secret && (ch.secretUnlock ? !(typeof charUnlocked === 'function' && charUnlocked(ch)) : !xenoKnown());
const dispName = (ch) => (secretOn(ch) ? ch.secret : ch.name);
const nameOf = (c) => (c.form ? c.formName || traitOf(c, 'transform').formName : dispName(c.ch));

function judge(a, b) {
  if (a === b) return 0;
  return HANDS[a].beats === b ? 1 : -1;
}

// ラリーの始まり:ラリー数を進め、特性「仮面割れ」の変身を判定する
// S.boutRally は最後の交代からのラリー数(抜け落ち用)、card.turn はそのカードが場に出てからのラリー数(特性用)
function beginRally(S, log) {
  S.rally++;
  S.boutRally++;
  S.hit = null; S.ticks = []; S.events = [];
  S.teams.forEach((t, side) => {
    const c = active(t), tr = traitOf(c, 'transform');
    c.turn++;
    if (c.turn === 1 && traitOf(c, 'enterDispel')) { trig(c, 'enterDispel'); dispel(S, side, log); }   // 特性「白紙化」
    if (c.turn === 1 && traitOf(c, 'burnout')) trig(c, 'burnout');
    const fo = active(S.teams[1 - side]);
    // ウレイの「憂い」:相手のDFSがATKより高ければ、ATKとDFS(強化込み)を入れ替える
    if (c.turn === 1 && traitOf(c, 'swapStats') && fo.hp > 0 && !traitOf(fo, 'void')) {
      const ea = baseAtk(fo), ed = dfsOf(fo, false);
      if (ed > ea) { fo.atk += ed - ea; fo.dfs += ea - ed; trig(c, 'swapStats'); log(`　${nameOf(c)}の「憂い」:${nameOf(fo)}のATKとDFSが入れ替わった(ATK${baseAtk(fo)}・DFS${dfsOf(fo, false)})`); }
    }
    // オソレの「怯え」:相手のATKとDFSの合計が大きければ、両方を減らす
    const aw = c.turn === 1 && traitOf(c, 'awe');
    if (aw && fo.hp > 0 && !traitOf(fo, 'void')) {
      const ea = baseAtk(fo), ed = dfsOf(fo, false);
      if (ea + ed >= aw.line) { fo.atk -= Math.round(ea * aw.cut); fo.dfs -= Math.round(ed * aw.cut); trig(c, 'awe'); log(`　${nameOf(c)}の「怯え」:${nameOf(fo)}のATKとDFSが${Math.round(aw.cut * 100)}%減った(ATK${baseAtk(fo)}・DFS${dfsOf(fo, false)})`); }
    }   // ナガレの「全力」:場に出たときから効く
    if (c.turn === 1 && traitOf(c, 'rush')) trig(c, 'rush');         // 先駆けなど:場に出たときから効く
    if (c.turn === 1 && c.tsuzuri) trig(t.cards.slice(0, t.idx).find((x) => traitOf(x, 'facGuard')), 'facGuard');   // アワイの「零の綴じ」を受けた番手が出た
    if (tr && !c.form && c.turn >= tr.at) {
      c.form = 1; c.atk = tr.atk; c.dfs = tr.dfs; c.actions = tr.actions;
      S.events.push({ type: 'transform', side });
      log(`　${t.label}の${c.ch.name}が変身 →「${tr.formName}」(ATK${tr.atk}・DFS${tr.dfs})`);
    }
  });
}

// バフ・デバフを付ける。同じ種類(能力と上げ下げが同じ)は、強いほうの値にして、残りラリー数を足す
// 例:−500(3)を2ラリー続けて当てると、1つ目の残り2 + 3 = −500(5)
function addMod(c, m) {
  if (traitOf(c, 'void')) return;   // ウツロの「虚ろ」:強化も弱体も受けない
  const same = c.mods.find((x) => x.stat === m.stat && Math.sign(x.v) === Math.sign(m.v));
  if (same) {
    same.v = Math.abs(m.v) > Math.abs(same.v) ? m.v : same.v;
    same.t = (same.fresh ? same.t : same.t - 1) + m.t;   // このラリーの終わりに減るはずだった1ラリー分を先に引いてから足す
    same.fresh = true;
  } else {
    c.mods.push({ stat: m.stat, v: m.v, t: m.t, fresh: true });
  }
}

// 攻撃側の現在のカードが、指定した手に対応するアクションを実行する
function act(S, side, hand, log, isBreak) {
  const wt = S.teams[side], lt = S.teams[1 - side];
  const w = active(wt), l = active(lt);
  const a = w.actions[hand];
  let t;
  log(`${wt.label}の${nameOf(w)}:${HANDS[hand].label} →「${a.name}」`);
  S.hit = { side, dmg: 0, heal: 0, rate: 0, half: false };   // 画面表示用:このアクションで与えたダメージと回復量
  if (a.rate) {
    const rate = rateOf(a, w, l, w.turn, isBreak);
    const dfs = dfsVs(w, l, isBreak);
    const d = damage(S, w, l, rate, isBreak);
    w.atkUp = 0;
    l.dfsUp = 0;
    l.hp = Math.max(0, l.hp - d);
    undyingCheck(S, l, isBreak, 1 - side, log);
    S.hit.dmg = d; S.hit.rate = rate;
    S.hit.half = d >= l.max / 2 && l.hp === 0;   // 最大HPの半分以上のダメージで倒したか
    log(`　${lt.label}の${nameOf(l)}に${d}ダメージ(${RATE_LABEL[rate]}、${isBreak ? `${BREAK_NAME}中はDFS無視` : `DFS${dfs}で${pct(dfs / 10000)}カット`})`);
    // 特性「時の報い」:BREAKで攻撃されて耐えたら、攻撃してきたカードに大ダメージを返す
    if (isBreak && (t = traitOf(l, 'retaliate')) && l.hp > 0) {
      trig(l, 'retaliate');
      w.hp = Math.max(0, w.hp - t.dmg);
      S.ticks.push({ side, dmg: t.dmg, label: t.name });
      log(`　${nameOf(l)}の「${t.name}」→ ${nameOf(w)}に${t.dmg}ダメージ`);
    }
    // 特性「不動」:攻撃を受けるたびに硬くなる
    if ((t = traitOf(l, 'immovable')) && l.hp > 0 && !traitOf(l, 'void')) { l.dfsGain = Math.min(t.cap, l.dfsGain + t.gain); trig(l, 'immovable'); }
    // 特性「刻喰い」:当てたダメージの一部を回復する(回復封じ中は回復しない)
    if ((t = traitOf(w, 'devour')) && d > 0 && w.noHeal <= 0 && w.hp < w.max) {
      trig(w, 'devour');
      const before = w.hp;
      w.hp = Math.min(w.max, w.hp + Math.round(d * t.rate));
      S.hit.heal += w.hp - before;
      log(`　${nameOf(w)}は刻を喰らって${w.hp - before}回復`);
    }
    // 特性「呪い」:当たるたびに、相手の控えも含めた全員に消えない弱体
    if ((t = traitOf(w, 'teamCurse')) && d > 0 && !traitOf(l, 'void')) {
      trig(w, 'teamCurse');
      lt.cards.forEach((c) => { if (c.result !== 'lose') c.markAtk = Math.max(-t.cap, c.markAtk - t.v); });
      log(`　${lt.label}の全員にATKの刻印(ATK${l.markAtk})`);
    }
    // 特性「穿ち」:当たるたびに、場の相手のDFSを削る刻印
    if ((t = traitOf(w, 'pierceMark')) && l.hp > 0 && d > 0 && !traitOf(l, 'void')) {
      trig(w, 'pierceMark');
      l.markDfs = Math.max(-t.cap, l.markDfs - t.v);
      log(`　${nameOf(l)}にDFSの刻印(DFS${l.markDfs})`);
    }
    // 特性「霞の刻」:当たるたびに相手のATKを削る刻印
    if ((t = traitOf(w, 'hazeMark')) && l.hp > 0 && d > 0 && l.markAtk > -t.cap && !traitOf(l, 'void')) {
      trig(w, 'hazeMark');
      l.markAtk = Math.max(-t.cap, l.markAtk - t.v);
      log(`　${nameOf(l)}にATKの刻印(ATK${l.markAtk})`);
    }
  }
  if (a.heal && w.noHeal > 0) log(`　${nameOf(w)}は回復を封じられている`);
  else if (a.heal && w.hp > 0) {   // 「時の報い」などで倒れたカードは回復しない
    const before = w.hp;
    w.hp = Math.min(w.max, w.hp + a.heal);
    S.hit.heal = w.hp - before;
    log(`　${nameOf(w)}は${w.hp - before}回復`);
  }
  if (a.cleanse || a.cure) {
    const had = w.poison > 0 || (a.cleanse && w.mods.some((m) => m.v < 0));
    if (a.cleanse) w.mods = w.mods.filter((m) => m.v > 0);
    w.poison = 0; w.poisonDmg = 0; w.poisonStacks = 0;
    if (had) {
      S.events.push({ type: 'mod', side, text: '解除', good: true });
      log(`　${nameOf(w)}の${a.cleanse ? 'デバフと時蝕' : '時蝕'}が消えた`);
    }
  }
  if (a.dispel && l.hp > 0) dispel(S, side, log);
  if (a.noheal && l.hp > 0) {
    l.noHeal = Math.max(l.noHeal, a.noheal);
    S.events.push({ type: 'mod', side: 1 - side, text: '回復封じ', good: false });
    log(`　${nameOf(l)}の回復を${a.noheal}ラリー封じた`);
  }
  if (a.mark && l.hp > 0 && !traitOf(l, 'void')) {
    const k = a.mark.stat === 'atk' ? 'markAtk' : 'markDfs', label = a.mark.stat === 'atk' ? 'ATK' : 'DFS';
    l[k] = a.mark.cap ? Math.max(-a.mark.cap, l[k] - a.mark.v) : l[k] - a.mark.v;   // cap 0 は上限なし(ATKは ATK_MIN=1000 より下がらない)
    S.events.push({ type: 'mod', side: 1 - side, text: `${label}刻印`, good: false });
    log(`　${nameOf(l)}に${label}の刻印(${label}${l[k]})`);
  }
  if (a.foeTeamMark) {   // 相手の控えも含めた全員に、消えない弱体
    const k = a.foeTeamMark.stat === 'atk' ? 'markAtk' : 'markDfs', label = a.foeTeamMark.stat === 'atk' ? 'ATK' : 'DFS';
    lt.cards.forEach((c) => { if (c.result !== 'lose' && !traitOf(c, 'void')) c[k] = Math.max(-a.foeTeamMark.cap, c[k] - a.foeTeamMark.v); });
    S.events.push({ type: 'mod', side: 1 - side, text: `全員${label}刻印`, good: false });
    log(`　${lt.label}の全員に${label}の刻印(${label}${l[k]})`);
  }
  if (a.selfPerm && w.hp > 0 && !traitOf(w, 'void')) {   // 自分に、消えない強化(重ねがけできる)
    w.atkBonus += a.selfPerm.atk || 0; w.dfsBonus += a.selfPerm.dfs || 0;
    S.events.push({ type: 'mod', side, text: 'ずっと↑', good: true });
    log(`　${nameOf(w)}のATK+${a.selfPerm.atk || 0}・DFS+${a.selfPerm.dfs || 0}(消えない。合計ATK+${w.atkBonus}・DFS+${w.dfsBonus})`);
  }
  if (a.team) {
    const k = a.team.stat === 'atk' ? 'teamAtk' : 'teamDfs', label = a.team.stat === 'atk' ? 'ATK' : 'DFS';
    const tv = (c) => (a.team.rei && c.ch.id === 'rei' ? a.team.rei : a.team.v);   // アワイ:レイなら効果アップ
    wt.cards.forEach((c) => { if (c.hp > 0 && c.result !== 'lose' && !(a.team.bench && c === w) && !traitOf(c, 'void')) c[k] = a.team.cap ? Math.min(a.team.cap, c[k] + tv(c)) : c[k] + tv(c); });
    S.events.push({ type: 'mod', side, text: `${a.team.bench ? '控え' : '全員'}${label}↑`, good: true });
    log(a.team.bench ? `　${wt.label}の控えの味方全員の${label}+${a.team.v}` : `　${wt.label}の味方全員の${label}+${a.team.v}(全体${label}+${w[k]})`);
    const bench = wt.cards.slice(wt.idx + 1).filter((c) => c.hp > 0 && c.result !== 'lose');
    if (bench.length) relay(wt, 'tm:' + a.name, a.name, `${a.team.bench ? '控えの味方全員' : '味方全員(控えも)'}の${label}+${a.team.v}ずつ。いまの控え:` + bench.map((c) => `${dispName(c.ch)} ${label}+${c[k]}`).join('・'));
  }
  if (a.atkUp && !traitOf(w, 'void')) w.atkUp = a.atkUp;
  if (a.dfsUp && !traitOf(w, 'void')) w.dfsUp = a.dfsUp;
  if (a.voidCharge) { w.voidCharge = true; log(`　${nameOf(w)}:次のあいこの「無の間」が2倍`); }   // ウツロの「虚」
  if (a.purge && l.hp > 0) {   // ウツロの「無」:相手の強化と弱体をすべて消す
    Object.assign(l, { mods: [], atkUp: 0, dfsUp: 0, dfsGain: 0, markAtk: 0, markDfs: 0 });
    S.events.push({ type: 'mod', side: 1 - side, text: '無', good: false });
    log(`　${nameOf(l)}の強化と弱体がすべて消えた`);
  }
  if (a.teamBreak) {   // ハレの「はしゃぎ」:控えの味方全員の BREAKの一撃のATK
    const bench = wt.cards.slice(wt.idx + 1).filter((c) => c.hp > 0 && c.result !== 'lose' && !traitOf(c, 'void'));
    bench.forEach((c) => { c.brkAtk = Math.min(a.teamBreak.cap, (c.brkAtk || 0) + a.teamBreak.v); });
    if (bench.length) relay(wt, 'tb:' + a.name, a.name, `控えの味方全員の「${BREAK_NAME}の一撃 ATK」+${a.teamBreak.v}(最大+${a.teamBreak.cap})。いまの控え:` + bench.map((c) => `${dispName(c.ch)} +${c.brkAtk}`).join('・'));
  }
  (a.mods || []).forEach((m) => {
    const target = m.to === 'self' ? w : l, tside = m.to === 'self' ? side : 1 - side;
    if (target.hp <= 0) return;
    addMod(target, m);
    const label = `${m.stat === 'atk' ? 'ATK' : 'DFS'}${m.v > 0 ? '↑' : '↓'}`;
    S.events.push({ type: 'mod', side: tside, text: label, good: m.v > 0 });
    log(`　${nameOf(target)}の${m.stat === 'atk' ? 'ATK' : 'DFS'}${m.v > 0 ? '+' : '−'}${Math.abs(m.v)}(${m.t}ラリー)`);
  });
  if (a.poison) {
    const tick = Math.round(baseAtk(w) * POISON_RATE * w.ch.phys * (1 - (isBreak ? 0 : baseDfs(l)) / 10000));
    // 特性「古傷」:すでに時蝕中なら、毎ラリーのダメージを上乗せする
    const again = l.poison > 0;
    const stack = traitOf(w, 'oldwound') && again;
    l.poisonDmg = stack ? l.poisonDmg + tick : tick;
    l.poisonStacks = again ? l.poisonStacks + 1 : 1;
    l.poison = Math.max(l.poison, a.poison);
    log(`　${nameOf(l)}は時蝕を受けた(毎ラリー${l.poisonDmg}${stack ? `、重ねがけ${l.poisonStacks}回目` : ''})`);
  }
  if (a.streak) wt.streak += a.streak;
  if (a.breakNow && !isBreak && w.hp > 0) wt.forceBreak = true;   // この技で勝つと、連勝の数に関係なく BREAK
  if (a.resetStreak) { lt.streak = 0; lt.keep = false; log(`　${lt.label}の連勝が0に戻された`); }
  if (a.seal) lt.sealed = true;
  if (a.keep) wt.keep = true;
  const next = wt.cards[wt.idx + 1];
  if (next && traitOf(next, 'void')) { /* ウツロには渡らない */ } else if (next && a.nextAtkUp) { next.atkUp = Math.max(next.atkUp, a.nextAtkUp); relay(wt, 'na:' + a.name, a.name, `次の番手(${dispName(next.ch)})の最初の攻撃ATK+${next.atkUp}(重ならない)`); }
  if (next && a.nextDfsUp) { next.dfsUp = Math.max(next.dfsUp, a.nextDfsUp); relay(wt, 'nd:' + a.name, a.name, `次の番手(${dispName(next.ch)})が最初に受ける攻撃DFS+${next.dfsUp}(重ならない)`); }
  if (next && a.nextCut) {   // 重ならない
    if (!next.cut) { next.cut = next.ch.id === 'rei' ? a.nextCut.rei : a.nextCut.v; log(`　${wt.label}の次の番手(${dispName(next.ch)})が受けるダメージが減る(ずっと)`); }
    relay(wt, 'nc:' + a.name, a.name, `次の番手(${dispName(next.ch)})が受けるダメージ−${Math.round(next.cut * 100)}%(ずっと。重ならない)`);
  }
}

// 特性「不滅」:BREAK以外ではHP1で耐える。初めてHP1になったら知らせる
function undyingCheck(S, c, isBreak, side, log) {
  if (!traitOf(c, 'undying')) return;
  if (c.hp <= 0 && !isBreak) c.hp = 1;
  if (c.hp === 1 && !c.lastBreath) {
    c.lastBreath = true;
    S.events.push({ type: 'lastBreath', side });
    log(`　${nameOf(c)}はHP1で耐えている。とどめは${BREAK_NAME}でしか刺せない`);
  }
}

// 特性「巻き戻しの儀」:刻を戦いの前に巻き戻す。こちらは全員が元に戻り、肉体のDFSは巻き戻るたびに半分になる
function rewindMatch(S, log) {
  S.rewinds = (S.rewinds || 0) + 1;
  const me = S.teams[0], foe = S.teams[1];
  const keepMe = (traitOf(active(foe), 'rewindRite') || {}).keepMe;   // こちらは巻き戻らない(刻の回廊のゼノ)
  const fresh = newMatch(me.cards.map((c) => c.ch), foe.cards.map((c) => c.ch));
  const bi = foe.idx - 1;   // 肉体の位置(精神離脱体のひとつ前)
  if (!keepMe) Object.assign(me, { idx: 0, wins: bi, streak: 0, breakReady: false, sealed: false, keep: false, cards: fresh.teams[0].cards });
  foe.cards[bi] = fresh.teams[1].cards[bi]; foe.cards[bi + 1] = fresh.teams[1].cards[bi + 1];
  Object.assign(foe, { idx: bi, wins: 0, streak: 0, breakReady: false, sealed: false, keep: false });
  const body = foe.cards[bi];
  body.dfs = Math.round(body.ch.dfs / Math.pow(2, S.rewinds));
  S.boutRally = 0;
  S.events.push({ type: 'rewind', dfs: body.dfs });
  log(`　刻が戦いの前に巻き戻された(${S.rewinds}回目)。${keepMe ? 'こちらは巻き戻らず、今のまま。' : ''}${nameOf(body)}のDFSは${body.dfs}に下がった`);
}

// 相手(side の反対側)の場のカードのバフをすべて消す。特性「不動」で上がったDFSも消える
function dispel(S, side, log) {
  const l = active(S.teams[1 - side]);
  const had = l.mods.some((m) => m.v > 0) || l.atkUp || l.dfsUp || l.dfsGain;
  l.mods = l.mods.filter((m) => m.v < 0);
  l.atkUp = 0; l.dfsUp = 0; l.dfsGain = 0;
  if (had) {
    S.events.push({ type: 'mod', side: 1 - side, text: 'バフ消し', good: false });
    log(`　${nameOf(l)}のバフが消えた`);
  }
}

// ラリーの締め:時蝕 → 特性「処置」 → バフ・デバフの残りラリー数 → 抜け落ち → 倒れたカードの交代
// winSide: このラリーのじゃんけんに勝った側(あいこは -1)
function endRally(S, log, winSide) {
  S.teams.forEach((t, side) => {
    const f = active(t);
    let tr;
    if (f.poison > 0 && f.hp > 0) {
      f.poison--;
      f.hp = Math.max(0, f.hp - f.poisonDmg);
      undyingCheck(S, f, false, side, log);
      S.ticks.push({ side, dmg: f.poisonDmg });
      log(`　${t.label}の${nameOf(f)}は時蝕で${f.poisonDmg}ダメージ`);
      if (f.poison === 0) { f.poisonDmg = 0; f.poisonStacks = 0; }
    }
    if ((tr = traitOf(f, 'regen')) && f.hp > 0 && f.hp < f.max && f.noHeal <= 0) {
      const before = f.hp;
      f.hp = Math.min(f.max, f.hp + tr.heal);
      S.ticks.push({ side, heal: f.hp - before });
      trig(f, 'regen');
      log(`　${t.label}の${nameOf(f)}は「${tr.name}」で${f.hp - before}回復`);
    }
    // 特性「燃え尽き」:ラリーが終わるたびに自分のHPが削れる(全力を出し続ける代わり)
    if ((tr = traitOf(f, 'selfBurn')) && f.hp > 0) {
      f.hp = Math.max(0, f.hp - tr.dmg);
      S.ticks.push({ side, dmg: tr.dmg });
      trig(f, 'selfBurn');
      log(`　${t.label}の${nameOf(f)}は「${tr.name}」で${tr.dmg}ダメージ`);
    }
    // バフ・デバフ:付いたラリーは数えず、次のラリーから残りを減らす
    f.mods.forEach((m) => { if (m.fresh) m.fresh = false; else m.t--; });
    f.mods = f.mods.filter((m) => m.t > 0);
    if (f.noHeal > 0) f.noHeal--;
  });
  // イサミの「奮起」:HPが半分を切ったとき、一度だけ連勝が増える
  S.teams.forEach((t) => {
    const f = active(t), r = traitOf(f, 'rouse');
    if (!r || f.roused || f.hp <= 0 || f.hp > f.max * r.below) return;
    f.roused = true; t.streak += r.add; trig(f, 'rouse');
    log(`　${t.label}の${nameOf(f)}の「${r.name}」:連勝+${r.add}`);
    if (t.streak >= BREAK_STREAK) { t.streak = 0; t.breakReady = true; log(`　${t.label}が${BREAK_STREAK}連勝 → ${BREAK_NAME}!`); }
  });
  // 刻の抜け落ち:長引くほど両者が削れる
  if (!S.noDecay && S.boutRally > DECAY_FROM) {
    S.teams.forEach((t, side) => {
      const f = active(t), foe = active(S.teams[1 - side]);
      if (f.hp <= 0) return;
      const g = traitOf(f, 'decayGuard'), gf = traitOf(foe, 'decayGuard');
      if (g) { trig(f, 'decayGuard'); return; }   // 特性「錨泊」:抜け落ちを受けない
      const d = Math.round(f.max * DECAY_STEP * (S.boutRally - DECAY_FROM) * (gf ? 1 + gf.boost : 1));
      f.hp = Math.max(0, f.hp - d);
      S.ticks.push({ side, dmg: d, decay: true });
      log(`　刻の抜け落ち:${t.label}の${nameOf(f)}に${d}ダメージ`);
    });
  }
  // 特性「巻き戻しの儀」:期限までに倒せなければ、刻が巻き戻る
  const sp = active(S.teams[1]), rite = traitOf(sp, 'rewindRite');
  // 期限までに倒せなかったとき(こちらが全滅していれば、巻き戻らずに負け)
  if (rite && sp.hp > 0 && sp.turn >= rite.limit && active(S.teams[0]).hp > 0) { rewindMatch(S, log); return; }
  // 特性「立ち直り」:一度だけ、倒れたときにHPの一部で立ち上がる
  S.teams.forEach((t, side) => {
    const f = active(t), sw = traitOf(f, 'secondWind');
    if (f.hp > 0 || !sw || f.revived) return;
    f.revived = true; f.hp = Math.round(f.max * sw.hp); trig(f, 'secondWind');
    S.events.push({ type: 'mod', side, text: '立ち直り', good: true });
    log(`　${t.label}の${nameOf(f)}の「${sw.name}」:HP${f.hp}で立ち上がった`);
  });
  // 特性「離脱」:倒れたとき一度だけ、別の姿で場に残る(撃破には数えない)
  S.teams.forEach((t, side) => {
    const f = active(t), dt = traitOf(f, 'detach');
    if (f.hp > 0 || !dt || f.form) return;
    Object.assign(f, { form: 1, formName: dt.formName, hp: dt.hp, max: dt.hp, atk: dt.atk, dfs: dt.dfs, actions: dt.actions, mods: [], poison: 0, poisonDmg: 0, poisonStacks: 0, noHeal: 0 });
    S.events.push({ type: 'detach', side });
    log(`　${t.label}の${f.ch.name}の肉体が倒れた → 「${dt.formName}」として場に残る(HP${dt.hp}・ATK${dt.atk}・DFS${dt.dfs})`);
  });
  const [a, b] = S.teams;
  const ko = S.teams.map((t) => active(t).hp <= 0);
  if (!ko[0] && !ko[1]) return;

  // 特性「記録」:倒れたとき、次の番手に強化を渡す
  S.teams.forEach((t, side) => {
    const f = active(t), tr = traitOf(f, 'record'), next = t.cards[t.idx + 1];
    if (ko[side] && tr && next) {
      next.atkBonus += tr.atk; next.dfsBonus += tr.dfs;
      trig(f, 'record');
      relay(t, 'rc:' + f.ch.id, tr.name, `${f.ch.name}が倒れて、次の${next.ch.name}にATK+${tr.atk}・DFS+${tr.dfs}(ずっと)`);
      log(`　${t.label}の${f.ch.name}の「${tr.name}」→ 次の${next.ch.name}にATK+${tr.atk}・DFS+${tr.dfs}`);
    }
    // 特性「継ぎ」:倒れたとき、自分のATKとDFS(消えない強化も込み)をそのまま次の番手に足す
    const ps = traitOf(f, 'passStats');
    if (ko[side] && ps && next) {
      const pa = f.atk + f.atkBonus + f.teamAtk + (f.growAtk || 0), pd = f.dfs + f.dfsBonus + f.teamDfs + f.dfsGain;
      next.atkBonus += pa; next.dfsBonus += pd;
      trig(f, 'passStats');
      relay(t, 'ps:' + f.ch.id, ps.name, `${f.ch.name}が倒れて、次の${next.ch.name}にATK+${pa}・DFS+${pd}(ずっと)`);
      log(`　${t.label}の${f.ch.name}の「${ps.name}」→ 次の${next.ch.name}にATK+${pa}・DFS+${pd}`);
    }
    // ハレの「日差し」:倒れたとき、次の番手は連勝が増えた状態から始まる
    const sp = traitOf(f, 'sunPass');
    if (ko[side] && sp && next) {
      t.streak += sp.add; trig(f, 'sunPass');
      relay(t, 'sp:' + f.ch.id, sp.name, `${f.ch.name}が倒れて、次の${next.ch.name}は連勝+${sp.add}から始まる`);
      log(`　${t.label}の${f.ch.name}の「${sp.name}」→ 連勝+${sp.add}`);
      if (t.streak >= BREAK_STREAK) { t.streak = 0; t.breakReady = true; log(`　${t.label}が${BREAK_STREAK}連勝 → ${BREAK_NAME}!`); }
    }
    // セツナの「散り際」:場にいたラリー数×100を、控えの味方全員のATKに足す
    const lp = traitOf(f, 'lingerPass'), lb2 = t.cards.slice(t.idx + 1).filter((c) => !traitOf(c, 'void'));
    if (ko[side] && lp && lb2.length) {
      const v = Math.min(lp.cap, f.turn * lp.per);
      lb2.forEach((c) => { c.atkBonus += v; });
      trig(f, 'lingerPass');
      relay(t, 'lp:' + f.ch.id, lp.name, `${f.ch.name}が${f.turn}ラリー場にいて倒れ、控えの味方全員にATK+${v}(ずっと)`);
      log(`　${t.label}の${f.ch.name}の「${lp.name}」→ 控えの味方全員にATK+${v}`);
    }
    // 特性「舫い」「羽渡し」:倒れたとき、控えの味方全員を強化する
    const lg = traitOf(f, 'legacy'), bench = t.cards.slice(t.idx + 1);
    if (ko[side] && lg && bench.length) {
      bench.forEach((c) => { c.atkBonus += lg.atk; c.dfsBonus += lg.dfs; c.max += lg.hp; c.hp += lg.hp; });
      trig(f, 'legacy');
      relay(t, 'lg:' + f.ch.id, lg.name, `${f.ch.name}が倒れて、控えの味方全員に` + [lg.atk && `ATK+${lg.atk}`, lg.dfs && `DFS+${lg.dfs}`, lg.hp && `最大HP+${lg.hp}`].filter(Boolean).join('・') + '(ずっと)');
      log(`　${t.label}の${f.ch.name}の「${lg.name}」→ 控えの味方全員に` + [lg.atk && `ATK+${lg.atk}`, lg.dfs && `DFS+${lg.dfs}`, lg.hp && `最大HP+${lg.hp}`].filter(Boolean).join('・'));
    }
  });

  // 特性「喰い残し」:相手のカードを倒したら、そのカードのいちばん強い技を喰って、同じ手の自分の技と入れ替える
  S.teams.forEach((t, side) => {
    const f = active(t), em = traitOf(f, 'eatMove');
    if (ko[side] || !ko[1 - side] || !em) return;
    const prey = active(S.teams[1 - side]);
    const h = HAND_KEYS.reduce((x, y) => ((prey.actions[y].rate || 0) > (prey.actions[x].rate || 0) ? y : x), HAND_KEYS[0]);
    const pa = prey.actions[h];
    f.actions = { ...f.actions, [h]: { ...pa, name: `喰・${pa.name}` } };
    log(`　${t.label}の${f.ch.name}の「${em.name}」→ ${prey.ch.name}の「${pa.name}」を喰った(${HANDS[h].label}が「喰・${pa.name}」になる)`);
  });

  // 倒れた側だけが次のカードに交代する。倒した側はそのまま場に残る
  S.bouts++;
  S.teams.forEach((t, side) => {
    if (!ko[side]) return;
    active(t).result = 'lose';
    S.teams[1 - side].wins++;
    active(S.teams[1 - side]).kills++;
  });
  S.teams.forEach((t, side) => {
    if (ko[side]) log(`　${t.label}の${nameOf(active(t))}は倒れた(撃破数 ${a.wins}-${b.wins})`);
  });
  S.teams.forEach((t, side) => { if (ko[side]) t.idx++; });
  S.boutRally = 0;
  // ボスラッシュ:ボスを1体倒すごとに、こちらは倒れたカードも含めて全回復し、1番手から出直す
  // (ゼノの肉体と精神離脱体は、2つで1体と数える)
  const fallen = b.cards[b.idx - 1], nextFoe = b.cards[b.idx];
  if (ko[1] && fallen && fallen.ch.rush && nextFoe && !nextFoe.ch.hiddenUntilActive) {
    const giant = a.cards.some((c) => c.giant);
    a.cards = newTeam(a.label, a.cards.map((c) => c.ch)).cards;
    a.cards.forEach((c) => { c.giant = giant; });
    Object.assign(a, { idx: 0, streak: 0, breakReady: false, sealed: false, keep: false });
    S.events.push({ type: 'rushHeal', n: b.cards.slice(0, b.idx).filter((c) => !c.ch.hiddenUntilActive || true).filter((c) => c.ch.id !== 'xeno_body').length });
    log(`　${nameOf(fallen)}を倒した。こちらは全回復して、1番手から出直す`);
  }

  const out = S.teams.map((t) => t.idx >= t.cards.length);
  if (out[0] || out[1]) {
    // 全員倒れた側の負け。同時に全滅したら、このラリーのじゃんけんに勝った側の勝ち(あいこなら引き分け)
    S.over = true;
    S.winner = out[0] && out[1] ? winSide : out[0] ? 1 : 0;
    S.teams.forEach((t) => { t.idx = Math.min(t.idx, t.cards.length - 1); t.breakReady = false; });
  } else {
    log(`— 交代:${nameOf(active(a))} vs ${nameOf(active(b))} —`);
  }
}

// 通常のラリー(じゃんけん1回)。戻り値は side0 から見た勝敗 1 / 0 / -1
function rally(S, hand0, hand1, log) { TRIG = []; try { return rallyCore(S, hand0, hand1, log); } finally { S.trig = TRIG; TRIG = null; } }
function rallyCore(S, hand0, hand1, log) {
  S.hist.push([hand0, hand1]);
  log(`— ラリー${S.rally + 1}:あなた ${HANDS[hand0].label} / CPU ${HANDS[hand1].label} —`);
  beginRally(S, log);
  const r = judge(hand0, hand1);
  const winSide = r === 0 ? -1 : r > 0 ? 0 : 1;
  if (r === 0) {
    log('あいこ');
    // 特性「凪の間」:あいこのたびに回復する
    S.teams.forEach((t) => {
      const c = active(t), dh = traitOf(c, 'drawHeal');
      if (!dh || c.hp <= 0 || c.noHeal > 0 || c.hp >= c.max) return;
      const before = c.hp; c.hp = Math.min(c.max, c.hp + dh.heal); trig(c, 'drawHeal');
      S.ticks.push({ side: S.teams.indexOf(t), heal: c.hp - before });
      log(`　${t.label}の${nameOf(c)}の「${dh.name}」:${c.hp - before}回復`);
    });
    // ウツロの「無の間」:あいこのたびに、相手に大ダメージ(「虚」を当てていれば2倍)
    S.teams.forEach((t, side) => {
      const c = active(t), ds = traitOf(c, 'drawStrike'), foe = active(S.teams[1 - side]);
      if (!ds || c.hp <= 0 || foe.hp <= 0) return;
      const d = damage(S, c, foe, ds.rate * (c.voidCharge ? 2 : 1), false);
      c.voidCharge = false; c.lastDraw = d;
      foe.hp = Math.max(0, foe.hp - d);
      undyingCheck(S, foe, false, 1 - side, log);
      S.ticks.push({ side: 1 - side, dmg: d, label: ds.name });
      trig(c, 'drawStrike');
      log(`　${t.label}の${nameOf(c)}の「${ds.name}」:${nameOf(foe)}に${d}ダメージ`);
    });
    // 特性「逆巻き」:あいこでも連勝が1増える
    S.teams.forEach((t) => {
      if (!traitOf(active(t), 'drawStreak')) return;
      t.streak++; trig(active(t), 'drawStreak');
      log(`　${t.label}の${nameOf(active(t))}の「逆巻き」:あいこでも連勝+1`);
      if (t.streak >= BREAK_STREAK) { t.streak = 0; t.breakReady = true; log(`　${t.label}が${BREAK_STREAK}連勝 → ${BREAK_NAME}!`); }
    });
  } else {
    const side = r > 0 ? 0 : 1;
    const wt = S.teams[side], lt = S.teams[1 - side];
    if (lt.keep) { lt.keep = false; log(`　${lt.label}の連勝は途切れなかった`); }
    else lt.streak = 0;
    act(S, side, side === 0 ? hand0 : hand1, log);
    // 特性「連射」:勝つたびに次の攻撃が強くなり、負けると消える
    const ws = active(wt), ls = active(lt);
    if (traitOf(ws, 'winStack') && ws.hp > 0) ws.stackAtk = (ws.stackAtk || 0) + traitOf(ws, 'winStack').v;
    if (traitOf(ls, 'winStack')) ls.stackAtk = 0;
    if (wt.sealed) { wt.sealed = false; log(`　${wt.label}のこの勝ちは連勝に数えない`); }
    else wt.streak++;
    if (wt.forceBreak) {   // 「BREAK確定」の技で勝った(連勝封じがかかっていても BREAK になる)
      wt.forceBreak = false; wt.streak = 0; wt.breakReady = true;
      log(`　${wt.label}の${nameOf(active(wt))}の「${active(wt).actions[side === 0 ? hand0 : hand1].name}」→ ${BREAK_NAME}確定!`);
    } else if (wt.streak >= BREAK_STREAK) {
      wt.streak = 0;
      wt.breakReady = true;
      log(`　${wt.label}が${BREAK_STREAK}連勝 → ${BREAK_NAME}!`);
    }
  }
  endRally(S, log, winSide);
  return r;
}

// ブレイク中のラリー:じゃんけん無しで、選んだ手のアクションが確定で通る
function breakRally(S, side, hand, log) { TRIG = []; try { return breakRallyCore(S, side, hand, log); } finally { S.trig = TRIG; TRIG = null; } }
function breakRallyCore(S, side, hand, log) {
  log(`— ラリー${S.rally + 1}:${S.teams[side].label}の${BREAK_NAME} —`);
  beginRally(S, log);
  S.teams[side].breakReady = false;
  (S.bhist = S.bhist || []).push([side, hand]);   // BREAKで選んだ手(ログの集計用)
  act(S, side, hand, log, true);
  // 特性「始の刻」:BREAKするたびに、ATKがずっと上がる
  const me = active(S.teams[side]), grow = traitOf(me, 'breakGrow');
  if (grow && me.hp > 0) { trig(me, 'breakGrow'); me.growAtk = (me.growAtk || 0) + grow.add; log(`　${nameOf(me)}の「${grow.name}」:ATK+${grow.add}(合計+${me.growAtk})`); }
  // 特性「三刻の重ね」:BREAKで停止・跳躍・遡行を1回ずつ当てると、「時の外側」が消える
  const foe = active(S.teams[1 - side]);
  if (traitOf(foe, 'weakness') && !foe.captured && foe.hp > 0 && S.hit && S.hit.dmg > 0) {
    const got = new Set((foe.seals || '').split(',').filter(Boolean)).add(hand);
    foe.seals = [...got].join(',');   // 文字列で持つ(CPUが盤面を写して試すときに、元と共有しないため)
    log(`　三刻の重ね:${[...got].map((h) => HANDS[h].power).join('・')}(${got.size}/3)`);
    if (got.size >= 3) {
      foe.captured = true;
      S.events.push({ type: 'capture', side: 1 - side });
      log(`　${nameOf(foe)}を今に捕らえた。「時の外側」が消えた`);
    }
  }
  endRally(S, log, side);
}

// ブレイク時にCPUが選ぶ手:倒せるなら倒す、そうでなければ一番得な手
function pickBreakHand(S, side) {
  const me = active(S.teams[side]), foe = active(S.teams[1 - side]);
  const n = me.turn + 1;                     // これから始まるラリーが、自分のカードにとって何ラリー目か
  const hit = damage(S, me, foe, 1, true);   // 今の状態での通常攻撃1回ぶん(BREAK中なのでDFS無視)
  let best = HAND_KEYS[0], bestScore = -1;
  for (const h of HAND_KEYS) {
    const a = me.actions[h];
    const d = a.rate ? damage(S, me, foe, rateOf(a, me, foe, n, true), true) : 0;
    let s = Math.min(d, foe.hp) + (d >= foe.hp ? 1e6 : 0);
    if (a.heal) s += Math.min(a.heal, me.max - me.hp);
    if (a.poison) s += Math.min(a.poison * hit * POISON_RATE, foe.hp);
    if ((a.cleanse || a.cure) && me.poison > 0) s += me.poison * me.poisonDmg;
    s += ((a.atkUp || 0) + (a.nextAtkUp || 0) * 0.8) / baseAtk(me) * hit * 0.6;
    s += ((a.dfsUp || 0) + (a.nextDfsUp || 0) * 0.8) / 10000 * hit * 0.6;
    (a.mods || []).forEach((m) => { s += (m.stat === 'atk' ? Math.abs(m.v) / baseAtk(me) : Math.abs(m.v) / 10000) * hit * m.t * 0.3; });
    s += ((a.streak || 0) * 0.5 + (a.seal || 0) * 0.3 + (a.keep || 0) * 0.3) * hit;
    if (s > bestScore) { bestScore = s; best = h; }
  }
  return best;
}
const randomHand = () => HAND_KEYS[Math.floor(Math.random() * HAND_KEYS.length)];


// ===== CPUの思考 =====
// 難易度ごとに「どこまで先を考えるか」が違う。どの難易度も、今の盤面で9通りの手の組み合わせを
// 実際に1ラリー進めてみて、その結果の良し悪し(evalState)を比べている。見ているのは過去の手だけ。
const AI_LEVELS = {
  1: { name: 'やさしい',   depth: '自分の技の得だけを見る' },
  2: { name: 'ふつう',     depth: '相手の出方を予測して、それに勝つ手を選ぶ' },
  3: { name: 'むずかしい', depth: '読まれることまで考えて、読み合いの均衡と相手の癖を両方使う' },
  4: { name: 'ボス', depth: '相手が実際に出した手の癖を強く読み、癖がなければ均衡の割合で打つ' },   // ソロの★★★専用
};
const beaterOf = (h) => HAND_KEYS.find((k) => HANDS[k].beats === h);   // h に勝つ手

// 盤面のコピー(試しに1ラリー進めるため)。キャラのデータは共有し、変わる部分だけ複製する
function cloneState(S) {
  return {
    ...S, hit: null, ticks: [], events: [], hist: [], bhist: [],
    teams: S.teams.map((t) => ({ ...t, cards: t.cards.map((c) => ({ ...c, mods: c.mods.map((m) => ({ ...m })) })) })),
  };
}

// 片方のチームの「良さ」。残っているカードとHPが主で、強化・弱体・時蝕・連勝を少し加味する
function teamValue(t) {
  let v = 0;
  t.cards.forEach((c) => { if (c.result !== 'lose' && c.hp > 0) v += 0.5 + 0.5 * c.hp / c.max; });
  const f = active(t);
  if (f.hp > 0) {
    v += (modSum(f, 'atk') + f.atkBonus + f.teamAtk + f.markAtk) / f.atk * 0.15 + f.atkUp / f.atk * 0.1;
    v += (modSum(f, 'dfs') + f.dfsBonus + f.dfsGain + f.teamDfs + f.markDfs) / 10000 * 0.3 + f.dfsUp / 10000 * 0.15 - f.noHeal * 0.01;
    v -= Math.min(f.hp, f.poison * f.poisonDmg) / f.max * 0.4;
  }
  v += t.breakReady ? 0.35 : t.streak * 0.08;
  v += (t.keep ? 0.04 : 0) - (t.sealed ? 0.04 : 0);
  if (f.hp > 0 && traitOf(f, 'weakness')) v -= f.captured ? 1.2 : (f.seals ? f.seals.split(',').length : 0) * 0.3;
  return v;
}
function evalState(S, side) {
  const end = S.over ? (S.winner === side ? 10 : S.winner === 1 - side ? -10 : 0) : 0;
  return end + teamValue(S.teams[side]) - teamValue(S.teams[1 - side]);
}

// 損得の表:M[自分の手][相手の手] = その組み合わせで1ラリー進めたとき、自分にとってどれだけ得か
function payoffMatrix(S, side) {
  const base = evalState(S, side), M = {}, kill = {};
  for (const a of HAND_KEYS) {

  // 逆に読まれていると考えて、読まれても損をしにくい均衡の割合に戻す
  const recent = S.hist.slice(-8).map((p) => judge(p[side], p[1 - side])).filter((r) => r !== 0);
  const lost = recent.length ? recent.filter((r) => r < 0).length / recent.length : 0;
  const outread = recent.length >= 5 && lost >= 0.7 ? 0.25 : 1;
  // 癖の偏りが小さいうちは、たまたまの偏りとみて信じない(読みに行くと、こちらの手が偏って逆に読まれるため)
  const dev = Math.max(...HAND_KEYS.map((h) => Math.abs(all.q[h] - 1 / 3)));
  const edge = Math.max(0, Math.min(1, (dev - 0.12) / 0.15));
  let trust = Math.min(trustMax, all.n / 10 * trustMax) * outread * edge;
  // 性格の読み(並び・狙い撃ちなど)が確かなら、その予測を混ぜて、そのぶん読みに賭ける
  if (pr && pr.q) {
    const pw = Math.min(0.8, pr.power);
    HAND_KEYS.forEach((h) => { q[h] = (1 - pw) * q[h] + pw * pr.q[h]; });
    trust = Math.max(trust, trustMax * pr.power * outread);
  }
  if (pr && pr.calm) trust *= 0.2;
  const best = argmax((a) => expect(M, a, q));
  const mix = {};
  HAND_KEYS.forEach((h) => { mix[h] = (1 - trust) * eq[h] + (h === best ? trust : 0); });
  return { eq, q, best, mix, outread, prev, trust };
}

// ブレイク時の手:3通りを実際に試して、一番良い盤面になる手を選ぶ
function aiBreakHand(S, side) {
  return argmax((h) => {
    const T = cloneState(S);
    breakRally(T, side, h, () => {});
    return evalState(T, side);
  });
}

function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  let ctx = null, master = null, on = true;
  const SE_FILES = { puchun: 'se/puchun.mp3' }, smp = {}, smpLoading = {};
  const LEVEL = 0.55;
  function ac() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;

      const comp = ctx.createDynamicsCompressor();   // 音を重ねても割れないように抑える
      master = ctx.createGain();
      master.gain.value = on ? LEVEL * FX.seVol : 0;

    if (ctx.state === 'suspended') ctx.resume();

  }

// ----- BGM -----
// 曲は「なぐもりずの音楽室」(https://nagumorizu.com/)の楽曲。利用条件と表記は bgm/CREDIT.txt にある。
// main は対戦中の曲、climax は決着が近いときの曲。ファイルが読めなければ何もせず、「曲」ボタンも出さない。
// main:対戦中、climax:決着が近いとき、xeno:★5の肉体戦。tick(時計の音)はファイルではなく合成する
// title:タイトル画面(climax と同じ曲)、menu:メニュー(キャラ選択)、toki:★★★★ トキバミ戦(天使迎撃戦)
const BGM_TRACKS = { main: 'bgm/The-Battle-of-Beliefs.mp3', climax: 'bgm/Sign-of-Victory.mp3', xeno: 'bgm/Devine-Fencer.mp3', title: 'bgm/Sign-of-Victory.mp3', menu: 'bgm/Important-Thing.mp3', toki: 'bgm/Tenshi-Geigekisen.mp3', cirque: 'bgm/Le-Cirque-du-Diable.mp3', majo: 'bgm/Kokuyoku-no-Majo.mp3' };
const BGM_VOLUME = 0.2;
// 曲は、効果音と同じ仕組み(WebAudio)で鳴らす。
// iPhoneでは <audio> での再生がうまくいかないことがあり、効果音だけ鳴って曲が鳴らなかったため。
// 曲のファイルを読み込んで音のデータに変換し、ループ再生する。メモリを食うので、変換して持つのは今流す曲だけにする
const Bgm = (() => {
  const raw = {}, buf = {}, gain = {}, src = {}, startedAt = {}, decoding = {}, missing = {};
  let ctx = null, on = true, want = false, now = 'main', ducked = false;
  const level = () => (ducked === 'mute' ? 0 : ducked ? 0.04 : BGM_VOLUME) * FX.bgmVol;   // 'mute' は完全に消す
  const ensure = () => (ctx || (ctx = Sound.wake()));
  function showButton() { $('optBgm').classList.remove('hidden'); $('bgmCredit').classList.remove('hidden'); }
  const loading = {};
  // 曲のファイルを読み込む(最初に使うときだけ)
  function load(name) {
    if (raw[name]) return Promise.resolve(raw[name]);
    if (!BGM_TRACKS[name]) return Promise.resolve(null);
    if (!loading[name]) {
      loading[name] = fetch(BGM_TRACKS[name]).then((r) => (r.ok ? r.arrayBuffer() : null))
        .then((ab) => { if (ab) raw[name] = ab; else missing[name] = true; return ab; })
        .catch(() => { missing[name] = true; return null; });
    }
    return loading[name];
  }
  // 音のデータを、モノラル・24kHzにしてメモリを減らす(長い曲だと、そのままでは100MBを超えるため)
  function slim(b) {
    const rate = 24000, n = Math.floor(b.duration * rate), out = ctx.createBuffer(1, n, rate), o = out.getChannelData(0);
    const chs = []; for (let c = 0; c < b.numberOfChannels; c++) chs.push(b.getChannelData(c));
    const step = b.sampleRate / rate;
    for (let i = 0; i < n; i++) {
      const x = i * step, j = Math.floor(x), f = x - j;
      let v = 0;
      for (const d of chs) v += d[j] + ((d[j + 1] || 0) - d[j]) * f;
      o[i] = v / chs.length;
    }
    return out;
  }
  // 時計の「チックン、タックン」を2秒の繰り返しとして作る
  function makeTick() {
    const sr = 24000, b = ctx.createBuffer(1, sr * 2, sr), d = b.getChannelData(0);
    const click = (at, f, vol) => {
      const s0 = Math.floor(at * sr);
      for (let i = 0; i < sr * 0.2 && s0 + i < d.length; i++) {
        const t = i / sr;
        d[s0 + i] += vol * (Math.sin(2 * Math.PI * f * t) * Math.exp(-t * 60) + 0.4 * Math.sin(2 * Math.PI * f * 2.7 * t) * Math.exp(-t * 120));
      }
    };
    click(0, 1900, 0.8); click(0.09, 1500, 0.35);   // チック、ン
    click(1.0, 1250, 0.8); click(1.09, 980, 0.35);  // タック、ン
    return b;
  }
  // 曲を音のデータに変換する(1曲あたり1秒前後かかる)
  function decode(name) {
    if (buf[name]) return Promise.resolve(buf[name]);
    if (name === 'tick') { if (!ensure()) return Promise.resolve(null); buf.tick = makeTick(); return Promise.resolve(buf.tick); }
    if (decoding[name]) return decoding[name];
    decoding[name] = load(name).then((ab) => new Promise((ok) => {
      const done = (b) => { delete decoding[name]; if (b) buf[name] = slim(b); else missing[name] = true; ok(buf[name] || null); };
      if (!ab || !ensure()) { delete decoding[name]; ok(null); return; }
      try { ctx.decodeAudioData(ab.slice(0), done, () => done(null)); } catch (e) { done(null); }
    }));
    return decoding[name];
  }
  function startTrack(name, fadeMs) {
    if (!want || !on || missing[name] || src[name] || !ensure()) return;
    if (!buf[name]) { decode(name).then(() => { if (name === now) startTrack(name, fadeMs); }); return; }
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime, g = gain[name] = ctx.createGain();
    g.connect(ctx.destination);
    g.gain.setValueAtTime(fadeMs ? 0.0001 : level(), t);
    if (fadeMs) g.gain.linearRampToValueAtTime(level(), t + fadeMs / 1000);
    const s = src[name] = ctx.createBufferSource();
    s.buffer = buf[name]; s.loop = true; s.connect(g); s.start();
    startedAt[name] = t;
  }
  function stopTrack(name, fadeMs) {
    const s = src[name], g = gain[name];
    if (!s) return;
    delete src[name]; delete gain[name];
    const t = ctx.currentTime;
    if (fadeMs) {
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0.0001, t + fadeMs / 1000);
      s.stop(t + fadeMs / 1000 + 0.05);
    } else s.stop();
  }
  return {
    init() {
      load('main').then((ab) => { if (ab) { showButton(); if (ctx) decode('main'); if (now === 'main') startTrack('main'); } });
    },
    // 最初に画面を触ったとき:音を出せる状態にして、最初の曲の変換を始めておく
    // 曲のデータを先に用意しておく(流すのは play のとき)
    prepare(name) { if (ensure()) decode(name); },
    ready(name) { return ensure() ? decode(name) : Promise.resolve(null); },   // その曲の変換が終わるまで待つ
    // 最初に画面に触れたとき:止まっている音を動かし、流したい曲があれば流す(ブラウザは、触れる前の再生を止めるため)
    unlock() {
      if (!ensure()) return;
      if (ctx.state === 'suspended') ctx.resume();
      if (want && !src[now]) startTrack(now, 300); else decode('main');
    },
    setOn(v) { on = v; if (v) startTrack(now, 300); else stopTrack(now); },
    setVol() { const g = gain[now]; if (g && ctx) { g.gain.cancelScheduledValues(ctx.currentTime); g.gain.setValueAtTime(level(), ctx.currentTime); } },
    // 対戦開始:最初の曲を頭から流す
    // 対戦開始:最初の曲(ふつうは main)を頭から流す。ほかの曲のデータは手放す
    play(name = 'main') {
      want = true; ducked = false;
      Object.keys(src).forEach((n) => stopTrack(n));
      Object.keys(buf).forEach((n) => { if (n !== name && n !== 'main') buf[n] = null; });
      now = name;
      startTrack(name);
    },
    stop() { want = false; Object.keys(src).forEach((n) => stopTrack(n)); buf.climax = null; buf.xeno = null; },
    // 曲を切り替える(前の曲を小さくしながら、次の曲を頭から流す)
    switchTo(name) {
      if (name === now || missing[name]) return;
      const old = now; now = name;
      if (!want || !on) return;
      stopTrack(old, 600);
      if (old !== 'tick') buf[old] = null;   // 前の曲のデータは手放す(次に使うときに変換し直す)
      startTrack(name, 600);
    },
    current: () => now,
    state: () => ({ track: now, playing: !!src[now], time: src[now] ? +(ctx.currentTime - startedAt[now]).toFixed(2) : 0 }),   // 動作確認用
    duck(v) {   // 時間が止まる間は小さくする
      ducked = v;
      const g = gain[now];
      if (!g) return;
      const t = ctx.currentTime;
      g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(level(), t + 0.25);
    },
  };
})();

function climaxReady() {

  const hp = left.reduce((s, c) => s + c.hp, 0), max = cards.reduce((s, c) => s + c.max, 0);

}
// あとひと刻のオーラ:ガラスの破片が画面の左右の端を、下から上へ立ちのぼる。決着がつくか、対戦画面を出ると止まる

const Particles = (() => {
  let list = [], running = false, cv, g;
  function fit() {
    cv.width = innerWidth; cv.height = innerHeight;
  }
  function loop() {
    g.clearRect(0, 0, cv.width, cv.height);
    list = list.filter((p) => p.life > 0);
    for (const p of list) {
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
      g.globalAlpha = Math.min(1, p.life / 20);
      g.fillStyle = p.c;
      if (p.tri) {
        // ガラスの破片:回りながら落ちる三角形
        g.save(); g.translate(p.x, p.y); g.rotate(p.r += p.vr);
        g.beginPath(); g.moveTo(0, -p.s); g.lineTo(p.s * 0.8, p.s * 0.6); g.lineTo(-p.s * 0.6, p.s * 0.4); g.closePath();
        g.fill(); g.strokeStyle = '#ffffff'; g.lineWidth = 0.7; g.stroke(); g.restore();
      } else g.fillRect(p.x, p.y, p.s, p.s);
    }
    g.globalAlpha = 1;
    if (list.length) requestAnimationFrame(loop); else running = false;
  }
  function add(p) {
    if (REDUCE) return;
    if (!cv) { cv = $('particles'); g = cv.getContext('2d'); fit(); addEventListener('resize', fit); }
    list.push(p);
    if (!running) { running = true; requestAnimationFrame(loop); }
  }
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  return {
    // 画面全体のガラスが割れて、破片が中心から外へ飛び散って落ちる
    shards(cx, cy, colors, n = 70) {
      for (let i = 0; i < n; i++) {
        const x = Math.random() * innerWidth, y = Math.random() * innerHeight;
        const a = Math.atan2(y - cy, x - cx), v = 2 + Math.random() * 7;
        add({ tri: true, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: 0.45, life: 45 + Math.random() * 35, s: 7 + Math.random() * 20, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: pick(colors) });
      }
    },
    // 一点からガラスの破片が飛び散る(回りながら落ちる三角形)
    glassBurst(x, y, n, colors, power = 10) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = Math.random() * power + 2;
        add({ tri: true, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, g: 0.32, life: 50 + Math.random() * 40, s: 5 + Math.random() * 16, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.5, c: pick(colors) });
      }
    },
    // 一点から飛び散る
    burst(x, y, n, colors, power = 6) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = Math.random() * power + 1;
        add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.5, g: 0.18, life: 30 + Math.random() * 30, s: 2 + Math.random() * 4, c: pick(colors) });
      }

    // 砂のように崩れ落ちる
    crumble(rect, colors) {

        add({ x: rect.left + Math.random() * rect.width, y: rect.top + Math.random() * rect.height, vx: (Math.random() - 0.5) * 1.2, vy: Math.random() * 1.5, g: 0.22, life: 50 + Math.random() * 40, s: 2 + Math.random() * 3, c: pick(colors) });
      }

    // 画面上から降り注ぐ

        add({ x: Math.random() * innerWidth, y: -20 - Math.random() * 300, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 4, g: 0.05, life: 120 + Math.random() * 80, s: 3 + Math.random() * 5, c: pick(colors) });

function tickLoop() {
  clearTimeout(tickTimer);
  if (!S || S.over || $('battle').classList.contains('hidden')) return;
  const heat = Math.min(BREAK_STREAK - 1, Math.max(S.teams[0].streak, S.teams[1].streak));
  // 背景の時計の音は鳴らさない(バトル中の電子音を減らすため)
  document.documentElement.style.setProperty('--tick', [8, 4, 1.6][heat] + 's');
  tickTimer = setTimeout(tickLoop, [900, 600, 360][heat]);
}

// ----- ログ(演出が終わるまで溜めておく) -----
function log(text) {
  const d = document.createElement('div');
  d.textContent = text;
  $('log').prepend(d);
}
let logBuf = [];
const logLater = (t) => logBuf.push(t);
function flushLog() { logBuf.forEach(log); logBuf = []; }

// ----- 描画 -----
function actionList(ch, tag, cls) {
  return HAND_KEYS.map((h) => {
    const a = ch.actions[h];
    return `<${tag} class="${cls}">${HANDS[h].icon} ${HANDS[h].power}「${a.name}」:${describe(a)}</${tag}>`;
  }).join('');
}
// 能力値を、素の値より上がっていれば↑、下がっていれば↓を付けて表示する
const statNow = (label, now, base) => `<span class="${label === 'ATK' ? 's-atk' : 's-dfs'}">${label} <span class="${now > base ? 'up' : now < base ? 'down' : ''}">${now}${now > base ? '↑' : now < base ? '↓' : ''}</span></span>`;
// フィジカル係数(phys)は裏データなので画面には出さない
const statLine = (ch) => `<span class="s-atk">ATK ${ch.atk}</span>　<span class="s-dfs">DFS ${ch.dfs}</span>`;
const traitLine = (ch) => '特性' + traitsOf(ch).map((t) => `「${t.name}」${t.desc}`).join(' ');

// --- 対戦画面は、スクロールしなくても全部見えるように1画面に詰める ---

// ボスラッシュで倒したボスの数(ゼノの肉体と精神離脱体は、2つで1体)
const rushCount = (t) => t.cards.filter((c) => c.result === 'lose' && c.ch.id !== 'xeno_body').length;
// 上段:本数・連勝・5枚の並び
function teamHead(el, t) {
  const mark = { win: '○', lose: '×', draw: '△' };
  const rush = S.stage && S.stage.rush && t === S.teams[1];
  const chips = rush ? `<span class="chip on">${dispName(active(t).ch)}</span><span class="chip">${rushCount(t) + (S.over && S.winner === 0 ? 0 : 1)} / ${S.stage.rush.length}体目</span>` : t.cards.map((c, i) => {
    if (c.ch.hiddenUntilActive && i > t.idx) return '';   // ★5の精神離脱体は、出てくるまで隠す
    const cls = c.result === 'lose' ? 'chip ko' : i === t.idx && !c.result ? 'chip on' : 'chip';
    return `<span class="${cls}">${dispName(c.ch)}${c.result ? mark[c.result] : ''}</span>`;
  }).join('');
  const reach = !t.breakReady && t.streak >= BREAK_STREAK - 1;
  const streak = t.breakReady
    ? `<span class="break">${BREAK_NAME}!</span>`
    : '●'.repeat(t.streak) + '○'.repeat(Math.max(0, BREAK_STREAK - t.streak)) + (reach ? ' リーチ!' : '');
  el.innerHTML = `<div class="head"><span>${escHtml(t.label)}${t === S.teams[1] && !PVP.on ? `(${S.stage ? (S.stage.rush ? '連戦' : '★'.repeat(S.stage.stars)) : AI_LEVELS[S.cpuLevel].name})` : ''} <span class="score">撃破${t.wins}</span></span>
    <span class="streak${reach ? ' reach' : ''}">${streak}</span></div>
    <div class="chips">${chips}</div>`;
}

// ATK・DFS の小さなゲージ。素の値より上がっていれば水色、下がっていれば紫。白い線は素の値の位置
const ATK_GAUGE_MAX = 7500;   // ATKゲージの右端(DFSゲージの右端は上限の DFS_MAX)
function statGauge(label, now, base, max) {
  const cls = now > base ? 'up' : now < base ? 'down' : '';
  const w = Math.min(100, now / max * 100), mark = Math.min(100, base / max * 100);
  return `<div class="gauge ${label === 'ATK' ? 'atk' : 'dfs'} ${cls}"><div class="stats">${statNow(label, now, base)}</div>
    <div class="mini"><i style="width:${w}%"></i><u style="left:${mark}%"></u></div></div>`;
}

// 勝負の枠の中:場のカードの名前・HP・ゲージ・能力値・状態
function stageSide(el, t, f) {
  const bar = (f.hp / f.max) * 100;
  // 同じカードなら、前の長さから今の長さへゲージを動かす(減っていく様子が見える)
  const from = el.dataset.card === f.ch.id ? Number(el.dataset.bar) : bar;
  el.dataset.card = f.ch.id; el.dataset.bar = bar;
  const st = statusList(t, f);
  el.innerHTML = `<div class="who">${iconHtml(f.ch, 'sm')}${nameOf(f)}<span class="turn">場${f.turn + 1}ラリー目</span></div>
    <div class="s-hp">HP <b>${f.hp}</b> / ${f.max}</div>
    <div class="bar"><div class="hpbar ${bar <= 34 ? 'low' : ''}" style="width:${from}%"></div></div>
    <div class="gauges">${statGauge('ATK', shownAtk(t, f), f.atk, ATK_GAUGE_MAX)}${statGauge('DFS', baseDfs(f), f.dfs, DFS_MAX)}</div>
    <div class="status" role="button" tabindex="0" aria-label="バフ・デバフをすべて見る">${st.map((x) => `<span class="sc ${x.k}">${x.s}</span>`).join('')}</div>`;
  el.querySelector('.status').classList.toggle('none', !st.length);
  // 収まりきらないときは「…」を出す(押すと全部見られる)
  const box = el.querySelector('.status');
  box.classList.toggle('more', box.scrollHeight > box.clientHeight + 2);
  if (from !== bar) { const hb = el.querySelector('.hpbar'); void hb.offsetWidth; hb.style.width = bar + '%'; }
}

// 画面に出すATK:特性による増減(全力の減速・背水・先駆け・連射など)も込み。BREAK中だけの上乗せは含めない
function shownAtk(t, f) {
  const foe = S && S.teams.includes(t) ? active(S.teams[1 - S.teams.indexOf(t)]) : f;
  const next = { ...f, turn: f.turn + 1 };   // 次のラリー(これから打つ一撃)で使うATKを出す。技のボタンや状態欄と同じ数え方
  return Math.min(ATK_MAX, Math.max(ATK_MIN, baseAtk(next) + traitAtk(S, next, foe, false)));
}
// ログの上に出す、この対戦でお互いがどの手を何回出したか(じゃんけんとBREAK)
function renderHandStats() {
  const el = $('handStats');
  if (!el || !S) return;
  const H = S.hist || [], B = S.bhist || [];
  if (!H.length && !B.length) { el.innerHTML = ''; return; }
  const row = (side) => {
    const n = H.length, cnt = HAND_KEYS.map((h) => H.filter((x) => x[side] === h).length);
    const bc = HAND_KEYS.map((h) => B.filter((x) => x[0] === side && x[1] === h).length);
    return `<tr><td>${escHtml(S.teams[side].label)}</td>${cnt.map((c, i) => `<td>${c}<small>${n ? ` ${Math.round(c / n * 100)}%` : ''}</small>${bc[i] ? `<br><small>BREAK ${bc[i]}</small>` : ''}</td>`).join('')}</tr>`;
  };
  el.innerHTML = `<table><tr><th>出した手</th>${HAND_KEYS.map((h) => `<th>${HANDS[h].icon}</th>`).join('')}</tr>${row(0)}${row(1)}</table>` +
    `<div class="hs-cap">じゃんけん${H.length}回${B.length ? `・BREAK${B.length}回` : ''}</div>`;
}
// 場のカードにかかっている効果の一覧。s は札に書く短い文、l は一覧に書く説明、k は up(強化)/down(弱体)/info
function statusList(t, f) {
  const st = [], sign = (v) => (v > 0 ? '+' : '−'), L = (stat) => (stat === 'atk' ? 'ATK' : 'DFS');
  const add = (s, l, k) => st.push({ s, l, k });
  f.mods.forEach((m) => add(`${L(m.stat)}${sign(m.v)}${Math.abs(m.v)}·${m.t}`, `${L(m.stat)}${sign(m.v)}${Math.abs(m.v)}(残り${m.t}ラリー)`, m.v > 0 ? 'up' : 'down'));
  if (f.fac) add(`陣営 ${f.fac.text}`, `${f.fac.faction}の陣営ボーナス:${f.fac.text}(試合中ずっと)`, 'up');
  const inh = f.atkBonus - (f.tsuzuri || 0);   // アワイの「零の綴じ」のぶんは分けて出す
  if (inh) add(`継承ATK+${inh}`, `継承 ATK+${inh}(前の番手から受け継いだ強化。場にいる間ずっと)`, 'up');
  if (f.tsuzuri) add(`零の綴じATK+${f.tsuzuri}`, `零の綴じ ATK+${f.tsuzuri}(アワイの特性。試合中ずっと)`, 'up');
  // アワイの「継ぎ刻」:前の番手にアワイがいれば、BREAKのダメージが上がる
  const ti = t.cards.indexOf(f), tk = ti > 0 ? t.cards.slice(0, ti).map((c) => traitOf(c, 'tsugiKoku')).find(Boolean) : null;
  if (tk) { const m = f.ch.id === 'rei' ? tk.rei : tk.mul; add(`${BREAK_NAME}ダメ×${m}`, `${BREAK_NAME}で与えるダメージ${m}倍(アワイの継ぎ刻。試合中ずっと)`, 'up'); }
  if (f.cut) add(`被ダメ−${Math.round(f.cut * 100)}%`, `受けるダメージ−${Math.round(f.cut * 100)}%(アワイの刻寄せ。試合中ずっと)`, 'up');
  if (f.dfsBonus) add(`継承DFS+${f.dfsBonus}`, `継承 DFS+${f.dfsBonus}(前の番手から受け継いだ強化。場にいる間ずっと)`, 'up');
  if (f.teamAtk) add(`全体ATK+${f.teamAtk}`, `味方全員 ATK+${f.teamAtk}(消えない)`, 'up');
  if (f.teamDfs) add(`全体DFS+${f.teamDfs}`, `味方全員 DFS+${f.teamDfs}(消えない)`, 'up');
  if (f.dfsGain) add(`不動DFS+${f.dfsGain}`, `特性で上がったDFS+${f.dfsGain}`, 'up');
  if (f.markAtk) add(`刻印ATK${f.markAtk}`, `刻印 ATK${f.markAtk}(消えない弱体)`, 'down');
  if (f.markDfs) add(`刻印DFS${f.markDfs}`, `刻印 DFS${f.markDfs}(消えない弱体)`, 'down');
  if (f.noHeal) add(`回復封じ·${f.noHeal}`, `回復封じ(残り${f.noHeal}ラリー。回復できない)`, 'down');
  if (f.poison) add(`時蝕·${f.poison}`, `時蝕(残り${f.poison}ラリー。毎ラリー${f.poisonDmg}ダメージ)`, 'down');
  if (f.atkUp) add(`次撃ATK+${f.atkUp}`, `次の攻撃だけ ATK+${f.atkUp}`, 'up');
  if (f.dfsUp) add(`次被弾DFS+${f.dfsUp}`, `次に受ける攻撃だけ DFS+${f.dfsUp}`, 'up');
  // 後ろの番手に効果を渡す技・特性(発動した回数つき)
  Object.values(t.relay || {}).forEach((r) => add(`後続:${r.label}×${r.n}`, `後続へ「${r.label}」×${r.n}回:${r.text}`, 'info'));
  if (t.keep) add('連勝保護', '連勝保護(次に負けても、連勝が途切れない)', 'up');
  if (t.sealed) add('連勝封じ', '連勝封じ(次に勝っても、連勝に数えない)', 'down');
  // 特性「全力」:3ラリー目までは技がすべて極大、そのあとは毎ラリーATKが下がる
  const bo = traitOf(f, 'burnout');
  if (bo) {
    const n = f.turn + 1;   // 次のラリーで、場に出て何ラリー目か
    if (n <= bo.until) add(`全力·あと${bo.until - n + 1}`, `全力:技がすべて極大(あと${bo.until - n + 1}ラリー)`, 'up');
    else add(`減速ATK−${Math.min(bo.cap, (n - bo.until) * bo.step)}`, `全力のあとの減速:ATK−${Math.min(bo.cap, (n - bo.until) * bo.step)}(毎ラリー−${bo.step}、最大−${bo.cap})`, 'down');
  }
  if (f.stackAtk) add(`連射ATK+${f.stackAtk}`, `連射:次の攻撃ATK+${f.stackAtk}(負けると消える)`, 'up');
  const rite = traitOf(f, 'rewindRite');
  if (rite) add(`巻き戻しまで${Math.max(0, rite.limit - f.turn)}`, `巻き戻しまで残り${Math.max(0, rite.limit - f.turn)}ラリー`, 'info');
  if (traitOf(f, 'weakness')) {
    const seals = f.seals ? f.seals.split(',').map((h) => HANDS[h].power).join('・') : 'なし';
    add(f.captured ? '今に捕らえた' : `三刻 ${seals}`, f.captured ? '今に捕らえた(「時の外側」が消えている)' : `三刻の重ね:${BREAK_NAME}で当てた力 ${seals}`, 'info');
  }
  return st;
}
// 場のカードの詳しい情報(特性の全文と、かかっている効果の一覧)。side:0=自分、1=相手
function openCardInfo(side) {
  if (!S) return;

    <h3>かかっている効果</h3>${st.length ? `<ul class="stl">${st.map((x) => `<li class="${x.k}">${x.l}</li>`).join('')}</ul>` : '<p>なし</p>'}`);
}

// 技1つぶんの中身。条件を満たして格上げ中の技は hot
function actHtml(card, foe, h, isBreak) {
  const a = card.actions[h];
  // 今出せる威力(特性「全力」などで変わる分も込み):極大は赤(hot)、特大はオレンジ(warm)
  const rate = a.rate ? rateOf(a, card, foe, card.turn + 1, isBreak) : 0, changed = rate && rate !== a.rate, hot = rate >= RATE.max, warm = !hot && rate >= RATE.huge;
  return { hot, warm, html: `<span class="ico">${HANDS[h].icon}</span><span class="txt"><b>${HANDS[h].power}「${a.name}」</b>${describe(a, changed ? rate : 0, true)}</span>` };
}

// view を渡すと、場のカードの代わりにそのカードを表示する(倒れた直後に、倒れたカードを見せ続けるため)
function render(view) {
  if (!$('logPanel').classList.contains('hidden')) renderHandStats();   // ログを開いているあいだは、手の集計も更新する
  const [you, cpu] = S.teams, me = view ? view[0] : active(you), foe = view ? view[1] : active(cpu);
  teamHead($('you'), you);
  teamHead($('cpu'), cpu);
  stageSide($('hpYou'), you, me);
  stageSide($('hpCpu'), cpu, foe);
  const n = S.boutRally + 1, decay = n > DECAY_FROM;
  // ★5:精神離脱体がHP1になったあとは、やることを常に出しておく
  const hint = S.breakHint && !S.over && ['xeno_spirit', 'c5_xeno_spirit'].includes(active(S.teams[1]).ch.id);
  $('boutInfo').textContent = S.over ? '' : hint ? `${BREAK_NAME}で刻を巻き戻せ!` : `交代から${n}ラリー目` + (decay ? '　刻の抜け落ち!' : n === DECAY_FROM ? '　次から刻の抜け落ち' : '');
  $('boutInfo').className = 'boutinfo' + (hint ? ' hint' : decay ? ' warn' : '');

  // 下段:左が自分(技がそのまま手のボタン)、右が相手の技
  const traitNames = (ch) => { const tr = traitsOf(ch); return tr.length ? `特性 ${tr.map((x) => `<b>${escHtml(x.name)}</b>`).join('・')} <span class="ti">ⓘ</span>` : ''; };
  $('traitYou').innerHTML = traitNames(me.ch);
  $('traitCpu').innerHTML = traitNames(foe.ch);
  document.querySelectorAll('#hands button').forEach((b) => {
    const r = actHtml(me, foe, b.dataset.hand, you.breakReady);
    b.innerHTML = r.html;
    b.classList.toggle('hot', r.hot);
    b.classList.toggle('warm', r.warm);
    b.disabled = S.over || busy || pvpLocked() || S.spectate;
  });
  $('cpuActs').innerHTML = HAND_KEYS.map((h) => {
    const r = actHtml(foe, me, h, cpu.breakReady);
    return `<div class="act${r.hot ? ' hot' : r.warm ? ' warm' : ''}">${r.html}</div>`;
  }).join('');
  $('hands').classList.toggle('breaking', you.breakReady && !busy);
  $('retry').classList.toggle('hidden', !S.over);
  $('chain').classList.toggle('hidden', !(S.over && S.winner === 0 && S.stage && STAGES.some((x) => x.chainFrom === S.stage.id) && !S.resign));
  $('resign').classList.toggle('hidden', S.over && !S.spectate);
  $('resign').textContent = S.spectate ? '観戦をやめる' : 'リタイア';
  $('retry').classList.toggle('hidden', !S.over || !!S.spectate);
  $('retry').textContent = MODE === 'pvp' && PVP.rank ? (PVP.rank.over ? 'ランク戦を終える' : '次の試合へ') : 'キャラ選択に戻る';
  // 観戦者の人数(プレイヤーにも見せる)。ホストは自分で数え、相手は相手の知らせを見る
  const fpSp = PVP.on && !S.spectate && pvpFoe() ? Number(pvpFoe().presence.sp) || 0 : 0;
  const wn = !PVP.on && !S.spectate ? whViewers() : [];   // ソロ・CPU戦を見ているフレンド
  const nSpec = PVP.on && !S.spectate ? Math.max(PVP.room && PVP.room.specCount ? PVP.room.specCount() : 0, fpSp) : wn.length;
  $('specBadge').textContent = S.spectate ? (FW.on ? `👁 ${FW.who}さんを観戦中` : '👁 観戦中') : `👁 観戦 ${nSpec}人` + (wn.length ? `(${wn.join('・')})` : '');
  $('specBadge').classList.toggle('hidden', !(S.spectate || nSpec > 0) || $('battle').classList.contains('hidden'));
}
const setResult = (t) => { $('result').textContent = t; };

// ----- 1ラリーの進行と演出 -----
// ルールの処理(rally / breakRally)は先に済ませ、その結果を見てから演出を流す。
function before() {
  return {
    cards: S.teams.map(active), hp: S.teams.map((t) => active(t).hp),
    streak: S.teams.map((t) => t.streak), bouts: S.bouts, no: S.teams[0].idx + 1,
  };
}
function outcome(b) {
  const dead = b.cards.map((c) => c.hp <= 0);
  return {
    d: b.cards.map((c, i) => c.hp - b.hp[i]),   // HPの増減(マイナスがダメージ)
    ko: S.bouts > b.bouts,
    boutWin: dead[1] && !dead[0] ? 0 : dead[0] && !dead[1] ? 1 : -1,   // 倒した側(相打ちは -1)
    names: b.cards.map(nameOf), no: b.no, events: S.events.slice(),
    cards: b.cards,   // このラリーを戦ったカード(倒れたあとも表示に使う)
    hit: S.hit, ticks: S.ticks.slice(),   // 実際に与えた数値(とどめの一撃でも減らさない)
  };
}

// 予兆の強さ 0〜4。3(赤)以上は勝ち確定、4(虹)は撃破かBREAK確定。
// 負け・あいこでも弱い予兆は出る(外れる予兆)。
// 予兆のくじ。結果(撃破・BREAKの勝ち / ふつうの勝ち / あいこ / 負け)ごとに、[なし, 青, 好機, 激熱, 確定] の出る割合
// 演出パターンは設定で選ぶ(結果と勝率は変わらない。予兆の出方だけが変わる)
const FX_PATTERNS = {
  normal: { name: 'ノーマル', note: 'バランス型', big: [0, 0, 0.25, 0.45, 0.3], win: [0.15, 0.25, 0.35, 0.25, 0], tie: [0.6, 0.25, 0.15, 0, 0], lose: [0.75, 0.2, 0.05, 0, 0] },
  quiet: { name: '先読み熱', note: '予兆はめったに出ない(青は出ない)。好機で勝ち85%、激熱以上は勝ち確定', big: [0.05, 0, 0.15, 0.45, 0.35], win: [0.65, 0, 0.15, 0.2, 0], tie: [0.974, 0, 0.026, 0, 0], lose: [1, 0, 0, 0, 0] },
  oneshot: { name: 'メリハリ', note: '途中の予兆はなし。勝つときだけ激熱か確定がいきなり出る', big: [0, 0, 0, 0.5, 0.5], win: [0.55, 0, 0, 0.45, 0], tie: [1, 0, 0, 0, 0], lose: [1, 0, 0, 0, 0] },
};
function pickHeat(side, o, gotBreak) {
  const pt = FX_PATTERNS[FX.pattern] || FX_PATTERNS.normal;
  const row = side === 0 ? ((o.ko && o.boutWin === 0) || gotBreak ? pt.big : pt.win) : side < 0 ? pt.tie : pt.lose;
  let r = Math.random();
  for (let i = 0; i < row.length; i++) { r -= row[i]; if (r < 0) return i; }
  return 0;
}
// 先バレ:手を出した瞬間に画面が赤く光り「ぽきゅん」。出たら、このラリーのじゃんけんは勝ち確定
const SAKIBARE_RATE = 0.75;   // 先バレモードの勝利占有率:自分が勝つラリーのうち、先バレが出る割合
async function sakibareFx() {
  flash('#ff1a2e'); shake(false); Sound.pokyun();
  await sleep(450);
}

// リールが回り、予兆が出て、相手の手が止まるまで
// BREAKの瞬間:画面のガラスにひびが走り、もう一度ひびが伸びてから、砕け散る
// at:ひびの起点(省略すると勝負の枠の中央)、onBreak:ガラスが砕ける瞬間に呼ぶ
// instant:ひびを走らせずに、すぐ砕く(ガチャの板の3回目のタップ)
async function shatter(violet, at, onBreak, instant) {
  // 対戦画面の真ん中(PC版は枠が分かれているので、両方の手の間)から入る
  const st = $('stage').getBoundingClientRect();
  const mid = () => { const a = center($('slotYou')), b = center($('slotCpu')); return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
  const o = at || (st.width ? center($('stage')) : mid()), svg = $('crack');
  const rays = [];
  const N = 13;
  for (let i = 0; i < N; i++) {
    let a = (i / N) * Math.PI * 2 + (Math.random() - 0.5) * 0.3, x = o.x, y = o.y;
    const pts = [[x, y]];
    for (let k = 0; k < 7; k++) {
      a += (Math.random() - 0.5) * 0.7;
      const len = 30 + Math.random() * 80;
      x += Math.cos(a) * len; y += Math.sin(a) * len;
      pts.push([x, y]);
    }
    rays.push(pts);
  }
  const line = (pts) => `<polyline points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' ')}"/>`;
  // 隣り合うひびを横につなぐ線(クモの巣状にする)
  const web = (k) => rays.map((r, i) => line([r[k], rays[(i + 1) % N][k]])).join('');
  if (!instant) {
    svg.setAttribute('class', 'on' + (violet ? ' violet' : ''));
    if (!REDUCE) svg.innerHTML = rays.map((r) => line(r.slice(0, 3))).join('');
    Sound.crack(); shake(false);
    await sleep(280);
    if (!REDUCE) svg.innerHTML = rays.map(line).join('') + web(2) + web(4);
    Sound.crack(); shake(false);
    await sleep(330);
    svg.setAttribute('class', ''); svg.innerHTML = '';
  }
  if (onBreak) onBreak();
  Sound.glass(); flash('#ffffff'); shake(true);
  Particles.shards(o.x, o.y, violet ? COLORS.glassViolet : COLORS.glass);
  await sleep(380);
}

// プチュン:相手を倒す一撃が決まる瞬間の確定演出。
// 流れ:じゃんけんに勝つ → 技名のカットイン → ダメージ表示 → HPゲージが空になる → ここ → 「撃破!」
// 音が途切れて暗転(白い線はHPゲージの高さ)→ 無音のまま0.8秒 → 明ける
async function puchun() {
  // 短縮モードでも、何が起きたか分かる長さは残す
  const wait = (ms) => new Promise((r) => setTimeout(r, Math.max(ms * 0.5, ms * FX.speed)));
  clearTimeout(tickTimer);
  Bgm.duck(true);
  // 白い線は、HPゲージの高さに出す
  const bar = $('hpYou').querySelector('.bar').getBoundingClientRect();
  $('blackout').style.setProperty('--line-y', (bar.top + bar.height / 2) + 'px');
  $('blackout').classList.add('on');
  Sound.puchun();
  await wait(800);                        // 真っ暗で無音
  $('blackout').classList.remove('on');
  flash('#ffffff');                       // 明けた瞬間に一度だけ光る
  Bgm.duck(false);
}

async function spin(hand, cpuHand, heat, reach) {
  $('slotYou').textContent = HANDS[hand].icon;
  setResult('…');
  $('dmgLine').innerHTML = '';
  setStage('spinning', reach === 0 ? `${BREAK_NAME} リーチ!` : reach === 1 ? '危険! 相手がリーチ' : '');
  let i = 0;
  const iv = setInterval(() => {
    $('slotCpu').textContent = HANDS[HAND_KEYS[i++ % HAND_KEYS.length]].icon;
  }, 80);
  if (reach >= 0) Sound.heart();
  await sleep(300);
  if (heat) {
    $('stage').classList.add('heat' + heat);
    Sound.cue(heat);
    if (heat >= 3) $('cue').innerHTML = heat === 4 ? '<span class="rainbow">確定!!</span>' : '激熱!';
    else if (reach < 0) $('cue').textContent = heat === 2 ? '好機…' : '…';
  }
  if (reach >= 0) { await sleep(350); Sound.heart(); }
  await sleep(300 + heat * 220 + (reach >= 0 ? 250 : 0));
  if (heat === 4) {
    Particles.shower(COLORS.rainbow, 60);
    await cutin('確定', '刻が、重なる', 'rainbow', 750);
  }
  clearInterval(iv);
  $('slotCpu').textContent = HANDS[cpuHand].icon;
  Sound.stop();
  $('stage').classList.remove('spinning');
  await sleep(180);
}

// 技が通った瞬間
async function strike(side, hand, a, o, isBreak) {
  const mine = side === 0;
  const dealt = o.hit ? o.hit.dmg : 0;
  const hits = (o.hit ? o.hit.rate : 0) * 2.5;   // 演出の強さ(極大で5)
  const rate = o.hit ? o.hit.rate : 0;   // 実際に出たダメージ段階(条件つきの格上げ込み)
  const big = isBreak || rate >= RATE.huge;
  const kill = mine && o.ko && o.boutWin === 0;   // 自分の一撃で相手を倒した
  if (mine && o.hit) { S.maxHit = Math.max(S.maxHit || 0, dealt); if (o.hit.half && kill) S.rainbows = (S.rainbows || 0) + 1; }   // 称号用
  // 技名のカットイン:極大のときと、倒す一撃のとき
  if (rate >= RATE.max) { Sound.cue(3); await cutin(a.name, RATE_LABEL[rate], 'red', 650); }
  else if (kill) { Sound.cue(2); await cutin(a.name, `${HANDS[hand].power}の一撃`, 'gold', 700); }
  setStage(mine ? 'win' : 'lose', `${HANDS[hand].power}「${a.name}」`);
  // ゼノ【仮面】の十の跳躍が、遅咲きの刻(ATK10倍)のBREAKで出たとき:赤と紫のガラスの破片と重低音
  const att = o.cards[side], lb = isBreak && hand === 'scissors' ? traitOf(att, 'lateBreak') : null;
  const tenJump = !!(lb && att.turn >= lb.from && dealt > 0);
  flash(tenJump ? '#b3001b' : isBreak ? '#ffffff' : mine ? '#f5c451' : '#8b6cff');
  shake(big);
  if (tenJump) Sound.deepHit(); else if (isBreak) Sound.breakHit(); else if (dealt > 0) Sound.hit(hits); else if (!mine) Sound.lose();
  if ((o.hit && o.hit.heal) || (!dealt && (a.heal || a.atkUp || a.dfsUp))) Sound.heal();
  const c = center(panelOf(1 - side));
  if (tenJump) { Particles.glassBurst(c.x, c.y, 140, COLORS.crimsonViolet, 13); setTimeout(() => { flash('#5b2bd1'); Particles.glassBurst(c.x, c.y, 60, COLORS.crimsonViolet, 8); }, 320); }
  else if (dealt > 0 || isBreak) Particles.burst(c.x, c.y, isBreak ? 120 : 20 + hits * 12, isBreak ? COLORS.rainbow : mine ? COLORS.gold : COLORS.violet, isBreak ? 12 : 5 + hits);
  // このラリーを戦ったカードのまま描く。倒れたカードは、HPゲージが空になっていくところを見せる
  render(o.cards); flushLog(); pops(o, big);
  if (kill) {
    await new Promise((r) => setTimeout(r, Math.max(1000, 1500 * FX.speed)));   // ダメージとゲージを見せる間
    await puchun();
  } else {
    await sleep(isBreak ? 1100 : 800);
  }
}

// 与えたダメージ・回復を、数字が浮かぶ演出と、舞台の下に残る一文の両方で見せる
function pops(o, big) {
  const lines = [];
  const h = o.hit;
  if (h && h.dmg) {
    const tier = h.half ? 'rainbow' : h.dmg >= 5000 ? 't-gold' : h.dmg >= 3000 ? 't-red' : 't-white';
    pop(1 - h.side, '-' + h.dmg, 'dmg ' + tier + (big ? ' big' : ''));
    Sound.tier(tier, 0.45 * FX.speed + 0.05);
    lines.push(`<div class="dmg">${o.names[1 - h.side]}に<b class="${tier}" data-n="${h.dmg}">0</b>ダメージ!</div>`);
  }
  // 毎ラリーの増減(時蝕・処置・抜け落ち)は、高さが変わらないように1行にまとめる
  const small = [];
  if (h && h.heal) {
    pop(h.side, '+' + h.heal, 'heal');
    small.push(`<span class="heal">${o.names[h.side]} <b data-n="${h.heal}">0</b>回復</span>`);
  }
  o.ticks.forEach((t) => {
    if (t.heal) {
      setTimeout(() => pop(t.side, '+' + t.heal, 'heal small', 40), 350 * FX.speed);
      small.push(`<span class="heal">${o.names[t.side]} 処置<b data-n="${t.heal}">0</b></span>`);
    } else {
      setTimeout(() => pop(t.side, '-' + t.dmg, 'dmg small', 40), 350 * FX.speed);
      small.push(`<span class="tick">${o.names[t.side]} ${t.label || (t.decay ? '抜け落ち' : '時蝕')}<b data-n="${t.dmg}">0</b></span>`);
    }
  });
  if (small.length) lines.push(`<div class="minor">${small.join('　')}</div>`);
  // バフ・デバフが付いた・消えたことを、キャラの上に文字で出す
  o.events.filter((e) => e.type === 'mod').forEach((e, i) => {
    setTimeout(() => { pop(e.side, e.text, e.good ? 'buff' : 'debuff', -34 - i * 20); Sound.buff(e.good); }, (300 + i * 180) * FX.speed);
  });
  $('dmgLine').innerHTML = lines.join('');
  $('dmgLine').querySelectorAll('b').forEach(countUp);
}
// 数字を0から目標値まで一気に回す
function countUp(el) {
  const n = Number(el.dataset.n), t0 = performance.now(), dur = 450 * FX.speed;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(n * k);
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// カードが倒れたとき
// 特性が効いたら、特性の名前のカットイン(下に小さく効果)。同じカードの同じ特性は、1試合に1回だけ
// 変身・離脱・巻き戻しなど、もともと専用の演出がある特性は出さない
const TRAIT_FX_SKIP = new Set(['transform', 'detach', 'rewindRite', 'undying', 'weakness', 'eatMove', 'astral']);
// ステータスが動く特性は、効くたびに毎回出す(下の文に、そのとき動いた量を書く)。それ以外は1試合に1回
const TRAIT_EVERY = {
  immovable: (c, t) => `DFS+${t.gain}(合計+${c.dfsGain})`,
  breakGrow: (c, t) => `ATK+${t.add}(合計+${c.growAtk || 0})`,
  winStack: (c) => `次の攻撃 ATK+${c.stackAtk || 0}`,
  hazeMark: (c, t) => `相手のATK−${t.v}(刻印。最大−${t.cap})`,
  pierceMark: (c, t) => `相手のDFS−${t.v}(刻印。最大−${t.cap})`,
  teamCurse: (c, t) => `相手全員のATK−${t.v}(刻印)`,
  devour: (c, t) => `与えたダメージの${Math.round(t.rate * 100)}%を回復`,
  regen: (c, t) => `HP${t.heal}回復`,
  drawHeal: (c, t) => `あいこでHP${t.heal}回復`,
  drawStreak: () => 'あいこでも連勝+1',
  selfBurn: (c, t) => `自分にHP${t.dmg}のダメージ`,
  drawStrike: (c) => `相手に${c.lastDraw || 0}ダメージ`,
};
async function traitShow(c, key) {
  if (!c || TRAIT_FX_SKIP.has(key)) return;
  const t = traitOf(c, key);
  if (!t || !t.name) return;
  const every = TRAIT_EVERY[key];
  c.trShown = c.trShown || {};
  if (c.trShown[key] && !every) return;
  const first = !c.trShown[key];
  c.trShown[key] = 1;
  Sound.trait();
  // 毎回出す特性は、2回目からは短く、動いた量だけを書く
  await cutin(`「${t.name}」`, `${dispName(c.ch)}:${every && !first ? every(c, t) : `${t.desc || ''}${every ? `(${every(c, t)})` : ''}`}`, 'trait', every && !first ? 800 : 1200);
}
async function traitFx() {
  const list = (S && S.trig ? S.trig.splice(0) : []), done = new Set();
  for (const { c, key } of list) {
    const id = list.indexOf(list.find((x) => x.c === c && x.key === key));   // 同じラリーの同じ特性は1回にまとめる
    if (done.has(id)) continue;
    done.add(id);
    await traitShow(c, key);
  }
}
// 場に出たときから効く特性(全力・先駆け・白紙化・一点留め・零の綴じ):カードが場に出た時点で出す(試合の始めと、交代のあと)
const ENTRY_TRAITS = ['burnout', 'rush', 'enterDispel', 'giantSlayer'];
async function entryFx() {
  if (!S || S.over) return;
  for (const t of S.teams) {
    const c = active(t);
    if (!c || c.hp <= 0) continue;
    for (const key of ENTRY_TRAITS) if (traitOf(c, key) && (key !== 'giantSlayer' || c.giant)) await traitShow(c, key);   // 一点留めなどはボス戦のときだけ
    if (c.tsuzuri) await traitShow(t.cards.slice(0, t.idx).find((x) => traitOf(x, 'facGuard')), 'facGuard');
  }
}

// 試合の決着
async function finale() {
  clearTimeout(tickTimer);
  freeze(false);
  if (S.spectate && S.winner == null) return;   // 観戦を途中でやめた(決着していない)
  const score = `(${S.teams[0].wins}-${S.teams[1].wins})`;

    log(`ボスラッシュ:${n} / ${S.stage.rush.length}体を倒した(最高記録 ${SOLO.rush}体)`);
  }
  // 称号用の記録(勝敗が決まった時点で数える)
  if (!S.recorded) { S.recorded = true; accRecordMatch(S); }
  // オンライン対人のレーティング(1試合に1回だけ)。演出を待たずに、決着した時点で保存を始める
  let rating = null;
  if (MODE === 'pvp' && PVP.rank && !S.spectate && !S.rankDone) { S.rankDone = true; rankAfterGame(S); }
  if (MODE === 'pvp' && PVP.foeAccP && !S.rated && !S.spectate && (!PVP.rank || PVP.rank.over)) {

  }
  if (S.spectate) {
    Sound.fanfare(); Particles.shower(COLORS.rainbow, 120);
    await cutin(S.winner === -1 ? '引き分け' : `${S.teams[S.winner].label}の勝利`, score, 'rainbow', 1600);

  if (S.winner === 0) {

    }
    const firstClear = S.stage && !SOLO.cleared.includes(S.stage.id);
    if (S.stage) soloClear(S.stage.id);
    await cutin('勝利', S.stage ? `${S.stage.name} クリア ${score}` : `刻は、あなたの側に確定した ${score}`, 'rainbow', 1900);
    // 刻の回廊の★4・★5:クリアで空間のカケラ(初回は多め)
    if (S.stage && S.stage.reward && !S.shardDone) {
      S.shardDone = true;

      log(`${SHARD_NAME} +${n}(${firstClear ? '初回クリア' : 'クリア'}・所持 ${total})`);
      await cutin(`${SHARD_NAME} +${n}`, `${firstClear ? '初回クリア! ' : ''}所持 ${total}`, 'gold', 1500);
    }
  } else if (S.winner === 1) {

  } else {
    await cutin('引き分け', score, 'plain', 1200);
  }

  if (MODE === 'pvp' && !S.spectate && !S.shardDone) {
    S.shardDone = true;
    const n = shardReward(S), total = await shardAdd(n);
    log(n ? `${SHARD_NAME} +${n}(所持 ${total})` : `${SHARD_NAME}:${S.resign === 'me' || S.forfeit === 1 ? 'リタイア・応答なしの負けのため、もらえません' : 'レート戦の負けでは、もらえません'}(所持 ${total})`);

// hand は自分の手、cpuHand は相手の手。why はCPUがその手を選んだ理由(対人戦では null)
async function normalRally(hand, cpuHand, why) {
  if (!PVP.on && !S.spectate) whRec({ t: 'r', a: hand, b: cpuHand });   // フレンドの観戦用
  const b = before();
  const r = rally(S, hand, cpuHand, logLater);
  if (why) logLater(`　${why}`);
  const o = outcome(b);
  const side = r === 0 ? -1 : r > 0 ? 0 : 1;
  const reach = b.streak[0] >= BREAK_STREAK - 1 ? 0 : b.streak[1] >= BREAK_STREAK - 1 ? 1 : -1;
  const vs = `${HANDS[hand].icon} vs ${HANDS[cpuHand].icon}　`;

  if (FX.sakibare && side === 0 && !S.spectate && Math.random() < SAKIBARE_RATE) await sakibareFx();
  await transformFx(o);
  await spin(hand, cpuHand, pickHeat(side, o, S.teams[0].breakReady), reach);

  if (side < 0) {
    setStage('', 'あいこ');
    Sound.tie();
    setResult(vs + 'あいこ');
    render(); flushLog(); pops(o, false);
    await sleep(350);
  } else {
    setResult(vs + (side === 0 ? '勝ち!' : '負け…'));
    await strike(side, side === 0 ? hand : cpuHand, b.cards[side].actions[side === 0 ? hand : cpuHand], o, false);
  }
  await aftermath(o);
  if (S.over) return finale();
  await stageFx(o);
  await climaxFx();
  await entryFx();

  if (S.teams[0].breakReady) {
    await shatter(false);
    freeze(true);
    Sound.breakIn();
    await cutin(BREAK_NAME, '時が止まる。好きな手が確定で通る', 'rainbow', 1200);
    setStage('heat4', '');
    $('cue').innerHTML = S.spectate ? `<span class="rainbow">${escHtml(S.teams[0].label)}の${BREAK_NAME}!</span>` : `<span class="rainbow">${BREAK_NAME}! 好きな手を選べ</span>`;
    setResult(S.spectate ? `${S.teams[0].label}が手を選んでいます…` : `${BREAK_NAME}! 好きな手が確定で通る`);
  } else if (S.teams[1].breakReady && !PVP.on && !S.spectate) {
    await cpuBreak();   // 対人戦・観戦では、相手の手(記録)を待つ
  }
}

// 三刻の重ねがそろって、トキバミを今に捕らえたとき
async function captureFx(o) {
  if (!o.events.some((e) => e.type === 'capture')) return;

async function playerBreak(hand) {
  S.breaks = (S.breaks || 0) + 1;   // 称号用

// 相手のBREAK。forced は対人戦で相手が選んだ手
async function cpuBreak(forced) {
  await shatter(true);

async function play(hand) {
  if (PVP.on) return pvpPick(hand);
  if (busy || !S || S.over) return;
  busy = true;
  Sound.lever();
  render();
  try {
    if (S.teams[0].breakReady) await playerBreak(hand);
    else {
      const ai = aiHand(S, 1, S.cpuLevel);   // CPUは、あなたの今回の手を見ずに決める
      await normalRally(hand, ai.hand, ai.why);
    }
  } finally {
    busy = false;
    flushLog();
    render();
    tickLoop();
  }
}

const RULES_SRC = (() => { try { return document.currentScript.textContent.split('// <' + 'logic>')[1].split('// </' + 'logic>')[0]; } catch (e) { return ''; } })();

// 端末どうしを直接つなぐ通信(PeerJS)。ログインなしで、リンクを開いただけの人どうしで使える。
// 合言葉から部屋のIDを作り、先に入った側が部屋を開き、あとから入った側がそこへ接続する。
// 中継サーバーは接続の仲立ちだけをし、対戦の内容は端末どうしで直接やりとりする。
// 観戦:先に部屋を開いた側(ホスト)が、観戦者(最大 SPEC_MAX 人)にも接続を許し、試合の記録を中継する。
// 観戦者に送るのは、両方のプレイヤーに明かされた後の手だけ(封をした手は送らない)
const SPEC_MAX = 5;
function makePeerRoom() {
  let peer = null, conn = null, mine = {}, foe = null, up = false, note = '';
  let specs = [], specSnap = null, onSpec = null;   // ホスト側:観戦者の接続と最新の記録 / 観戦者側:記録を受け取る関数
  const specSend = (c) => { try { if (c.open && specSnap) c.send({ spec: specSnap }); } catch (e) { /* 送れなければ次の更新で送る */ } };
  function addSpec(c) {
    if (specs.length >= SPEC_MAX) { c.on('open', () => { try { c.send({ full: 1 }); } catch (e) { /* 閉じるだけ */ } setTimeout(() => c.close(), 300); }); return; }
    specs.push(c);
    c.on('open', () => { specSend(c); fire(); });
    c.on('close', () => { specs = specs.filter((x) => x !== c); fire(); });
    c.on('error', () => { specs = specs.filter((x) => x !== c); fire(); });
  }
  const handlers = [];
  const fire = () => handlers.forEach((h) => { try { h(); } catch (e) { /* 表示の更新に失敗しても通信は続ける */ } });
  const send = () => { if (conn && conn.open) conn.send({ p: mine }); };
  function attach(c) {
    conn = c;
    c.on('open', () => { up = true; note = '相手とつながりました'; send(); fire(); });
    c.on('data', (d) => { if (d && typeof d === 'object' && d.p && typeof d.p === 'object') { foe = d.p; fire(); } });
    c.on('close', () => { if (conn === c) { conn = null; foe = null; up = false; note = '相手との接続が切れました'; fire(); } });
    c.on('error', () => { note = '相手との通信でエラーが起きました'; fire(); });

  function spectate(code, handler) {
    leave();

    note = '観戦の準備をしています…';
    const me = peer = new window.Peer();
    me.on('open', () => {
      const c = me.connect(hostId, { reliable: true, serialization: 'json', metadata: { spec: 1 } });
      c.on('open', () => { up = true; note = 'つながりました。対戦の開始を待っています'; fire(); });
      c.on('data', (d) => {
        if (!d || typeof d !== 'object') return;
        if (d.full) { note = `観戦できるのは${SPEC_MAX}人までです。いっぱいでした`; fire(); return; }
        if (d.spec && typeof d.spec === 'object' && onSpec) onSpec(d.spec);
      });
      c.on('close', () => { up = false; note = '中継が切れました(部屋を開いた人が抜けました)'; fire(); });
      fire();
    });
    me.on('error', (e) => { if (peer !== me) return; note = e.type === 'peer-unavailable' ? 'その合言葉の部屋はありません' : `接続できませんでした(${e.type})`; fire(); });
    fire();
  }
  function join(code) {
    leave();
    const hostId = 'kokusen-room-' + code.toLowerCase();
    note = '接続しています…';
    const host = peer = new window.Peer(hostId);
    host.on('open', () => { note = '部屋を開きました。相手を待っています'; fire(); });
    host.on('connection', (c) => {
      if (c.metadata && c.metadata.spec) { addSpec(c); return; }   // 観戦者
      if (conn && conn.open) { c.close(); return; }                // 3人目のプレイヤーは入れない
      attach(c);
    });
    host.on('error', (e) => {
      if (peer !== host) return;
      if (e.type !== 'unavailable-id') { note = `接続できませんでした(${e.type})`; fire(); return; }

      host.destroy();
      const guest = peer = new window.Peer();
      guest.on('open', () => { note = '部屋に参加しています…'; attach(guest.connect(hostId, { reliable: true, serialization: 'json' })); fire(); });
      guest.on('error', (e2) => { if (peer === guest) { note = `接続できませんでした(${e2.type})`; fire(); } });
    });
    fire();

    direct: true, join, leave, spectate,
    // ホスト側:観戦者に送る記録を更新する / 観戦者の人数
    setSpec(snap) { specSnap = snap; specs.forEach(specSend); },
    specCount: () => specs.filter((c) => c.open).length,
    status: () => note,
    presence(patch) {
      for (const k of Object.keys(patch)) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; }
      send();
      return Promise.resolve();
    },
    peers() {
      const me = { isMe: true, sameTab: true, presence: mine };
      return foe ? [me, { isMe: false, sameTab: false, presence: foe }] : [me];

    onPeers(h) { handlers.push(h); return () => {}; },
    connected: () => up,
  };
}

async function rankFind() {

      pvpStatus(isMissingFn(e) ? 'ランク戦の準備が、サーバーでまだできていません(SQLの10回目が必要です)。' : '相手を探せませんでした。通信の状態を確かめて、もう一度押してください。');

    if (!RANK.searching) { sbFetch('/rest/v1/rpc/rank_leave', { method: 'POST', body: {} }).catch(() => null); return; }

function rankStart(code) {

// 今の段階:'ban'(BANを選ぶ)→ 'pick'(交互に取る)→ 'order'(出す順番を決める)
function rankStage() {
  const D = PVP.draft;
  if (!D || !D.bans) return 'ban';
  return D.picks.length + D.foePicks.length < TEAM_SIZE * 2 ? 'pick' : 'order';
}
function rankMyTurn() {
  const D = PVP.draft, t = D.picks.length + D.foePicks.length;
  return D.first !== null && t < RANK_SEQ.length && (RANK_SEQ[t] === 'F') === D.first;
}
const rankBanned = (id) => !!PVP.draft.bans && (PVP.draft.bans.me === id || PVP.draft.bans.foe === id);
function rankPublish() {
  const D = PVP.draft, R = PVP.rank;
  pvpPublish({ d: { ds: R.ds, b: D.ban ? seal(D.banSalt + '|' + R.ds + '|' + D.ban) : null, br: D.ban && D.foeBanSeal ? { id: D.ban, s: D.banSalt } : null, p: D.picks.slice() } });

// 相手のピックが正しいか(区分け・BAN・取り合い・★4以上1枚・順番)
function rankFoePicksNg(list) {
  const D = PVP.draft;
  if (!Array.isArray(list) || list.length > TEAM_SIZE || new Set(list).size !== list.length) return true;
  for (let i = 0; i < list.length; i++) {
    const c = charById(list[i]);
    if (!c || !inFormat(c, FORMAT) || rankBanned(c.id) || D.picks.includes(c.id) || teamNg(list.slice(0, i + 1), FORMAT)) return true;

function rankDraftStep(fp) {
  const R = PVP.rank, D = PVP.draft;

  const fd = fp && fp.d && fp.d.ds === R.ds ? fp.d : null;
  const done = () => { renderSelect(); };
  if (!fp || !fd) { pvpStatus(fp ? '相手が前の試合の画面にいます。相手を待っています…' : '相手を待っています…'); return done(); }
  if (D.first === null && fp.acc && ACC.profile) D.first = (String(ACC.profile.id) < String(fp.acc.id)) !== (R.g % 2 === 1);

    if (fd.b && !D.foeBanSeal) { D.foeBanSeal = fd.b; if (D.ban) rankPublish(); }

    if (!br || typeof br.id !== 'string') { pvpStatus('相手のBANを待っています…'); return done(); }
    const c = charById(br.id);
    if (seal(br.s + '|' + R.ds + '|' + br.id) !== D.foeBanSeal || !c || !inFormat(c, FORMAT)) { pvpStatus('相手のBANの情報が正しくありません。部屋を出てください。'); D.err = 'ng'; return done(); }

// キャラのボタンの状態(ランク戦のBAN・ピック中)

  if (dr === 'ban') return { off: !!D.ban, tag: D.ban === ch.id ? 'BAN' : '' };
  if (rankBanned(ch.id)) return { off: true, tag: 'BAN' };
  if (D.foePicks.includes(ch.id)) return { off: true, tag: '相手', foe: true };
  if (D.picks.includes(ch.id)) return { off: false, tag: '' };
  const ng = !charUnlocked(ch) || !rankMyTurn() || D.picks.length >= TEAM_SIZE || !!teamNg(D.picks.concat(ch.id), FORMAT);

}
async function rankTap(ch, dt) {

  if (dr === 'ban') {

// キャラ選択の上の、ランク戦の案内

// 1試合が終わったときの3本勝負の記録。引き分けは同じ試合をやり直す。リタイア・応答なしは3本勝負ごと負け

// 対戦中、今のラリーが誰の番か。'pick'=お互いに手を選ぶ、'mine'=自分のBREAK、'foe'=相手のBREAK

// 手のボタンを押せない状態か

// 状況が変わるたびに呼ばれる。条件がそろっていれば次へ進める(何度呼ばれてもよい)

// 相手の応答を待っている時間を数え、60秒続いたら不戦勝にする。
// 待つのは、こちらが手を選び終わったのに相手が出さないとき・相手のBREAKの番・相手との接続が切れているとき
const PVP_TIMEOUT = 60;
function pvpWatch() {
  const playing = PVP.on && PVP.phase === 'play' && S && !S.over && !PVP.applying;
  const turn = playing ? pvpTurn() : '';
  const waiting = playing && (!pvpFoe() || turn === 'foe' || (turn === 'pick' && PVP.hand !== null) || (turn === 'mine' && PVP.hand !== null));
  if (!waiting) { PVP.waitSince = 0; return; }
  if (!PVP.waitSince) PVP.waitSince = Date.now();
  const left = PVP_TIMEOUT - Math.floor((Date.now() - PVP.waitSince) / 1000);
  if (left <= 0) { PVP.waitSince = 0; pvpForfeit(0); return; }
  if (left <= PVP_TIMEOUT - 15) setResult(`相手の応答がありません。あと${left}秒で不戦勝になります`);
}
// 不戦勝・不戦敗で試合を終える。side:勝った側(0=自分、1=相手)
// リタイア:確認してから負けにする。オンライン対人では相手に知らせ、相手の勝ちになる
function askResign() {

  if (!S || S.over) return;
  const canRetry = MODE !== 'pvp' && LAST_MATCH;   // 再挑戦はCPU戦とソロだけ(対人は相手がいるため)
  openSheet('リタイア', `<p>${canRetry ? '同じチーム・同じ相手で最初からやり直すか、リタイアして負けにするかを選んでください。' : `この対戦をリタイアしますか? あなたの負けになります。${MODE === 'pvp' && PVP.rank ? 'ランク戦なので、この3本勝負の負けになります。' : MODE === 'pvp' && PVP.foeAcc && PVP.rated ? 'ランク戦なので、負けとして記録されます。' : ''}`}</p>
    ${canRetry ? '<div class="row"><button id="rsRetry" style="border-color:var(--gold);color:var(--gold);font-weight:700">再挑戦</button></div>' : ''}
    <div class="row"><button id="rsYes" style="border-color:#ff4d5e;color:#ff8a95;font-weight:700">リタイアする</button></div>`);
  $('rsYes').onclick = () => { $('sheet').classList.add('hidden'); endByResign('me'); };

}
// 再挑戦:今の対戦をやめて、同じチーム・同じ相手・同じ設定で最初から始める(記録には残さない)
function retryMatch() {
  if (!LAST_MATCH) return;
  if (S) S.over = true;
  clearTimeout(tickTimer); freeze(false);
  const { mine, theirs, foeLabel, opt } = LAST_MATCH;
  // ソロは敵を作り直す(★★★★★の巻き戻しなどの状態を持ち越さない)
  if (opt.stage && opt.stage.chainFrom) { const from = STAGES.find((x) => x.id === opt.stage.chainFrom); return startSolo(mine, from); }
  const foes = opt.stage ? stageFoes(opt.stage) : theirs;
  startMatch(mine, foes, foeLabel, opt);
}
async function endByResign(who) {
  if (!S || S.over) return;
