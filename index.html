<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>刻戦</title>
<!-- ホーム画面・タブのアイコン(カジ【始】の絵) -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/app/favicon-32.png">
<link rel="apple-touch-icon" href="icons/app/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090b16">
<meta name="apple-mobile-web-app-title" content="刻戦">
<style>
  :root {
    --bg: #090b16; --panel: #141830; --text: #eef0ff; --sub: #9aa0c3;
    --line: #2b3157; --accent: #f5c451; --hp: #4ade80; --hp-low: #ff4d5e;
    --gold: #f5c451; --violet: #8b6cff; --red: #ff4d5e; --spd: 1; --tick: 8s;
  }
  * { box-sizing: border-box; }
  html, body, button { touch-action: manipulation; }
  input { font-size: 16px !important; }
  body {
    margin: 0; padding: 16px; color: var(--text);
    background: radial-gradient(1200px 600px at 50% -10%, #1c2250 0%, var(--bg) 60%) fixed var(--bg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5; overflow-x: hidden;
  }
  main { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  body.in-battle #optBgm, body.in-battle #optSound { display: none; }   /* 曲と音の切り替えは、対戦画面では出さない(設定から変えられる) */
  h1 {
    font-size: 1.6rem; margin: 0; letter-spacing: .2em; font-weight: 900;
    background: linear-gradient(180deg, #fff3c4, var(--gold) 55%, #b9791a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h2 { font-size: 1rem; margin: 0 0 8px; }
  .clock {
    width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--gold);
    position: relative; flex: none; box-shadow: 0 0 10px #f5c45166;
  }
  .clock i {
    position: absolute; left: 50%; bottom: 50%; width: 2px; height: 11px; margin-left: -1px;
    background: var(--gold); transform-origin: 50% 100%;
    animation: spin var(--tick) linear infinite;
  }
  body.frozen .clock i { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .opts { margin-left: auto; display: flex; gap: 6px; }
  .opts button { padding: 4px 10px; font-size: .78rem; border-radius: 16px; }
  .opts button.off { opacity: .5; }
  .panel {
    background: linear-gradient(180deg, #181d3a, var(--panel)); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; margin-bottom: 12px; position: relative;
  }
  button {
    font: inherit; color: var(--text); background: #1b2042;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
  .stages { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 4px; }
  .stages button { grid-column: span 2; }
  .stages button { padding: 6px 4px; font-size: .74rem; line-height: 1.3; }
  .stages button b { display: block; color: var(--gold); letter-spacing: .1em; }
  .stages button.s1 b { color: #38bdf8; }
  .stages button.s2 b { color: #4ade80; }
  .stages button.s4, .stages button.s5 { grid-column: span 3; }
  .stages button.s0 { grid-column: 1 / -1; }
  .corr-list { grid-template-columns: repeat(4, 1fr); }
  .corr-list button.corr { grid-column: span 1; }
  .corr-list .corr-h { grid-column: 1 / -1; margin: 6px 0 0; font-size: .78rem; color: var(--gold); }
  .stages.hidden { display: none; }
  .stages button.locked { opacity: .45; }
  .stages button.chain { opacity: .6; border-style: dashed; }
  .stages button.s0 b { color: var(--gold); }
  .stages button.s5 b { color: #ff2a3d; text-shadow: 0 0 10px #ff2a3d99; }
  .stages button.s4 b { color: #b57bff; text-shadow: 0 0 10px #b57bff99; }
  /* 選んだときに枠を太くすると中の文字の折り返しが変わるので、太さは変えずに内側の線と光で示す */
  .stages button.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px #f5c45144; }
  .stages button.cleared::after { content: ' ✓'; color: #4ade80; font-weight: 700; }
  .col .trait.multi { font-size: .56rem; line-height: 1.25; height: 4.6em; }
  .roomrow { display: flex; gap: 8px; margin-bottom: 4px; }
  .roomrow button { padding: 10px 8px; white-space: nowrap; }
  #specBadge { flex: none; align-self: center; font-size: .72rem; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .roomrow input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: #0b0d1c; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  #netStatus { color: var(--gold); }
  .levels button.picked { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 12px #f5c45144; font-weight: 700; }
  .chars { display: grid; gap: 8px; }
  /* キャラ選択は2段階:相手を決める(menu)→ キャラを選ぶ(pick) */
  #select[data-step="menu"] .selR, #select[data-step="pick"] .selL { display: none !important; }
  .btn-next { width: 100%; margin-top: 12px; padding: 14px; font-weight: 700; color: var(--gold); border-color: var(--gold); }
  .picktop { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .picktop .back { margin: 0; flex: none; }
  .picktop #pickInfo { flex: 1; min-width: 0; font-size: .8rem; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picktop #mysetBtn { flex: none; padding: 8px 10px; font-size: .8rem; color: var(--gold); }
  #pickNet:empty { display: none; }
  h2 .hint { font-size: .68rem; color: var(--sub); font-weight: 400; margin-left: 6px; }
  #start { position: sticky; bottom: 8px; z-index: 2; box-shadow: 0 6px 20px #000a; }
  /* キャラはアイコンだけを並べる。タップで選ぶ・長押しで詳細 */
  .cgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cgrid > p { grid-column: 1 / -1; margin: 0; }
  .ctile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px 4px; font-size: .68rem; line-height: 1.2;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .ctile .cico { width: 100%; max-width: 64px; height: auto; aspect-ratio: 1; pointer-events: none; }
  .ctile .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
  .ctile.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent), 0 0 12px #f5c45144; }
  .ctile .ord { position: absolute; top: 2px; left: 4px; font-style: normal; font-weight: 700; color: var(--gold); font-size: .72rem; }
  .ctile.off { opacity: .4; }
  .ctile.locked .cico { filter: grayscale(1) brightness(.6); }
  .ctile .lk { position: absolute; top: 2px; right: 4px; font-size: .7rem; }
  .ctile .dtag { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: .6rem; font-weight: 700; padding: 0 5px; border-radius: 4px; background: #b3001b; color: #fff; white-space: nowrap; }
  .ctile .dtag.foe { background: #3a4a8a; }
  .draftbox { border: 1px solid var(--gold); border-radius: 10px; padding: 8px 10px; margin: 0 0 8px; font-size: .8rem; line-height: 1.6; }
  .draftbox .dturn { font-weight: 700; color: var(--gold); }
  .draftbox .cico { vertical-align: middle; }
  .ctile .rar { font-size: .55rem; letter-spacing: -.05em; line-height: 1; pointer-events: none; }
  .rar.r1, .rar.r2 { color: #9aa0b4; } .rar.r3 { color: #f5c451; } .rar.r4 { color: #b57bff; } .rar.r5 { color: #ff2a3d; }
  #pickSide button.picked[data-s="foe"] { border-color: #ff8a95; color: #ff8a95; box-shadow: 0 0 12px #ff4d5e44; }
  .cdetail .crow { margin-bottom: 8px; }
  /* 文字を長押ししても、選択やコピーのメニューを出さない(入力欄だけは使えるように) */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  .ms { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; }
  .ms .ic { display: flex; gap: 2px; }
  .ms .ic .cico { width: 34px; height: 34px; }
  .ms .ic .empty { width: 106px; height: 34px; border: 1px dashed var(--line); border-radius: 8px; }
  .ms .nm { font-size: .85rem; font-weight: 700; }
  .ms .nm small { display: block; font-weight: 400; color: var(--sub); font-size: .7rem; }
  .ms .bt { grid-column: 1 / -1; display: grid; grid-template-columns: 2fr 2fr 1fr 1fr; gap: 6px; }
  .ms .bt button { padding: 7px 4px; font-size: .78rem; }
  .ms .bt .go { color: var(--gold); border-color: var(--gold); font-weight: 700; }
  .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
  .picks button { padding: 6px 4px; font-size: .78rem; line-height: 1.3; min-height: 3.2em; }
  .picks button b { display: block; color: var(--gold); font-size: .68rem; }
  .picks button.empty { border-style: dashed; color: var(--sub); }
  .picks .cico.ph { visibility: hidden; }
  #bonusNote { min-height: 3em; }   /* ボーナスの説明が1行・2行で変わっても、下がずれないように */
  .role { font-size: .74rem; font-weight: 400; color: #7dd3fc; margin-left: 6px; }
  #factions { grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #factions button { padding-left: 4px; padding-right: 4px; white-space: nowrap; }
  #factions button[data-f="隔絶"] { color: #ff2a3d; font-weight: 700; }
  #factions button .n { font-size: .7rem; color: var(--gold); margin-left: 4px; }
  .chars button { text-align: left; }
  /* キャラアイコン。枠の色は陣営(錨=金、零=蒼紫、矢=朱、無所属=灰) */
  .cico { display: inline-flex; align-items: center; justify-content: center; flex: none; object-fit: cover;
    border-radius: 8px; border: 2px solid var(--line); background: #12152b; color: var(--sub); font-weight: 900; vertical-align: middle; }
  .cico.f-anchor { border-color: #d9a53a; } .cico.f-zero { border-color: #8b6cff; } .cico.f-arrow { border-color: #e2553f; } .cico.f-none { border-color: #8a8a96; }
  .cico.secret { filter: grayscale(1) brightness(.22) blur(1.5px); }
  .cico.lg { width: 60px; height: 60px; font-size: 1.5rem; }
  .cico.md { width: 40px; height: 40px; font-size: 1.1rem; border-radius: 7px; }
  .cico.sm { width: 26px; height: 26px; font-size: .7rem; border-width: 1px; border-radius: 5px; margin-right: 4px; }
  .crow { display: flex; gap: 10px; align-items: flex-start; }
  .crow > div { min-width: 0; flex: 1; }
  .picks button .cico { display: flex; margin: 2px auto; }
  .stages button .foes { display: flex; justify-content: center; gap: 3px; margin: 3px 0; }
  .stages button .foes .cico { margin: 0; }
  .name { font-weight: 700; }
  .sub { color: var(--sub); font-size: .85rem; }
  .fighters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; transition: filter calc(.3s * var(--spd)); }
  #you { border-color: #6b5a2a; }
  #cpu { border-color: #453a86; }
  .bar { height: 12px; background: #0b0d1c; border-radius: 6px; overflow: hidden; margin: 4px 0; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #22c55e, var(--hp)); transition: width .7s ease-out; }
  .bar > div.low { background: linear-gradient(90deg, #b91c1c, var(--hp-low)); }
  .hp { font-size: .85rem; color: var(--sub); font-variant-numeric: tabular-nums; }
  .hp b { font-size: 1.25rem; color: var(--text); }
  .stats { font-size: .78rem; color: var(--gold); font-variant-numeric: tabular-nums; }
  .stats .up, .stats .down { font-weight: 900; }
  /* 能力値の色:HP=緑、ATK=赤、DFS=オレンジ */
  .s-hp, .s-hp b { color: var(--hp); } .s-atk { color: #ff6b78; } .s-dfs { color: #ffa94d; }
  .gauge.atk .mini i { background: #ff6b78; } .gauge.dfs .mini i { background: #ffa94d; }
  ul.actions li.hot { color: var(--red); font-weight: 700; text-shadow: 0 0 8px #ff4d5e66; }
  .trait { font-size: .78rem; color: #c9b8ff; margin: 2px 0; }
  .boutinfo { grid-column: 1 / -1; text-align: center; font-size: .8rem; color: var(--sub); }
  .boutinfo.warn { color: var(--red); font-weight: 900; }
  .boutinfo.hint { font-weight: 900; letter-spacing: .05em; background: linear-gradient(90deg, #ff4d5e, #f5c451, #4ade80, #38bdf8, #8b6cff); -webkit-background-clip: text; background-clip: text; color: transparent; animation: hintPulse 1.6s ease-in-out infinite; }
  #battle .boutinfo.hint { font-size: .85rem; }
  @keyframes hintPulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .boutinfo.hint { animation: none; } }
  /* あとひと刻:ガラスの破片が下から上へ立ちのぼるオーラ(画面の左右の端) */
  #aura { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity .6s; }
  #aura.on { opacity: 1; }
  /* 金色のオーラ:画面の縁が脈打つように光り、下から金色の光が立ちのぼる(真ん中は暗いまま、文字の邪魔をしない) */
  #aura::before { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 45vh; background: radial-gradient(60% 100% at 50% 100%, #f5c45140, transparent 70%); animation: auraGlow 1.4s ease-in-out infinite alternate; }
  #aura::after { content: ''; position: absolute; inset: 0; box-shadow: inset 14px 0 26px -10px #f5c451aa, inset -14px 0 26px -10px #f5c451aa, inset 0 -30px 50px -24px #ff9d2ecc; animation: auraEdge 1.1s ease-in-out infinite alternate; }
  #aura.surge::after { animation: auraSurge .7s ease-out; }
  #aura .flame { position: absolute; bottom: -10vh; width: 10vw; max-width: 60px; height: 70vh; background: linear-gradient(to top, #ff9d2e88, #f5c45155 40%, transparent); filter: blur(10px); animation: auraFlame 2.6s ease-in-out infinite; transform-origin: bottom; }
  #aura .flame.l { left: -4vw; } #aura .flame.r { right: -4vw; animation-delay: -1.3s; }
  #aura i { position: absolute; top: 100%; display: block; background: linear-gradient(160deg, #fff6d0, #f5c451 45%, #ff9d2e); box-shadow: 0 0 10px #f5c451, 0 0 18px #ff9d2e88; animation: auraRise linear forwards; will-change: transform, opacity; }
  #aura i.spark { border-radius: 50%; background: #fff6d0; box-shadow: 0 0 6px #ffe9a8, 0 0 12px #f5c451; }
  /* 赤い版(★5ツル戦は、初めから禍々しい深い赤のオーラが流れる。あとひと刻で金色に変わる) */
  #aura.red::before { height: 55vh; background: radial-gradient(70% 100% at 50% 100%, #6e000eaa, #2a000566 45%, transparent 75%); animation-duration: 2.4s; }
  #aura.red::after { box-shadow: inset 22px 0 40px -12px #7a0012cc, inset -22px 0 40px -12px #7a0012cc, inset 0 -40px 70px -24px #4a0008ee; animation-duration: 1.8s; }
  #aura.red.surge::after { animation: auraSurgeRed .9s ease-out; }
  #aura.red .flame { background: linear-gradient(to top, #5c000dcc, #8b001466 40%, transparent); filter: blur(14px); }
  #aura.red i { background: linear-gradient(160deg, #c2182b, #7a0012 50%, #2a0005); box-shadow: 0 0 8px #8b0014cc, 0 0 16px #3a000899; }
  #aura.red i.spark { background: #ff3b4e; box-shadow: 0 0 6px #b3001b, 0 0 12px #5c000d; }
  @keyframes auraSurgeRed { 0% { opacity: 1; box-shadow: inset 36px 0 50px -12px #a3001a, inset -36px 0 50px -12px #a3001a, inset 0 -60px 80px -24px #6e000e; } 100% { opacity: .7; } }
  @keyframes auraEdge { from { opacity: .55; } to { opacity: 1; } }
  @keyframes auraSurge { 0% { opacity: 1; box-shadow: inset 30px 0 40px -12px #ffe9a8, inset -30px 0 40px -12px #ffe9a8, inset 0 -50px 70px -24px #ff9d2e; } 100% { opacity: .7; } }
  @keyframes auraFlame { 0%, 100% { transform: scaleY(.85) scaleX(1); opacity: .7; } 50% { transform: scaleY(1.1) scaleX(1.2); opacity: 1; } }
  /* 下の真ん中寄りから、弧をえがいて画面の端へ寄りながら上がっていく(横のずれ --sx が (1-t)² で 0 に近づく)。上に行くほど細くなる */
  @keyframes auraRise {
    0% { transform: translate(var(--sx), 0) rotate(0deg) scale(1, 1); opacity: 0; }
    12% { opacity: .55; }
    20% { transform: translate(calc(var(--sx) * .64), -24vh) rotate(calc(var(--rot) * .2)) scale(.85, .95); }
    40% { transform: translate(calc(var(--sx) * .36), -48vh) rotate(calc(var(--rot) * .4)) scale(.68, .9); }
    60% { transform: translate(calc(var(--sx) * .16), -71vh) rotate(calc(var(--rot) * .6)) scale(.5, .85); opacity: .5; }
    80% { transform: translate(calc(var(--sx) * .04), -95vh) rotate(calc(var(--rot) * .8)) scale(.34, .8); }
    100% { transform: translate(var(--dx), -118vh) rotate(var(--rot)) scale(.2, .75); opacity: 0; }
  }
  @keyframes auraGlow { from { opacity: .5; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #aura { display: none; } }
  .status { min-height: 1.3em; font-size: .85rem; color: var(--accent); }
  ul.actions { list-style: none; padding: 0; margin: 6px 0 0; font-size: .82rem; }
  ul.actions li { padding: 2px 0; border-top: 1px dashed var(--line); }
  .hands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .hands button { font-size: 1.8rem; padding: 12px 4px; transition: transform .08s; }
  .hands button:active:not(:disabled) { transform: scale(.94); }
  .result { text-align: center; font-weight: 700; min-height: 1.5em; margin: 8px 0; }
  #log { max-height: 220px; overflow-y: auto; font-size: .85rem; color: var(--sub); }
  #log div { padding: 3px 0; border-bottom: 1px solid var(--line); }
  .chars button.picked { border-color: var(--accent); border-width: 2px; box-shadow: 0 0 12px #f5c45144; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
  .chip { font-size: .72rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 8px; color: var(--sub); }
  .chip.on { border-color: var(--accent); color: var(--text); font-weight: 700; }
  .chip.ko { text-decoration: line-through; opacity: .5; }
  .streak { white-space: nowrap; }
  .streak.reach { color: var(--red); font-weight: 900; animation: pulse calc(.5s * var(--spd)) ease-in-out infinite alternate; }
  .score { color: var(--text); font-weight: 700; }
  .break { font-weight: 900; }
  .hidden { display: none; }

  /* 対戦画面:スクロールなしで全部見えるように詰める */
  body.in-battle { padding: 6px 8px; }
  body.in-battle header { margin-bottom: 5px; }
  body.in-battle h1 { font-size: 1.05rem; }
  body.in-battle .clock { width: 20px; height: 20px; }
  body.in-battle .clock i { height: 7px; }
  body.in-battle .opts button { padding: 2px 8px; font-size: .68rem; }
  #battle { font-size: .74rem; line-height: 1.3; }
  #battle > * { margin-bottom: 5px; }
  .teams, .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; transition: filter calc(.3s * var(--spd)); }
  .team { border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; background: var(--panel); min-width: 0; }
  #you { border-color: #6b5a2a; } #cpu { border-color: #453a86; }
  .team .head { display: flex; justify-content: space-between; gap: 4px; color: var(--sub); white-space: nowrap; }
  .team .chips { margin: 2px 0 0; gap: 2px; }
  .team .chip { font-size: .6rem; padding: 0 3px; border-radius: 6px; }
  #battle .stage { padding: 6px 8px; gap: 3px 8px; }
  #battle .slot { font-size: 1.9rem; height: 46px; line-height: 46px; }
  #battle .boutinfo { font-size: .7rem; }
  #battle .shp { font-size: .7rem; }
  #battle .shp b { font-size: 1.1rem; }
  #battle .shp .bar { height: 8px; margin: 2px 0; }
  #battle .shp .stats { font-size: .7rem; }
  .gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .gauge { min-width: 0; }
  .mini { position: relative; height: 5px; background: #0b0d1c; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--gold); transition: width .35s; }
  .mini u { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; opacity: .7; }
  #battle .shp .status { font-size: .6rem; height: 4.7em; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 3px; position: relative; cursor: pointer; }
  #battle .shp .status .sc { padding: 0 4px; border-radius: 4px; line-height: 1.45; white-space: nowrap; border: 1px solid; }
  #battle .shp .status .sc.up { color: #7dd3fc; border-color: #7dd3fc55; background: #7dd3fc14; }
  #battle .shp .status .sc.down { color: #f0a0f5; border-color: #e879f955; background: #e879f914; }
  #battle .shp .status .sc.info { color: var(--gold); border-color: #f5c45155; background: #f5c45114; }
  #battle .shp .status.more::after { content: '…すべて'; position: absolute; right: 0; bottom: 0; padding: 0 4px 0 10px; font-size: .58rem; color: var(--gold);
    background: linear-gradient(90deg, transparent, #0b0d1c 30%); }
  .stl { margin: 4px 0 0; padding-left: 1.2em; font-size: .85rem; line-height: 1.7; }
  .stl .up { color: #7dd3fc; } .stl .down { color: #f0a0f5; } .stl .info { color: var(--gold); }
  #battle .cue { height: 1.4em; overflow: hidden; white-space: nowrap; font-size: .92rem; }
  #battle .dmgline { height: 3.7em; overflow: hidden; font-size: .82rem; }
  #battle .dmgline .minor { font-size: .7rem; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #battle .dmgline .minor b { font-size: .95rem; margin: 0 1px; }
  #battle .dmgline .minor .heal b { color: #6ee7a0; } #battle .dmgline .minor .tick b { color: #ff9aa5; }
  #battle .dmgline b { font-size: 1.6rem; }
  #battle .dmgline .heal b, #battle .dmgline .tick b { font-size: 1.05rem; }
  #battle .dmgline .tick { font-size: .7rem; }
  #battle .result { margin: 0 0 5px; min-height: 1.3em; font-size: .8rem; }
  .col { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .col .trait { font-size: .7rem; margin: 0; height: 2.7em; overflow: hidden; line-height: 1.3; cursor: pointer; }
  .col .trait b { color: #e2d6ff; font-weight: 700; }
  .col .trait .ti { color: var(--gold); white-space: nowrap; }
  #battle .hands { display: flex; flex-direction: column; gap: 4px; }
  #battle .hands button, .act {
    display: flex; align-items: center; gap: 6px; text-align: left; width: 100%;
    padding: 4px 6px; border-radius: 8px; font-size: .68rem; line-height: 1.3; height: 3.7rem; overflow: hidden;
  }
  .act { border: 1px dashed var(--line); background: #0f1228; color: var(--sub); }
  /* 手のボタンと相手の技は、あとひと刻のガラスの破片(#aura、z-index 5)よりも手前に出す(破片はボタンの後ろを通る) */
  /* ガラスの破片は、真ん中の大きな戦いの欄(.stage)だけ手前を通り、ほかの画面の部品(上の見出し・チーム・結果の文字・特性・技・下のボタン)の後ろを通る */
  body.in-battle header, #battle > *:not(.stage), #battle .hands button, #battle .act { position: relative; z-index: 6; }
  .ico { font-size: 1.5rem; flex: none; }
  .txt { min-width: 0; color: var(--sub); }
  .txt b { display: block; color: var(--text); font-size: .72rem; }
  .hot .txt, .hot .txt b { color: var(--red); font-weight: 700; }
  #battle .hands button.hot { border-color: var(--red); box-shadow: 0 0 10px #ff4d5e66; }
  .warm .txt, .warm .txt b { color: #ffa94d; font-weight: 700; }
  #battle .hands button.warm { border-color: #ffa94d; box-shadow: 0 0 8px #ffa94d55; }
  .credit { font-size: .62rem; color: var(--sub); text-align: center; margin: 0; }
  .credit a { color: var(--sub); }
  .foot { display: flex; gap: 6px; }
  .foot button { flex: 1; padding: 5px; font-size: .72rem; }
  #logPanel { padding: 8px; }
  #handStats { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; font-size: .8rem; }
  #handStats:empty { display: none; }
  #handStats table { width: 100%; border-collapse: collapse; }
  #handStats th, #handStats td { padding: 3px 4px; text-align: center; }
  #handStats th:first-child, #handStats td:first-child { text-align: left; max-width: 7em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #handStats td small { color: var(--sub); font-size: .68rem; }
  #handStats .hs-cap { color: var(--sub); font-size: .7rem; margin-top: 4px; }
  #log { max-height: 40vh; }

  /* 虹色の文字(BREAK・確定) */
  .rainbow, .break {
    background: linear-gradient(90deg, #ff4d5e, #f5c451, #4ade80, #38bdf8, #8b6cff, #ff4d5e);
    background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: hue 1.2s linear infinite;
  }
  @keyframes hue { to { background-position: 200% 0; } }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }

  /* 勝負の舞台(手の表示とリール) */
  .stage {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    border: 2px solid var(--line); border-radius: 12px; padding: 10px; background: #0b0d1c;
    transition: border-color .15s, box-shadow .15s;
  }
  .slot {
    font-size: 2.6rem; text-align: center; height: 72px; line-height: 72px;
    border-radius: 10px; background: #12152b; border: 1px solid var(--line);
  }
  .stage.spinning #slotCpu { animation: reel .16s linear infinite; }
  @keyframes reel { 0% { transform: translateY(-6px); opacity: .6; } 50% { transform: translateY(6px); opacity: 1; } 100% { transform: translateY(-6px); opacity: .6; } }
  .shp { min-width: 0; font-size: .78rem; color: var(--sub); text-align: center; }
  .shp .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); font-weight: 700; }
  .shp .turn { font-weight: 400; color: var(--sub); font-size: .62rem; margin-left: 4px; }
  .shp b { font-size: 1.15rem; color: var(--text); font-variant-numeric: tabular-nums; }
  .shp .bar { height: 10px; margin: 3px 0 0; }
  .vs { font-weight: 900; color: var(--sub); letter-spacing: .1em; }
  .cue { grid-column: 1 / -1; text-align: center; min-height: 1.6em; font-weight: 900; font-size: 1.05rem; }
  .dmgline { grid-column: 1 / -1; text-align: center; min-height: 2.9em; font-weight: 900; font-size: 1rem; line-height: 1.3; }
  .dmgline b { font-size: 2.1rem; font-variant-numeric: tabular-nums; margin: 0 .1em; }
  /* ダメージの文字色:通常は白、3000から赤、5000から金、一撃で最大HPの半分以上なら虹 */
  .t-white { color: #ffffff; }
  .t-red { color: #ff3b4e; text-shadow: 0 0 14px #ff3b4ecc; }
  .t-gold { color: #ffd24a; text-shadow: 0 0 16px #ffb300cc; }
  .dmgline b.rainbow { text-shadow: none; filter: drop-shadow(0 0 8px #fff8); }
  .dmgline .tick b { color: #ff9aa5; }
  .dmgline .heal b { color: #6ee7a0; }
  .dmgline .heal b, .dmgline .tick b { font-size: 1.4rem; }
  .dmgline .tick { font-size: .88rem; color: var(--sub); }
  .dmgline div { animation: dmgIn calc(.25s * var(--spd)) cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes dmgIn { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .stage.heat1 { border-color: #38bdf8; box-shadow: 0 0 14px #38bdf877; }
  .stage.heat2 { border-color: #4ade80; box-shadow: 0 0 18px #4ade8088; }
  .stage.heat3 { border-color: var(--red); box-shadow: 0 0 26px #ff4d5ecc; animation: pulse calc(.35s * var(--spd)) ease-in-out infinite alternate; }
  .stage.heat3 .cue { color: var(--red); font-size: 1.3rem; }
  .stage.heat4 { border-color: #fff; box-shadow: 0 0 34px #fff, 0 0 60px #8b6cff; background: linear-gradient(90deg, #3a0d16, #3a300d, #0d3a1c, #0d2a3a, #1c0d3a); background-size: 300% 100%; animation: hue 1s linear infinite; }
  .stage.heat4 .cue { font-size: 1.5rem; }
  .stage.win { border-color: var(--gold); box-shadow: 0 0 24px #f5c451aa; }
  .stage.win .cue { color: var(--gold); }
  .stage.lose { border-color: var(--violet); box-shadow: 0 0 24px #8b6cffaa; }
  .stage.lose .cue { color: #c9b8ff; }
  .hands.breaking button { border-color: #fff; border-width: 2px; box-shadow: 0 0 18px #fff8, 0 0 30px #8b6cff88; animation: pulse .5s ease-in-out infinite alternate; }

  /* 静止(BREAK中):色が抜ける */
  body.frozen .teams, body.frozen .cols { filter: grayscale(1) brightness(.55); }

  /* 揺れ */
  .shake { animation: shake calc(.3s * var(--spd)) linear; }
  .shake-big { animation: shakeBig calc(.5s * var(--spd)) linear; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(3px, -1px); } }
  @keyframes shakeBig { 0%,100% { transform: none; } 10% { transform: translate(-12px, 5px) rotate(-.6deg); } 25% { transform: translate(11px, -6px) rotate(.6deg); } 40% { transform: translate(-9px, 4px); } 55% { transform: translate(8px, -3px); } 70% { transform: translate(-5px, 2px); } 85% { transform: translate(3px, -1px); } }

  /* 画面全体にかぶせる演出の層 */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 70;   /* 開いている画面(メールボックスなど)より手前に演出を出す */ overflow: hidden; }
  #particles { position: absolute; inset: 0; width: 100%; height: 100%; }
  #flash { position: absolute; inset: 0; opacity: 0; }
  /* BREAK:画面のガラスにひびが入って割れる */
  #crack { position: absolute; inset: 0; width: 100%; height: 100%; display: none; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #9fd8ff); }
  #crack.on { display: block; }
  #crack polyline { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linejoin: bevel; }
  #crack.violet { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 8px #a78bff); }
  /* プチュン:倒す瞬間に画面が一瞬で真っ暗になる */
  /* 暗転は、浮かんでいるダメージの数字などよりも手前に出す */
  #blackout { position: absolute; inset: 0; background: #000; display: none; z-index: 3; }
  #cutin { z-index: 6; }
  #blackout.on { display: block; }
  #blackout.on::after {
    content: ''; position: absolute; left: 0; right: 0; top: var(--line-y, 50%); height: 2px; margin: -1px auto 0;
    background: #fff; box-shadow: 0 0 12px #fff; animation: crt .22s ease-in forwards;
  }
  @keyframes crt { from { width: 100%; opacity: 1; } to { width: 0; opacity: 0; } }
  #flash.on { animation: flash calc(.45s * var(--spd)) ease-out; }
  @keyframes flash { from { opacity: .55; } to { opacity: 0; } }
  .pop {
    position: absolute; font-weight: 900; font-size: 2rem; white-space: nowrap; transform: translate(-50%, -50%);
    text-shadow: 0 2px 0 #000, 0 0 12px currentColor; animation: pop 1.7s ease-out forwards;
  }
  .pop.buff { color: #7dd3fc; font-size: 1.05rem; } .pop.debuff { color: #e879f9; font-size: 1.05rem; }
  .pop.small { font-size: 1.15rem; }
  .pop.dmg { color: #ff9aa5; } .pop.heal { color: #6ee7a0; } .pop.big { font-size: 3rem; }
  .pop.t-white { color: #ffffff; } .pop.t-red { color: #ff3b4e; } .pop.t-gold { color: #ffd24a; }
  .pop.rainbow { text-shadow: none; filter: drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px #fff); font-size: 3.2rem; animation: pop 1.7s ease-out forwards, hue 1.2s linear infinite; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.4); } 10% { opacity: 1; transform: translate(-50%, -60%) scale(1.4); } 18% { transform: translate(-50%, -60%) scale(1); } 75% { opacity: 1; transform: translate(-50%, -75%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -130%) scale(1); } }
  #cutin { position: absolute; left: 0; right: 0; top: 34%; display: none; }
  #cutin.show { display: block; }
  #cutin .band {
    padding: 14px 8px; text-align: center; transform: skewY(-4deg);
    background: linear-gradient(90deg, transparent, #000d 15%, #000d 85%, transparent);
    border-top: 3px solid var(--c, var(--gold)); border-bottom: 3px solid var(--c, var(--gold));
    animation: band calc(.25s * var(--spd)) ease-out;
  }
  #cutin .big { font-size: clamp(2.6rem, 13vw, 5rem); font-weight: 900; letter-spacing: .12em; line-height: 1.1; color: var(--c, var(--gold)); text-shadow: 0 0 24px var(--c, var(--gold)); animation: slam calc(.3s * var(--spd)) cubic-bezier(.2, 1.6, .4, 1); }
  #cutin .small { font-size: .95rem; color: #fff; letter-spacing: .08em; }
  #cutin.gold { --c: #f5c451; } #cutin.violet { --c: #a78bff; } #cutin.plain { --c: #cfd3ee; } #cutin.trait { --c: #7dd3fc; } #cutin.red { --c: #ff4d5e; } #cutin.evil { --c: #ff2a3d; }
  #cutin.evil .band { background: linear-gradient(90deg, transparent, #1a0006ee 15%, #1a0006ee 85%, transparent); }
  #cutin.rainbow .band { border-color: #fff; }
  #cutin.rainbow .big { text-shadow: none; filter: drop-shadow(0 0 14px #fff); }
  @keyframes band { from { transform: skewY(-4deg) scaleY(0); } to { transform: skewY(-4deg) scaleY(1); } }
  @keyframes slam { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .shake, .shake-big, #flash.on, .stage.heat3, .stage.heat4, .streak.reach { animation: none; }
  }
  /* アカウント */
  .acct { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: #0f1226; font-size: .85rem; }
  .acct .who { flex: 1; min-width: 0; color: var(--sub); }
  .acct .who b { color: var(--text); }
  .acct .rate { color: var(--gold); font-weight: 900; }
  .acct button { padding: 5px 12px; font-size: .8rem; border-radius: 16px; }
  .modal { position: fixed; inset: 0; z-index: 60; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal.hidden { display: none; }
  .modal .box { width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .modal label { display: block; font-size: .8rem; color: var(--sub); margin: 10px 0 4px; }
  .modal input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #0b0d1c; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .modal .row { display: flex; gap: 8px; margin-top: 12px; }
  .modal .row button { flex: 1; padding: 10px; }
  .modal #accGo { border-color: var(--accent); font-weight: 700; }
  .modal .msg { min-height: 1.5em; margin: 10px 0 0; font-size: .85rem; color: var(--gold); }
  .modal .msg.err { color: var(--red); }
  .modal ol { margin: 6px 0 0; padding-left: 1.8em; font-size: .85rem; }
  .modal ol li.me { color: var(--gold); font-weight: 700; }
  .modal ol .r { float: right; color: var(--sub); }
  .ttl { display: inline-block; margin-right: 4px; padding: 0 6px; border-radius: 6px; font-size: .72em; font-weight: 700; vertical-align: .1em;
    color: var(--tc, var(--gold)); border: 1px solid var(--tc, var(--gold)); background: color-mix(in srgb, var(--tc, var(--gold)) 15%, transparent); }
  .modal .titles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .modal .titles button.picked { border-color: var(--accent); box-shadow: 0 0 10px #f5c45155; }
  .modal .titles button { text-align: left; padding: 6px 8px; }
  .modal .titles button b { display: block; font-size: .85rem; color: var(--tc, var(--text)); }
  .modal .titles button b i { font-style: normal; font-size: .62rem; margin-right: 3px; letter-spacing: -.05em; }
  .modal .titles button .rt { color: var(--text); opacity: .8; }
  .modal .titles button small { display: block; font-size: .7rem; color: var(--sub); }
  .modal .titles button:disabled { opacity: .45; }
  .chars button.lockedChar { opacity: .6; }
  .chars button.lockedChar .sub { color: var(--gold); }
  /* タイトル画面 */
  body.on-title header { display: none; }
  body.on-title { overflow-x: hidden; }
  #title { position: relative; display: flex; flex-direction: column; }
  #title.hidden { display: none; }
  /* 背景の3人:顔がロゴに隠れないよう、ロゴより上に顔が来るように並べる(ロゴは胸元から下に重なる) */
  .tbg { position: absolute; left: 0; right: 0; top: 34px; display: flex; justify-content: center; gap: 2%; pointer-events: none; }
  .tbg img { width: min(31%, 17vh); aspect-ratio: 1; object-fit: cover; object-position: 50% 30%; opacity: .5; border-radius: 16px;
    -webkit-mask-image: linear-gradient(180deg, #000 45%, transparent 92%); mask-image: linear-gradient(180deg, #000 45%, transparent 92%); }
  .tbg img:nth-child(2) { opacity: .62; transform: translateY(-10px); }
  .ttop { display: flex; justify-content: flex-end; gap: 8px; position: relative; z-index: 2; }
  .ttop .ib { position: relative; }
  .badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff2a3d; color: #fff; font-size: .7rem; font-style: normal; font-weight: 700; line-height: 18px; text-align: center; }
  .badge.hidden { display: none; }
  .ml { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .ml.new { border-color: #ff8a95; }
  .ml h4 { margin: 0 0 2px; font-size: .92rem; } .ml h4 i { color: #ff8a95; font-style: normal; font-size: .7rem; margin-right: 4px; }
  .ml .dt { font-size: .7rem; color: var(--sub); }
  .ml p { margin: 6px 0; font-size: .82rem; white-space: pre-wrap; }
  .ml .gift { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #0b0d1c; border-radius: 10px; padding: 6px 10px; font-size: .82rem; }
  .ml .gift button { padding: 6px 12px; color: var(--gold); border-color: var(--gold); font-weight: 700; }
  .ml .gift .got { color: var(--sub); }
  .ib { width: 42px; height: 42px; border-radius: 50%; padding: 0; font-size: 18px; display: grid; place-items: center; }
  .tlogo { position: relative; z-index: 2; text-align: center; margin-top: min(84px, 11vh); }
  .tlogo img { width: min(100%, 350px, 44vh); height: auto; filter: drop-shadow(0 8px 24px #000c); animation: logoIn .9s ease-out both; }
  @keyframes logoIn { from { opacity: 0; transform: scale(.92); } }
  .tplay { position: relative; z-index: 2; margin-top: 14px; }
  .btn-play { width: 100%; padding: min(18px, 2.2vh); border-radius: 18px; border: 2px solid #ffe8a3; font-size: 1.5rem; font-weight: 900; letter-spacing: .3em; color: #1a1200;
    background: linear-gradient(180deg, #ffe8a3, var(--gold) 60%, #c98e22); box-shadow: 0 0 28px #f5c45177; animation: playGlow 2.4s ease-in-out infinite; }
  @keyframes playGlow { 50% { box-shadow: 0 0 44px #f5c451aa; } }
  .tnote { text-align: center; color: var(--sub); font-size: .75rem; margin-top: 8px; }
  .tsub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tsub button { padding: 12px; border-radius: 12px; font-size: .95rem; font-weight: 700; }
  .tsub .tgacha { grid-column: 1 / -1; color: #ffd76a; border-color: #b57bff; background: linear-gradient(90deg, #2a1846, #1b2350); }
  /* ガチャ */
  .gc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .gc-top b { font-size: 1.1rem; color: #7ee0ff; }
  .gc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .gc-btns button { padding: 14px 6px; font-weight: 700; line-height: 1.3; }
  .gc-btns button small { display: block; font-weight: 400; color: var(--sub); font-size: .72rem; }
  .askc { position: fixed; inset: 0; z-index: 80; background: #000a; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .askc-box { width: min(340px, 100%); background: var(--panel, #141833); border: 1px solid var(--gold); border-radius: 14px; padding: 18px 16px 14px; text-align: center; }
  .askc-box p { margin: 0 0 14px; line-height: 1.7; }
  .askc-box p b { color: var(--gold); }
  .askc-box p small { display: block; margin-top: 4px; color: var(--sub); font-size: .8rem; }
  .askc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .askc-btns button { padding: 12px 6px; font-weight: 700; }
  .askc-btns .yes { border-color: var(--gold); color: var(--gold); }

// ステージの敵を、倍率を掛けた能力値で作る(元のデータは書き換えない)
function stageFoes(stage) {
  // ボスラッシュ:元のステージの強さのまま並べる。read は、そのボスが読みに頼る割合
  if (stage.rush) return stage.rush.flatMap((sid) => { const sub = STAGES.find((x) => x.id === sid); return stageFoes(sub).map((f) => ({ ...f, rush: true, read: sub.read, hp: sid === 'x5' ? f.hp : Math.max(1, Math.round(f.hp * stage.rushHp / 10) * 10) })); });   // ゼノだけは通常の強さのまま
  return stage.foes.map((id) => {
    const e = ENEMIES[id];
    const r10 = (v) => (stage.hp === 1 && stage.atk === 1 ? v : Math.max(1, Math.round(v / 10) * 10));   // 倍率1なら数字そのまま(44444など)
    return { ...e, id, hp: r10(e.hp * stage.hp), atk: r10(e.atk * stage.atk) };
  });
}

// ===== ルール =====
const pct = (x) => Math.round(x * 100) + '%';
// 特性は1つ(trait)か複数(traits)
const traitsOf = (ch) => ch.traits || (ch.trait ? [ch.trait] : []);
const traitOf = (card, key) => traitsOf(card.ch).find((t) => t.key === key) || null;

// バフ・デバフ(mods)の合計。ATK も DFS も実数の足し引き
const modSum = (c, stat) => c.mods.reduce((s, m) => s + (m.stat === stat ? m.v : 0), 0);
// 現在のATK(変身・渡された強化・バフ/デバフ込み。次の攻撃だけの上乗せ atkUp は含めない)
const ATK_MIN = 1000;   // ATKはこれより小さくならない(全体のルール)
const ATK_MAX = 99999;   // ATKの上限
const baseAtk = (c) => Math.min(ATK_MAX, Math.max(ATK_MIN, c.atk + c.atkBonus + c.teamAtk + c.markAtk + (c.facAtk || 0) + (c.growAtk || 0) + modSum(c, 'atk')));
// 現在のDFS(変身・特性・渡された強化・バフ/デバフ込み。次の被弾だけの上乗せ dfsUp は含めない)
const baseDfs = (c) => {
  const v = c.dfs + c.dfsGain + c.dfsBonus + c.teamDfs + c.markDfs + (c.facDfs || 0) + modSum(c, 'dfs');
  // 特性「鋼の刻」:DFSはデバフや刻印で下がらない
  return Math.max(0, Math.min(DFS_MAX, traitOf(c, 'hardshell') ? Math.max(c.dfs, v) : v));
};
// 攻撃を受けるときのDFS。BREAK中の攻撃は DFS を 0 として扱う
// 特性「一点留め」など:相手のチームが1体だけのとき(ソロのボス戦)のDFSの上乗せ。S.giant は、相手が1体のチームの側
const giantDfs = (c) => { const t = traitOf(c, 'giantSlayer'); return t && c.giant ? t.dfs : 0; };
// 特性「背水・始」:残りHPが一定以下でDFSも上がる
const traitDfs = (c) => { const t = traitOf(c, 'backwaterAll'), w = traitOf(c, 'sway'); return (t && c.hp <= c.max * t.below ? t.add : 0) + (w ? (c.turn % 2 === 1 ? -w.minus : w.dfs) : 0); };
const dfsOf = (def, isBreak) => (isBreak ? 0 : Math.min(DFS_MAX, baseDfs(def) + def.dfsUp + giantDfs(def) + traitDfs(def)));
// 攻撃する側から見た相手のDFS(特性「貫き」はDFSを一定量無視する)
const dfsVs = (att, def, isBreak) => {
  const z = traitOf(att, 'lastPierce');   // 特性「見切り」:自分の残りHPが少ないとき、相手のDFSを0として攻撃する
  if (z && att.hp <= att.max * z.below) { trig(att, 'lastPierce'); return 0; }
  const p = traitOf(att, 'pierce');
  if (p && !isBreak) trig(traitOf(def, 'hardshell') ? def : att, traitOf(def, 'hardshell') ? 'hardshell' : 'pierce');
  return Math.max(0, dfsOf(def, isBreak) - (p && !traitOf(def, 'hardshell') ? p.v : 0));
};

// 必殺技の格上げ条件(up)を満たしているか。n はそのカードが場に出て何ラリー目か
function upActive(a, att, def, n, isBreak) {
  const u = a.up;
  if (!u) return false;
  if (u.when === 'hpBelow') return att.hp <= att.max * u.v;
  if (u.when === 'foeFaction') return def.ch.faction === u.v;
  if (u.when === 'oddTurn') return n % 2 === 1;
  if (u.when === 'rallyUntil') return n <= u.v;
  if (u.when === 'rallyFrom') return n >= u.v;
  if (u.when === 'foeStacks') return def.poison > 0 && def.poisonStacks >= u.v;
  if (u.when === 'gainMax') return att.dfsGain >= u.v;
  if (u.when === 'inBreak') return !!isBreak;
  if (u.when === 'captured') return !!att.captured;
  if (u.when === 'foeDfsAtLeast') return dfsOf(def, false) >= u.v;
  return false;
}
// 特性「全力」:場に出て数ラリーの間、ダメージのある技はすべて極大
const rateOf = (a, att, def, n, isBreak) => { const b = traitOf(att, 'burnout'); if (b && a.rate && n <= b.until) { trig(att, 'burnout'); return RATE.max; } return upActive(a, att, def, n, isBreak) ? a.up.rate : a.rate; };

// 特性によるATKの増減(実数の足し引き)
// 特性が実際に効いた記録(画面で、特性の名前のカットインを出すのに使う)。本番のラリーの間だけ記録する
let TRIG = null;
const trig = (c, key) => { if (TRIG && c) TRIG.push({ c, key }); };
function traitAtk(S, att, def, isBreak) {
  let v = 0, t;
  if ((t = traitOf(att, 'backwater')) && att.hp <= att.max * t.below) { v += t.add; trig(att, 'backwater'); }
  if ((t = traitOf(att, 'backwaterSteps')) && t.steps.some((x) => att.hp <= att.max * x)) { v += t.steps.filter((x) => att.hp <= att.max * x).length * t.add; trig(att, 'backwaterSteps'); }   // 背水・見
  if ((t = traitOf(att, 'backwaterAll')) && att.hp <= att.max * t.below) { v += t.add; trig(att, 'backwaterAll'); }                               // 背水・始
  if ((t = traitOf(att, 'oldwound')) && def.poison > 0) { v += t.add; trig(att, 'oldwound'); }
  if ((t = traitOf(att, 'foresight')) && isBreak) { v += t.add; trig(att, 'foresight'); }
  if (isBreak && att.brkAtk) v += att.brkAtk;   // ハレの「はしゃぎ」:BREAKの一撃のATK
  if ((t = traitOf(att, 'sway'))) { v += att.turn % 2 === 1 ? t.atk : -t.minus; trig(att, 'sway'); }   // ユラギ
  if ((t = traitOf(att, 'giantSlayer')) && att.giant) { v += t.atk; trig(att, 'giantSlayer'); }   // 相手が1体だけのチーム(ソロのボス戦)のとき
  if ((t = traitOf(att, 'rush')) && (att.turn <= t.until || att.turn >= t.from)) { v += att.turn <= t.until ? t.early : t.late; trig(att, 'rush'); }
  if ((t = traitOf(att, 'burnout')) && att.turn > t.until) v -= Math.min(t.cap, (att.turn - t.until) * t.step);   // 全力のあとの減速
  if ((t = traitOf(att, 'winStack')) && att.stackAtk) { v += att.stackAtk; trig(att, 'winStack'); }                                                    // 勝つたびに重なる
  return v;
}

// 攻撃1回ぶんのダメージ。att / def は場に出ているカード
// 掛け算するのは「ATK × ダメージ係数 × フィジカル係数 × DFS軽減」だけで、強化・弱体はすべてATKとDFSへの足し引き
function damage(S, att, def, rate, isBreak) {
  // 特性「鏡写し」:自分のATKの代わりに、相手の今のATKで攻撃する
  if (traitOf(att, 'mirrorAtk')) trig(att, 'mirrorAtk');
  let atk = Math.max(ATK_MIN, (traitOf(att, 'mirrorAtk') ? baseAtk(def) : baseAtk(att)) + att.atkUp + traitAtk(S, att, def, isBreak));
  // 特性「遅咲きの刻」:場に出て一定ラリー以降の BREAK だけ、ATKが何倍にもなる
  const lb = isBreak ? traitOf(att, 'lateBreak') : null;
  if (lb && att.turn >= lb.from) { atk *= lb.mul; trig(att, 'lateBreak'); }
  atk = Math.min(ATK_MAX, atk);
  // 特性「見透かし」(ツル・天眼):相手が零の陣営なら、受けるダメージを減らす効果(下の3つ)をすべて無効にする
  const hs = traitOf(att, 'hareSun'), hsOn = !!hs && def.ch.faction === hs.faction;   // ハレの「晴れ渡り」
  if (hsOn) trig(att, 'hareSun');
  const see = traitOf(att, 'seeThrough'), seeOn = (!!see && def.ch.faction === see.faction) || hsOn;
  if (seeOn && (def.cut || (isBreak && traitOf(def, 'unbreak')) || (!def.captured && traitOf(def, 'outside')))) trig(att, 'seeThrough');
  const ub = isBreak && !seeOn ? traitOf(def, 'unbreak') : null;   // 特性:BREAKの被ダメージを減らす
  const out = !def.captured && !seeOn ? traitOf(def, 'outside') : null;   // 特性「時の外側」
  if (ub) trig(def, 'unbreak');
  if (out) trig(def, 'outside');
  // 特性「継ぎ刻」(アワイ):前の番手にアワイがいた味方の BREAK は強くなる(レイはさらに)
  let tk = 1;
  if (isBreak) { const tm = S.teams.find((t) => t.cards.includes(att)), i = tm ? tm.cards.indexOf(att) : -1, sc = i > 0 ? tm.cards.slice(0, i).find((c) => traitOf(c, 'tsugiKoku')) : null, src = sc && traitOf(sc, 'tsugiKoku'); if (src) { tk = att.ch.id === 'rei' ? src.rei : src.mul; trig(sc, 'tsugiKoku'); } }
  return Math.round(atk * rate * att.ch.phys * (1 - dfsVs(att, def, isBreak) / 10000) * (ub ? 1 - ub.cut : 1) * (out ? 1 - out.cut : 1) * tk * (def.cut && !seeOn ? 1 - def.cut : 1) * (hsOn ? hs.mul : 1));
}

const modText = (m, short) => (short
  ? `${m.to === 'self' ? '自' : '敵'}${m.stat === 'atk' ? 'ATK' : 'DFS'}${m.v > 0 ? '+' : '−'}${Math.abs(m.v)}(${m.t})`
  : `${m.to === 'self' ? '自分' : '相手'}の${m.stat === 'atk' ? 'ATK' : 'DFS'}${m.v > 0 ? '+' : '−'}${Math.abs(m.v)}(${m.t}ラリー)`);
const RATE_SHORT = { 1: '通常', 1.25: '大', 1.5: '特大', 2: '極大' };

// 技の説明。rate を渡すと、いま実際に出るダメージ段階で表示する。short は対戦画面用の短い書き方
function describe(a, rate, short) {
  const parts = [];
  // 係数の数値は裏データなので出さない
  if (a.rate) parts.push(short ? RATE_SHORT[rate || a.rate] + (a.up && !rate ? `(${a.up.text})` : '') : RATE_LABEL[rate || a.rate] + (a.up ? `(${a.up.text})` : ''));
  if (a.heal) parts.push(`HP${a.heal}回復`);
  if (a.atkUp) parts.push(short ? `次撃ATK+${a.atkUp}` : `次の攻撃ATK+${a.atkUp}`);
  if (a.dfsUp) parts.push(short ? `次被弾DFS+${a.dfsUp}` : `次の被弾DFS+${a.dfsUp}`);
  (a.mods || []).forEach((m) => parts.push(modText(m, short)));
  if (a.poison) parts.push(short ? `時蝕${a.poison}` : `時蝕${a.poison}ラリー`);
  if (a.cleanse) parts.push(short ? 'デバフ・時蝕解除' : '自分のデバフと時蝕を消す');
  if (a.cure) parts.push(short ? '時蝕解除' : '自分の時蝕を消す');
  if (a.streak) parts.push(short ? `連勝+${a.streak}` : `自分の連勝+${a.streak}`);
  if (a.breakNow) parts.push(short ? `${BREAK_NAME}確定` : `勝つと${BREAK_NAME}確定`);
  if (a.seal) parts.push(short ? '連勝封じ' : '相手の次の勝ちを連勝に数えない(連勝封じ)');
  if (a.keep) parts.push(short ? '連勝保護' : '次に負けても連勝が途切れない(連勝保護)');
  if (a.noheal) parts.push(short ? `回復封じ${a.noheal}` : `相手の回復を${a.noheal}ラリー封じる`);
  if (a.dispel) parts.push(short ? 'バフ消し' : '相手のバフをすべて消す');
  if (a.resetStreak) parts.push(short ? '連勝リセット' : '相手の連勝を0にする(連勝保護も無視)');
  if (a.mark) { const L = a.mark.stat === 'atk' ? 'ATK' : 'DFS'; parts.push(short ? `敵${L}−${a.mark.v}永続` : a.mark.cap ? `相手の${L}−${a.mark.v}(刻印。消えず、重ねがけで最大−${a.mark.cap})` : `相手の${L}が永続で−${a.mark.v}(効果は重複する)`); }
  if (a.teamBreak) parts.push(short ? `控え${BREAK_NAME}ATK+${a.teamBreak.v}` : `控えの味方全員の「${BREAK_NAME}の一撃 ATK」+${a.teamBreak.v}(消えず、重ねがけで最大+${a.teamBreak.cap})`);
  if (a.voidCharge) parts.push(short ? '次のあいこ×2' : '次のあいこの「無の間」のダメージが2倍');
  if (a.purge) parts.push(short ? '強化・弱体消し' : '相手の強化と弱体をすべて消す');
  if (a.nextCut) parts.push(short ? '次番手被ダメ↓' : '次の番手が受けるダメージが永続で−5%。レイなら効果がアップ(効果は重複しない)');
  if (a.foeTeamMark) { const L = a.foeTeamMark.stat === 'atk' ? 'ATK' : 'DFS'; parts.push(short ? `敵全員${L}−${a.foeTeamMark.v}` : `相手の全員(控えも)の${L}−${a.foeTeamMark.v}(消えず、重ねがけで最大−${a.foeTeamMark.cap})`); }
  if (a.selfPerm) { const sp = [a.selfPerm.atk && `ATK+${a.selfPerm.atk}`, a.selfPerm.dfs && `DFS+${a.selfPerm.dfs}`].filter(Boolean).join('・'); parts.push(short ? `自${sp}永続` : `自分の${sp}(消えず、重ねがけできる)`); }
  if (a.team) { const L = a.team.stat === 'atk' ? 'ATK' : 'DFS'; parts.push(short ? `${a.team.bench ? '控え' : '全員'}${L}+${a.team.v}` : a.team.bench ? `控えの味方全員の${L}+${a.team.v}(消えず、上限なし)${a.team.rei ? '。レイなら効果がアップ' : ''}` : `味方全員(控えも)の${L}+${a.team.v}(消えず、重ねがけで最大+${a.team.cap})`); }
  if (a.nextAtkUp) parts.push(short ? `次番手ATK+${a.nextAtkUp}` : `次の番手の最初の攻撃ATK+${a.nextAtkUp}`);
  if (a.nextDfsUp) parts.push(short ? `次番手DFS+${a.nextDfsUp}` : `次の番手の最初の被弾DFS+${a.nextDfsUp}`);
  return parts.join(short ? '・' : '、');
}

// 陣営ボーナス:プレイヤー用のキャラ3枚を同じ陣営でそろえると、全員に効果が付く(ソロの敵には付かない)
const FACTION_BONUS = {
  '錨': { dfs: 1000, text: 'DFS+1000' },
  '零': { hp: 2000, text: '最大HP+2000' },
  '矢': { atk: 1000, text: 'ATK+1000' },

function factionBonus(chars) {
  if (chars.length !== TEAM_SIZE || !chars.every((ch) => ch.faction === chars[0].faction && (ch.bonusOk || ch.gacha || CHARACTERS.some((c) => c.id === ch.id)))) return null;
  const b = FACTION_BONUS[chars[0].faction];
  return b ? { ...b, faction: chars[0].faction } : null;
}
// 後ろの番手に効果を渡す技・特性が発動した記録(画面の「かかっている効果」に回数つきで出す)
function relay(t, key, label, text) {

}
function newTeam(label, chars) {

      facAtk: fb && fb.atk ? fb.atk : 0, facDfs: fb && fb.dfs ? fb.dfs : 0, fac: fb,   // 陣営ボーナス
      atkUp: 0, dfsUp: 0,          // 次の1回だけ
      turn: 0, kills: 0,           // 場に出てからのラリー数 / 倒した数
      atkBonus: 0, dfsBonus: 0,    // 場にいる間ずっと(特性「記録」で渡される)
      dfsGain: 0,                  // 特性「不動」の累積
      max: ch.hp + hpUp,           // 最大HP(特性「舫い」や陣営ボーナスで増える)
      teamAtk: 0, teamDfs: 0,      // 味方全員への強化(消えない)
      markAtk: 0, markDfs: 0,      // 刻印(消えない弱体。マイナスの値)
      noHeal: 0,                   // 回復封じの残りラリー数
      mods: [],                    // ラリー数つきのバフ・デバフ { stat, v, t, fresh }
